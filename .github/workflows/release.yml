name: Bootstrap Release

# ══════════════════════════════════════════════════════════════════════════════════════════════
# THE RELEASE COMPILES NOTHING. IT PROMOTES.
#
# ── WHY (owner ruling 2026-07-26) ─────────────────────────────────────────────────────────────
# "release muda para pegar os artefatos e republicar com tag correta e os nomes corretos dos
# arquivos, só, nada mais. Ele tem que saber encontrar o último build e torná-lo um entregável,
# além de remover o build por não ser mais necessário (virou versão oficial)." And the argument,
# which is the part worth keeping: "se o binário gerado na primeira etapa, que passou todos os
# gates é válido, release só precisa promover, não tem que recompilar e 'jogar fora' algo provado."
#
# THE POINT IS NOT RUNNER MINUTES. IT IS THAT RECOMPILING PUBLISHES BYTES NO GATE EVER SAW.
# The workflow this replaces seeded a compiler, emitted the tag's teko.c and built every artifact
# from scratch at tag time. Those artifacts were SIBLINGS of the ones CI validated — same source,
# different build, zero gates. Every release published so far carries that defect. Promotion
# closes it by construction: the artifact that passed the gates IS the deliverable.
#
# ── AND IT IS WHERE THE LAST CROSS-COMPILER DIED ──────────────────────────────────────────────
# The deleted build body cross-compiled the Linux artifacts through
# scripts/cross_compile_linux.sh. Owner, same day: "O zig deve morrer agora, imediatamente, sem
# espera, assim que entregar a carga, já deve estar morto." Both that script and this workflow's
# build body are gone. The Linux artifacts are produced by the target's OWN native toolchain in
# the PR lane (scripts/native_linux_asset.sh) and are simply carried here.
#
# ══════════════════════════════════════════════════════════════════════════════════════════════
# WHERE THE BYTES COME FROM: `.github/workflows/nightly.yml`.
#
# It runs on every push to `main`, executes the SAME producers pr.yml's `artifact` root runs (the
# shared scripts/produce_assets.sh over the shared scripts/ci_producer_matrix.sh leg table), and
# publishes a PRERELEASE holding the seven assets plus the portable bootstrap snapshot.
#
# THE TAG IS AN EXACT NAME, NEVER A SEARCH:
#
#     v<A.B.C.D>-nightly_<sha8>
#
# derived by scripts/nightly_tag.sh — the SAME script the publisher calls to mint it and this
# workflow calls to find it. That sharing is not tidiness: the failure mode of two hand-copied
# derivations is not a warning and not a red lane, it is this workflow reporting "no nightly to
# promote" and stopping, discovered only when a release is being cut. One character of drift costs
# a release.
#
# <A.B.C.D> is teko.tkp's version — its 4th field IS the build number, which is exactly what the
# ruling asks the `*` to become. <sha8> is the first 8 hex of the commit the artifacts were built
# from, i.e. the commit this tag points at.
#
# WHAT MAKES THE DELETE AT THE END SAFE (and it is checked, not assumed — see step 4): because the
# name is a function of (build number, commit), two nightlies can only coexist if they came from
# DIFFERENT commits, and then they have different names. The one deleted is by construction the
# one that was just downloaded — the delete step reuses the very output the download used, and
# re-verifies the tag resolves to THIS commit before removing anything.
#
# NOTE ON THE workflow_dispatch VERSION OVERRIDE: it changes the tag this workflow PUBLISHES, not
# the nightly it looks for. The nightly was named from teko.tkp at build time, so the lookup stays
# keyed on the manifest — which is correct, and is why the override cannot make the build
# unfindable.
# ══════════════════════════════════════════════════════════════════════════════════════════════
on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Release version / tag. LEAVE EMPTY to use the teko.tkp-derived tag
          (the manifest is the source of truth). Provide a value ONLY to override
          for a one-off.
        required: false
        default: ""
      dry_run:
        description: >-
          Resolve and stage the promotion — download the nightly's assets, give them their
          official names and re-checksum them — but do NOT publish and do NOT delete the nightly.
        required: false
        default: "false"
  push:
    tags:
      - "v*"

# Publishing a Release, and deleting the promoted nightly, both need contents: write.
permissions:
  contents: write

jobs:
  promote:
    # NEVER on a fork (owner ruling 2026-07-18): a fork has no nightly and no business publishing
    # a canonical release, even if a tag lands there or someone hits workflow_dispatch on it.
    if: github.repository == 'teko-org/teko-lang'
    name: promote the gated build to a release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The manifest is the SOURCE OF TRUTH for the version. A pushed tag that disagrees with it
      # is refused rather than published: the tag is a claim about the manifest, and a claim that
      # does not match its subject is a mislabelled release.
      - name: Resolve the version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -eu
          DERIVED="$(sh scripts/derive_version.sh)"
          echo "teko.tkp-derived tag = $DERIVED"
          if [ "$EVENT_NAME" = "push" ]; then
            V="${GITHUB_REF#refs/tags/}"
            if [ "$V" != "$DERIVED" ]; then
              echo "::error::Pushed tag '$V' does not match the teko.tkp-derived tag '$DERIVED'." >&2
              echo "The manifest (teko.tkp) is the source of truth — bump its 'version'/'suffix'" >&2
              echo "so the derived tag becomes '$V', or push the tag the manifest sanctions." >&2
              exit 1
            fi
            echo "Pushed tag '$V' matches the manifest-derived tag — OK."
          elif [ -n "$INPUT_VERSION" ]; then
            V="$INPUT_VERSION"
            echo "Using workflow_dispatch override version = $V (manifest-derived was $DERIVED)"
          else
            V="$DERIVED"
            echo "workflow_dispatch input empty — using manifest-derived version = $V"
          fi
          # The NUMBER: no leading v, no prerelease suffix. This is what a nightly tag is keyed
          # on, because a nightly is cut from a COMMIT, not from a suffix decision made later.
          NUM="${V#v}"; NUM="${NUM%%-*}"
          echo "version=$V"  >> "$GITHUB_OUTPUT"
          echo "number=$NUM" >> "$GITHUB_OUTPUT"
          echo "Release version = $V (number $NUM)"

      # ── 1. FIND THE BUILD ────────────────────────────────────────────────────────────────────
      # ONE exact tag name, computed by the SAME script nightly.yml used to mint it. No "newest
      # prerelease", no date sort, no pattern match, and deliberately NO second accepted spelling:
      # every additional form a lookup accepts is another way for the wrong build to be promoted —
      # and then deleted.
      - name: Resolve the nightly to promote
        id: nightly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          NIGHTLY="$(sh scripts/nightly_tag.sh "$GITHUB_SHA")"
          echo "this tag points at commit $GITHUB_SHA"
          echo "looking for the nightly release '$NIGHTLY'"
          if ! gh release view "$NIGHTLY" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::No nightly build exists to promote." >&2
            echo "Looked for the EXACT tag '$NIGHTLY' (scripts/nightly_tag.sh)." >&2
            echo "" >&2
            echo "This workflow builds nothing (owner ruling 2026-07-26): the artifact that passed" >&2
            echo "the gates IS the deliverable, and recompiling here would publish bytes no gate" >&2
            echo "ever saw. It promotes what .github/workflows/nightly.yml published for THIS" >&2
            echo "commit. If that name does not exist, either the nightly for this commit never" >&2
            echo "ran or it failed — check that workflow's run on $GITHUB_SHA. Reviving a build" >&2
            echo "here is not the fix." >&2
            echo "" >&2
            echo "Releases currently visible:" >&2
            gh release list --repo "$GITHUB_REPOSITORY" --limit 30 >&2 || true
            exit 1
          fi
          echo "tag=$NIGHTLY" >> "$GITHUB_OUTPUT"
          echo "promoting nightly '$NIGHTLY'"

      # ── 2. GIVE THE ASSETS THEIR OFFICIAL NAMES ──────────────────────────────────────────────
      # The official names are what scripts/package_release.sh already emits — `teko-<label>.tar.gz`
      # / `.zip`, `teko-bootstrap-src.tar.gz`. A nightly that stamped `-nightly` (with or without
      # the sha8) into its FILE names is normalised here; one that did not is untouched. The
      # checksum manifest is REGENERATED rather than carried, so SHA256SUMS.txt always describes
      # the bytes and the names actually published.
      - name: Download the nightly's assets and give them their official names
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHTLY: ${{ steps.nightly.outputs.tag }}
        run: |
          set -eu
          rm -rf release; mkdir -p release
          gh release download "$NIGHTLY" --repo "$GITHUB_REPOSITORY" --dir release --pattern '*'
          echo "=== as downloaded ==="
          ls -la release/

          rm -f release/SHA256SUMS.txt
          for f in release/*; do
            b="$(basename "$f")"
            n="$(printf '%s' "$b" | sed -E 's/-nightly(_[0-9a-f]{8})?//')"
            if [ "$b" != "$n" ]; then
              mv "$f" "release/$n"
              echo "renamed $b -> $n"
            fi
          done

          ( cd release && sha256sum ./* > sums.tmp && sed 's|\./||' sums.tmp > SHA256SUMS.txt && rm -f sums.tmp )
          echo "=== official names ==="
          ls -la release/
          echo "=== SHA256SUMS.txt ==="
          cat release/SHA256SUMS.txt

          # A promotion that carried no binary is a promotion of nothing. Refuse, rather than
          # publish an empty release that looks like a successful one.
          if ! ls release/teko-*.tar.gz release/teko-*.zip >/dev/null 2>&1; then
            echo "::error::the nightly '$NIGHTLY' carried no teko-*.tar.gz / teko-*.zip asset" >&2
            exit 1
          fi

      - name: Write release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.version.outputs.version }}
          NIGHTLY: ${{ steps.nightly.outputs.tag }}
        run: |
          set -eu
          cat > release/NOTES.md <<EOF
          # Teko $V

          Self-hosted \`teko\` compiler binaries. **These are the exact artifacts CI validated** —
          promoted from the gated build \`$NIGHTLY\`, byte for byte. The release compiles nothing:
          re-building at tag time would publish a sibling of the tested binary that no gate ever
          saw.

          Every Linux artifact is built with the TARGET's own native toolchain — glibc against a
          glibc-2.28 sysroot for wide compatibility, musl fully static. No cross-compiler is
          involved.

          ## Artifacts
          Linux ships **glibc** (dynamic; needs glibc >= 2.28) and **musl** (fully static; runs
          anywhere) for **x86_64** and **arm64**:
          - \`teko-linux-{x86_64,arm64}-glibc.tar.gz\`
          - \`teko-linux-{x86_64,arm64}-musl.tar.gz\`
          - \`teko-macos-arm64.tar.gz\`, \`teko-windows-x86_64.zip\`
          - \`teko-bootstrap-src.tar.gz\` — the portable, **any-cc** bootstrap snapshot: the
            generated \`teko.c\` plus the exact minimal runtime it links.
          - \`SHA256SUMS.txt\` — checksums of every artifact, regenerated over the promoted bytes.

          ## Building from the portable \`teko.c\` snapshot
          Unpack \`teko-bootstrap-src.tar.gz\` and build with any C23 compiler:

          \`\`\`sh
          tar xzf teko-bootstrap-src.tar.gz
          cd teko-bootstrap-src
          cc -std=c23 -Iruntime -Iassert \\
             teko.c runtime/teko_rt.c assert/assert.c \\
             -lm -o teko          # or run ./build.sh
          \`\`\`

          MSVC is not supported — the runtime uses \`__int128\` and other GCC/Clang extensions.
          EOF
          echo "wrote release/NOTES.md"

          # Append GitHub's auto-generated changelog against the CORRECT predecessor. GitHub's
          # /releases API is NOT version-ordered, so its auto-picked "previous tag" is wrong.
          # Compute the predecessor by VERSION — the highest published version-tag below this one
          # — and pass it to generate-notes. Nightly tags are excluded: they are transitory and
          # are never a predecessor.
          PRED="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq 'map(select(.draft | not) | .tag_name)[] | select(test("^v?[0-9]+([.][0-9]+){3}"))' \
            | grep -v -- '-nightly' \
            | grep -vxF "$V" \
            | awk '{ o=$0; v=$0; sub(/^v/,"",v); print v"\t"o }' | sort -V | tail -n1 | cut -f2)"
          if [ -n "$PRED" ]; then
            echo "changelog predecessor (by version) = $PRED"
            BODY="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$V" -f previous_tag_name="$PRED" --jq '.body' 2>/dev/null || true)"
            if [ -n "$BODY" ]; then
              { printf '\n\n## Changes since %s\n\n' "$PRED"; printf '%s\n' "$BODY"; } >> release/NOTES.md
              echo "appended changelog vs $PRED"
            else
              echo "generate-notes returned empty — keeping static notes only"
            fi
          else
            echo "no predecessor version-tag found — first release, no changelog"
          fi

      # ── 3. REPUBLISH UNDER THE VERSION TAG ───────────────────────────────────────────────────
      - name: Create the GitHub Release
        if: github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          # Idempotent: replace assets if the release already exists, else create it.
          if gh release view "$V" >/dev/null 2>&1; then
            echo "Release $V exists — uploading assets (clobber)."
            gh release upload "$V" release/teko-*.tar.gz release/teko-*.zip release/SHA256SUMS.txt --clobber
            gh release edit "$V" --notes-file release/NOTES.md
          else
            echo "Creating release $V."
            ASSETS=""
            for f in release/teko-*.tar.gz release/teko-*.zip release/SHA256SUMS.txt; do
              [ -e "$f" ] && ASSETS="$ASSETS $f"
            done
            PRERELEASE=""
            case "$V" in *-*) PRERELEASE="--prerelease" ;; esac
            # shellcheck disable=SC2086
            gh release create "$V" \
              --title "Teko $V" \
              --notes-file release/NOTES.md \
              $PRERELEASE \
              $ASSETS
          fi

      # ── 4. DELETE THE PROMOTED BUILD ─────────────────────────────────────────────────────────
      # "além de remover o build por não ser mais necessário (virou versão oficial)". The nightly
      # was transitory by construction; once its bytes carry a version tag, leaving it behind
      # would offer two names for one artifact and make "which one is the release" a question.
      # The tag goes with it: a dangling `-nightly` tag keeps the release list noisy and would let
      # a later promotion resolve a build whose assets are gone.
      #
      # ORDER MATTERS: this runs AFTER the publish step, so a failed publish leaves the nightly
      # intact and the promotion re-runnable.
      - name: Delete the promoted nightly build
        if: github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHTLY: ${{ steps.nightly.outputs.tag }}
        run: |
          set -eu
          # THE WRONG-NIGHTLY GUARD. `$NIGHTLY` is the very output the download step used, so the
          # thing deleted is the thing promoted by construction. Two belts on top of that, because
          # this is the one irreversible step in the workflow:
          #   1. RE-DERIVE the name and refuse if it moved. A tag name is a function of (build
          #      number, commit); if re-deriving it now yields something else, the manifest changed
          #      under the run and nothing should be deleted.
          #   2. ASSERT THE TAG POINTS AT THIS COMMIT. Two nightlies can only coexist if they came
          #      from different commits — and then they have different names — but a name is only
          #      trustworthy if the tag behind it really resolves where it claims. Checked against
          #      the git ref, not against the release's targetCommitish (which is a branch name for
          #      a release created from a branch and would prove nothing).
          EXPECT="$(sh scripts/nightly_tag.sh "$GITHUB_SHA")"
          if [ "$EXPECT" != "$NIGHTLY" ]; then
            echo "::error::the nightly name moved during this run ('$NIGHTLY' -> '$EXPECT')." >&2
            echo "Refusing to delete anything: the assets were promoted from '$NIGHTLY'." >&2
            exit 1
          fi
          TAGSHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${NIGHTLY}" --jq '.object.sha' 2>/dev/null || true)"
          if [ -n "$TAGSHA" ] && [ "$TAGSHA" != "$GITHUB_SHA" ]; then
            echo "::error::tag '$NIGHTLY' resolves to $TAGSHA, not to this release's commit $GITHUB_SHA." >&2
            echo "Refusing to delete a build that is not the one just promoted." >&2
            exit 1
          fi
          echo "deleting the promoted transitional build '$NIGHTLY' (release + tag) at $GITHUB_SHA"
          gh release delete "$NIGHTLY" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes

      - name: Dry run — nothing was published, nothing was deleted
        if: github.event.inputs.dry_run == 'true'
        run: |
          echo "dry_run=true: the promotion was resolved and staged, and stopped before publishing."
          ls -la release/
