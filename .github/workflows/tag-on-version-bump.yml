name: Tag on version bump

# AUTOMATIC ADVANCEMENT of the bootstrap release tag.
#
# The teko.tkp manifest is the version SOURCE OF TRUTH. Two channels cut releases:
#   • main            → the STABLE line (`*-alpha` today, `*-beta`/stable at LTS).
#   • remodel/**       → the wave umbrella's INTERMEDIATE BETA SEED line (`*-beta`).
# When the manifest `version`/`suffix` bump lands on either, this workflow derives the
# tag (scripts/derive_version.sh) and — ONLY if that tag does not already exist on
# the remote — creates an annotated tag at the pushed commit and pushes it.
#
# WHY remodel/** TOO (the intermediate-seed mechanism): the wave umbrella carries NEW
# syntax (unsafe / #must_free / `use ::[…]` / adopt) that the last stable seed cannot
# parse. To let the umbrella dogfood its own features, every sub-PR merged into it bumps
# the teko.tkp BUILD field, and this workflow mints a `0.1.0.N-beta` tag → release.yml
# publishes an intermediate compiler seed built from the umbrella tip. The next sub-PR's
# CI then seeds from THAT beta (ci_provision_teko.sh is channel-aware), so the umbrella
# progressively self-hosts as the wave lands. main is never seeded from an in-progress
# umbrella beta (ci_provision excludes `-beta` on the stable channel).
#
# WHY NOT arbitrary branches: only `main` and the wave umbrellas (`remodel/**`, the
# ratified umbrella-naming convention) mint tags; feature/sub-PR branches never do
# (they don't touch teko.tkp, and a bump there wouldn't be an integration point).
#
# Pushing the tag must trigger .github/workflows/release.yml (its `push: tags:
# '*-bootstrap'` path), which builds + gates + publishes the gen-3 release. This
# workflow therefore does the ONE thing release.yml cannot: mint the tag from the
# manifest automatically.
#
# ⚠️ TAG-PUSH TRIGGERING (RELEASE_TAG_PAT secret): GitHub does NOT emit workflow
# trigger events for a tag pushed with the default GITHUB_TOKEN — so a GITHUB_TOKEN
# tag push would NOT start release.yml. To make the tag actually trigger the release:
#   • PREFERRED: set the repo secret `RELEASE_TAG_PAT` to a Personal Access Token
#     (contents:write). The tag is pushed with that PAT, so the tag-push event fires
#     and release.yml runs automatically. ← add this secret in repo Settings.
#   • FALLBACK (no PAT): the tag is pushed with GITHUB_TOKEN (which will NOT trigger
#     release.yml), and this workflow then EXPLICITLY dispatches the release via
#     `gh workflow run release.yml -f version=$DERIVED` (release.yml exposes a
#     workflow_dispatch with a `version` input). Works without any secret.
# The active path is logged clearly at runtime.
#
# NO RECURSION: this job runs on BRANCH push; release.yml runs on TAG push (or the
# dispatch above). Pushing a tag here does NOT re-trigger this workflow (it has no
# `tags:` trigger), and this workflow never pushes a branch. IDEMPOTENT: if the
# derived tag already exists it skips (logged), so re-running on unrelated commits is
# a no-op.
on:
  push:
    branches:
      - main            # stable channel (*-alpha today)
      - 'remodel/**'    # wave-umbrella beta-seed channel (*-beta) — one intermediate seed per sub-PR merge
    paths:
      - 'teko.tkp'   # the manifest carries the version — only re-tag when it changes

# Creating and pushing a tag requires write access to repository contents.
# `actions: write` is needed for the FALLBACK path (no RELEASE_TAG_PAT): dispatching
# release.yml via `gh workflow run`.
permissions:
  contents: write
  actions: write
  # The release gate resolves the PR this push came from (`commits/<sha>/pulls`) and reads its
  # check runs; both need read access beyond `contents`.
  pull-requests: read
  checks: read

# Never run two taggers concurrently for the same ref — avoids a race where two
# pushes both see the tag missing and both try to create it.
concurrency:
  group: tag-on-version-bump-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    # NEVER on a fork (owner ruling 2026-07-18): tagging + the release it triggers are
    # CANONICAL-repo-only actions. A fork carrying main/remodel/** branches must not
    # mint tags or publish releases.
    if: github.repository == 'teko-org/teko-lang'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      pull-requests: read
      checks: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags so `git tag` / `git push` and existence checks work.
          fetch-depth: 0
          fetch-tags: true

      - name: Derive tag from teko.tkp
        id: derive
        run: |
          DERIVED="$(sh scripts/derive_version.sh)"
          echo "derived=$DERIVED" >> "$GITHUB_OUTPUT"
          echo "teko.tkp-derived tag = $DERIVED"

      # ── RELEASE GATE ────────────────────────────────────────────────────────────
      # The tag minted below triggers release.yml (build + publish), so it must NEVER be created
      # from a red commit. This step VERIFIES the gates instead of waiting for them.
      #
      # BUG FIXED HERE (2026-07-25, romaneio .31): the previous version waited, in a 60-minute
      # loop, for the CI workflows to complete AT $GITHUB_SHA, commenting that "only the
      # workflows that actually run on this push are awaited". They are `on: pull_request:`
      # ONLY. Nothing runs on this push,
      # so the loop awaited runs that cannot exist, burned the full deadline and exited 1: NO TAG
      # was ever minted, and release.yml (which triggers on the tag) was therefore never reached.
      # A gate that cannot pass is worse than no gate: it blocks the release AND costs an hour of
      # runner per attempt.
      #
      # Waiting "at the right SHA" is not the fix either: under squash-merge the commit that lands
      # on main is a NEW commit, and the checks ran on the PR's head, a different SHA. So the gate
      # resolves the PR this commit came from and verifies the checks of ITS head — the runs that
      # actually gated the merge. If the PR cannot be resolved (a direct push, a non-squash merge),
      # this fails LOUD rather than tagging in the dark.
      - name: Gate the release — verify the originating PR's checks were green
        env:
          DERIVED: ${{ steps.derive.outputs.derived }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if git ls-remote --exit-code --tags origin "refs/tags/$DERIVED" >/dev/null 2>&1; then
            echo "SKIP: tag '$DERIVED' already exists — nothing to gate."
            exit 0
          fi
          SHA="$GITHUB_SHA"
          PR_NUM="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/pulls" \
                      --jq '[.[] | select(.merged_at != null)] | sort_by(.merged_at) | last | .number' 2>/dev/null || true)"
          if [ -z "$PR_NUM" ] || [ "$PR_NUM" = "null" ]; then
            echo "ABORT: $SHA does not resolve to a merged pull request."
            echo "This gate verifies the CHECKS OF THE PR HEAD (the workflows here are pull_request-only,"
            echo "so a push commit carries no checks of its own). A direct push to a tagging branch has"
            echo "nothing to verify — land the bump through a PR, or tag by hand deliberately."
            exit 1
          fi
          HEAD_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUM}" --jq '.head.sha')"
          echo "Gating '$DERIVED': $SHA came from PR #$PR_NUM, head $HEAD_SHA — verifying its runs."
          failed=""
          missing=""
          # ONE NAME, since 2026-07-26: `native.yml`, `sanitizers.yml`, `sast.yml` and
          # `tests.yml` were consolidated into `pr.yml` ("Pull Request CI") because `needs:` does
          # not cross workflow files and every lane now has to stand on one artifact root. THIS
          # LIST IS LOAD-BEARING — a name that no longer exists reports "no run found" and this
          # gate ABORTS without tagging, so the release never happens. If the workflow is renamed
          # again, rename it here in the same commit.
          for wf in "Pull Request CI"; do
            info="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}" \
                      --jq "[.workflow_runs[] | select(.name==\"$wf\")] | sort_by(.run_number) | last | \"\(.status)|\(.conclusion)\"" || true)"
            st="${info%%|*}"
            cc="${info##*|}"
            if [ -z "$info" ] || [ "$info" = "null" ]; then
              echo "  ? $wf — no run found on the PR head"
              missing="$missing [$wf]"
            elif [ "$st" != "completed" ]; then
              echo "  ? $wf — $st (not completed)"
              missing="$missing [$wf=$st]"
            elif [ "$cc" != "success" ]; then
              echo "  x $wf — completed=$cc"
              failed="$failed [$wf=$cc]"
            else
              echo "  ok $wf — success"
            fi
          done
          if [ -n "$failed" ] || [ -n "$missing" ]; then
            echo "ABORT: the required gates are not verifiably green on PR #$PR_NUM head $HEAD_SHA:$failed$missing"
            echo "NOT tagging '$DERIVED'."
            exit 1
          fi
          echo "All required gates GREEN on PR #$PR_NUM head $HEAD_SHA — proceeding to tag + release."

      # ── DO NOT MINT A TAG BEFORE THE BUILD IT WILL PROMOTE EXISTS ───────────────────────────
      # ADDED 2026-07-26, and it closes a race the release redesign created. `release.yml` no
      # longer compiles anything: it PROMOTES the prerelease `nightly.yml` published for this
      # exact commit (owner ruling — "release só precisa promover, não tem que recompilar e
      # 'jogar fora' algo provado"). Both workflows fire on the SAME push, and the nightly is the
      # slow one — its riscv64 producers build under CPU emulation. Minting the tag the moment the
      # PR gate verified would therefore start the release BEFORE its input exists, and the
      # release would abort with "no nightly to promote" on a perfectly good commit.
      #
      # The ordering decision belongs here, next to "do not tag from a red commit": it is the same
      # gate, one input further back. Failing safe means NOT tagging — this workflow is idempotent,
      # so re-running it after the nightly lands mints the tag then.
      #
      # It watches BOTH the release and the workflow run, deliberately: the release appearing is
      # the success condition, but a nightly that FAILED would otherwise be waited on until the
      # deadline for no reason, so a completed-and-not-successful run aborts immediately.
      - name: Wait for the Nightly Build of this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DERIVED: ${{ steps.derive.outputs.derived }}
        run: |
          set -eu
          if git ls-remote --exit-code --tags origin "refs/tags/$DERIVED" >/dev/null 2>&1; then
            echo "SKIP: tag '$DERIVED' already exists — nothing to wait for."
            exit 0
          fi
          NIGHTLY="$(sh scripts/nightly_tag.sh "$GITHUB_SHA")"
          echo "release.yml will promote '$NIGHTLY' (scripts/nightly_tag.sh — the SAME derivation"
          echo "both the publisher and the promoter use). Waiting for it to be published."

          DEADLINE=$(( $(date +%s) + 18000 ))    # 5h, inside the 6h job ceiling
          GRACE=$(( $(date +%s) + 600 ))         # 10 min for the run to even appear
          while :; do
            if gh release view "$NIGHTLY" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "OK: '$NIGHTLY' is published — the release will have something to promote."
              exit 0
            fi
            INFO="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}" \
                     --jq '[.workflow_runs[] | select(.name=="Nightly Build")] | sort_by(.run_number) | last | "\(.status)|\(.conclusion)"' 2>/dev/null || true)"
            ST="${INFO%%|*}"; CC="${INFO##*|}"
            NOW="$(date +%s)"
            if [ -z "$INFO" ] || [ "$INFO" = "null" ]; then
              if [ "$NOW" -gt "$GRACE" ]; then
                echo "ABORT: no 'Nightly Build' run exists for $GITHUB_SHA after 10 minutes."
                echo "release.yml promotes that build and compiles nothing, so tagging now would"
                echo "produce a release that cannot be assembled. NOT tagging '$DERIVED'."
                exit 1
              fi
              echo "  ... no Nightly Build run visible yet (within the 10-minute grace window)"
            elif [ "$ST" = "completed" ] && [ "$CC" != "success" ]; then
              echo "ABORT: the Nightly Build for $GITHUB_SHA completed with conclusion '$CC'."
              echo "There is no build to promote. Fix the nightly, re-run it, then re-run this"
              echo "workflow — it is idempotent. NOT tagging '$DERIVED'."
              exit 1
            else
              echo "  ... Nightly Build status=$ST conclusion=$CC — waiting"
            fi
            if [ "$NOW" -gt "$DEADLINE" ]; then
              echo "ABORT: '$NIGHTLY' was not published within the deadline."
              echo "NOT tagging '$DERIVED' — re-run this workflow once the nightly finishes."
              exit 1
            fi
            sleep 60
          done

      - name: Create + push tag if it does not already exist
        env:
          DERIVED: ${{ steps.derive.outputs.derived }}
          # PREFERRED path secret: a PAT (contents:write). When set, the tag is pushed
          # WITH it, so the tag-push event triggers release.yml. When empty, we fall
          # back to an explicit `gh workflow run` dispatch (see below).
          RELEASE_TAG_PAT: ${{ secrets.RELEASE_TAG_PAT }}
          # GITHUB_TOKEN for the FALLBACK dispatch (`gh workflow run`).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # Ask the REMOTE authoritatively whether the tag exists (not just the
          # local fetch), so the guard is robust even if a fetch missed it.
          if git ls-remote --exit-code --tags origin "refs/tags/$DERIVED" >/dev/null 2>&1; then
            echo "SKIP: tag '$DERIVED' already exists on origin — manifest version not bumped; nothing to do."
            exit 0
          fi

          echo "CREATE: tag '$DERIVED' is missing on origin — the manifest version was bumped."
          # Configure an identity for the annotated tag.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Annotate at the pushed commit (the current HEAD of this checkout).
          git tag -a "$DERIVED" -m "Teko release $DERIVED (auto-tagged from teko.tkp)" "$GITHUB_SHA"

          if [ -n "${RELEASE_TAG_PAT:-}" ]; then
            # ── PREFERRED: push the tag WITH the PAT ──────────────────────────────
            # A tag pushed with a PAT (a real user credential) DOES emit the tag-push
            # event, so release.yml's `push: tags: '*-bootstrap'` path fires on its own.
            echo "PATH=PAT: RELEASE_TAG_PAT is set — pushing the tag with the PAT so release.yml auto-triggers."
            PAT_REMOTE="https://x-access-token:${RELEASE_TAG_PAT}@github.com/${GITHUB_REPOSITORY}.git"
            # A concurrent creator could win the race; treat a rejected push as a
            # benign "already created" and exit 0 (idempotent).
            if git push "$PAT_REMOTE" "refs/tags/$DERIVED"; then
              echo "Pushed tag '$DERIVED' via PAT — release.yml (tag path) will build + publish."
            else
              echo "NOTE: PAT push of tag '$DERIVED' was rejected (it likely now exists via a concurrent run). Treating as already-tagged."
            fi
          else
            # ── FALLBACK: push with GITHUB_TOKEN, then EXPLICITLY dispatch release ──
            # GitHub does NOT emit a workflow trigger event for a GITHUB_TOKEN tag push,
            # so we still create the tag (for provenance / release.yml's checkout) but
            # then dispatch release.yml ourselves. release.yml exposes a
            # workflow_dispatch with a `version` input for exactly this.
            echo "PATH=DISPATCH: RELEASE_TAG_PAT is NOT set — pushing the tag with GITHUB_TOKEN (which does NOT trigger release.yml) then dispatching release.yml explicitly."
            echo "               (Add a RELEASE_TAG_PAT secret in repo Settings to switch to the auto-trigger PAT path.)"
            if git push origin "refs/tags/$DERIVED"; then
              echo "Pushed tag '$DERIVED' via GITHUB_TOKEN."
            else
              echo "NOTE: push of tag '$DERIVED' was rejected (it likely now exists via a concurrent run). Treating as already-tagged."
            fi
            # Dispatch the release AT THE JUST-PUSHED TAG (not the default branch), passing
            # the derived version. This pins every checkout in release.yml to the tagged
            # commit — critical for the beta line, whose tag points at the wave umbrella tip
            # (NOT main): dispatching on main would build main's compiler instead. For the
            # stable line it is strictly safer too (no race if main advances after tagging).
            # release.yml exists on the default branch (registered) AND at the tag (has the
            # workflow_dispatch trigger), so `--ref "$DERIVED"` runs the tag's version.
            echo "Dispatching release.yml at ref=$DERIVED with version=$DERIVED"
            gh workflow run release.yml --ref "$DERIVED" -f version="$DERIVED"
            echo "Dispatched release.yml — it will build + gate + publish '$DERIVED'."
          fi
