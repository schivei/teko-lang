# .github/workflows/agent-fast-lane.yml — THE AGENT'S FAST LANE: one runner, one question,
# answered faster than any agent can answer it locally.
#
# Owner ruling 2026-07-27: *"recomendo fazer a mesma técnica de degrau do 15, mas partindo do
# teko.c do 15, assim consegue chegar em uma gen2 e gen3 realmente nativa, pode usar uma theory
# para validar e encontrar ao invés de queimar muitos runners, algo simples, finalizar a escada e
# passar fixpoint + testes, nada mais, validado isso, reaplica no vagão 20."*
#
# WHAT MAKES THIS A THEORY AND NOT A LANE. It gates NOTHING and publishes NOTHING. Its whole job is
# to answer one question per push — "what stops the compiler from building itself today?" — and
# print the address. The wagon's own six sublanes answer the same question, but they cost six
# runners plus every downstream lane to say it once. This costs ONE.
#
# WHY IT IS SO SHORT, and the shortness is the design rather than a corner cut. Three steps:
#
#   1. release -> gen0 -> gen1, both links `TEKO_BACKEND=c`
#   2. fixpoint: gen2 = gen1(src), gen3 = gen2(src) -> the verdict, with the degrau's address
#   3. `teko test .`                                -> the suite, only if the fixpoint held
#
# No assets, no staging, no matrix, no artifact upload, no downstream anything. Every one of those
# exists to SHIP a compiler; none of them helps answer whether the compiler can rebuild itself. A
# theory that reproduces the production pipeline is just a slower copy of it.
#
# ONE LEG, macos-arm64, ON PURPOSE — and the arch is chosen for SPEED, not coverage.
#
# The degraus this hunts (`ltype_of(Named) = Ptr`, aggregate value semantics, the per-instruction
# frame slot) live in the SHARED front half of lowering, not in an arch backend — they reproduce
# identically everywhere, as the wagon's own six lanes have shown all day by failing with the same
# sentence on every one. So the leg is free to be picked on wall-clock alone, and the macOS runner
# wins by a wide margin. Measured on the SAME tree and the SAME phase, from this wagon's own logs:
#
#     macos-arm64     checker 5940/5940 items     2.2s
#     linux-x86_64    checker 5940/5940 items    14.6s
#
# 6.6x on the checker. Owner, 2026-07-27: *"usa o macOS, que é comprovadamente o mais rápido."*
# A theory is a loop a human waits inside — the runner that shortens the wait is the right runner.
#
# WHEN A DEGRAU TURNS OUT TO BE PLATFORM-SPECIFIC, SWAP THE HOST — DO NOT ADD A LEG. Owner ruling
# 2026-07-27: *"vamos escalar pelos mais rápidos, logo, se passar verde e o vagão apontar vermelho,
# foca no vermelho mais rápido, e o anterior basta trocar o host do CI da theory."* The `runner`
# dispatch input exists for exactly that, so the swap costs no commit.
#
# The working order that follows from it:
#
#   1. iterate on the FASTEST host until the theory is green there;
#   2. reapply to the wagon; if a sublane still reds, pick the FASTEST of the red ones;
#   3. dispatch this theory with `runner` set to THAT host and iterate there, still one lane;
#   4. repeat until no sublane reds.
#
# What this buys is that a platform-specific defect is hunted at ONE runner's cost instead of the
# wagon's six-plus-downstream, and the hunt always runs on the quickest host that can still SEE the
# defect. A second permanent leg would pay for coverage on every push to answer a question that is
# only ever asked after a specific red — the wagon already provides that coverage.
#
# HOW IT IS MEANT TO BE USED: push, read the address, close that degrau on a cargo branch, push
# again. When step 2 finally reports PASSED and step 3 is green, the theory has done its job — and
# the fix, already proven, is reapplied to the wagon (owner: *"validado isso, reaplica no vagão
# 20"*). At that moment the `out/teko.c` this very run produced — gen1's own emitted C, uploaded by
# the harvest step below — is ALREADY the `bootstrap/teko.c` the wagon wants: take it before moving
# on, because the next state may regress. It is a payload, not a rung: committing it does NOT
# re-route anyone's gen0 unless a `bootstrap/DEGRAU` says so (scripts/degrau.sh).
#
# DELETE THIS FILE when the wagon self-hosts. It has no reason to outlive that day.
name: agent fast lane · self-host (one runner, one question)

# FIRES ON PUSH TO `cargo/**` AND `theory/**`. Owner ruling 2026-07-28: *"já vimos que macOS no CI é
# muito rápido, os agentes não são capazes de serem melhores que isso, sugiro que, se eles querem
# testar, criem CI de push para Mac e executem o que querem lá, mais rápido que tentarem rodar toda
# a cadeia por eles mesmos."*
#
# THIS REVERSES MY OWN EARLIER SCOPING, and the reversal is worth recording because the first
# reasoning was wrong in a specific way. I had excluded `cargo/**` to avoid "burning dozens of
# runners" on intermediate commits — comparing a runner against NOTHING. The real alternative is not
# nothing: it is an AGENT BLOCKED FOR ~6 MINUTES per build, in a container slower than the runner.
# Measured, same tree, same phase: macOS does the checker in 2.2s where linux-x86_64 takes 14.6s.
# The agent cannot win that race. A runner spent here BUYS agent time; a runner not spent costs it.
#
# So agents are told to push and read the lane instead of building locally. The intermediate commits
# they were already ordered to make (push early, push often, so a dropped session costs nothing) now
# double as measurement requests.
on:
  push:
    branches:
      - 'cargo/**'
      - 'theory/**'
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'run `teko test .` after the fixpoint (off = fixpoint only, ~2 min faster)'
        required: false
        default: 'true'
      runner:
        description: 'the host to reproduce on — SWAP this, never add a second leg (see header)'
        required: false
        default: 'macos-latest'
        type: choice
        options:
          - macos-latest
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest

# A TRAVA. O dono apanhou a falta (2026-07-29): *"acredito que faltou uma trava nele"* — e faltava
# mesmo, literalmente: este workflow não tinha bloco `concurrency` NENHUM. Cada push a `cargo/**`
# levantava um runner macOS novo, sem nada a serializar nem a cancelar, enquanto os agentes estão
# sob ordem de "empurrar cedo e empurrar sempre". Quatro agentes vivos multiplicam isso sozinhos.
#
# O âmbito (`cargo/**` + `theory/**`) FICA — o dono confirmou o seu ruling de 2026-07-28 quando lhe
# mostrei que restringir a `theory/**` o reverteria. O desperdício não estava no âmbito; estava
# nesta ausência.
#
# `cancel-in-progress: true` AQUI, e `false` no `pr.yml`, e a diferença é deliberada: no `pr.yml` o
# dono mandou não cancelar porque um `cancelled` lhe chegou parecendo `failure` (uma corrida viva
# morta por um push meu). Aqui o público é o AGENTE, não o dono, e uma medição de um commit já
# ultrapassado não interessa a ninguém — a que interessa é sempre a última.
#
# Grupo por REF, não por workflow: dois agentes em branches diferentes não se cancelam um ao outro.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-host:
    name: fast-lane / self-host
    runs-on: ${{ github.event.inputs.runner || 'macos-latest' }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `|| true` ON EVERY LINE, and `continue-on-error` on top, because the step is named
      # "never fails the job" and MUST actually not. It did: this ran `nproc`, which does not exist
      # on macOS, and the Actions bash shell runs with `-e` — so the diagnostic killed the run in
      # 15 seconds, before the question was ever asked. A step that reports facts must not be able
      # to invent one.
      - name: Report the host toolchain (diagnostic — never fails the job)
        continue-on-error: true
        shell: bash
        run: |
          cc --version | head -n1 || true
          # nproc is GNU coreutils (Linux); sysctl is the macOS equivalent. Try both, care about
          # neither.
          (nproc || sysctl -n hw.ncpu) 2>/dev/null || true
          (free -m || vm_stat | head -n4) 2>/dev/null || true
          uname -srm || true

      # THE SEED IS PROVISIONED AGAIN, AND THAT IS A DIRECT CONSEQUENCE OF THE DEGRAU RULE.
      #
      # This step used to say "no seed is provisioned and none is needed", because
      # `build_with_seed_fallback.sh` entered through rung -1 — the committed `bootstrap/teko.c`,
      # cc'd by the runner. Owner ruling 2026-07-28 ends that automatism: *"só podemos usar teko.c
      # se e somente se identificarmos degrau."* With no `bootstrap/DEGRAU` in the tree the chain
      # starts where the owner's diagram starts, at the PUBLISHED RELEASE, so this lane has to hand
      # the ladder its first link.
      #
      # THE LABEL IS DERIVED FROM THE RUNNER, not pinned, because the `runner` dispatch input can
      # move this lane between four hosts and a pinned label would silently fetch a binary that
      # cannot run here. An unknown host FAILS instead of guessing — a wrong seed is a wrong answer
      # to the only question this lane exists to ask.
      - name: Provision the published release (the chain's first link)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          case "${RUNNER_OS}/${RUNNER_ARCH}" in
            Linux/X64)    LABEL=linux-x86_64-glibc ;;
            Linux/ARM64)  LABEL=linux-arm64-glibc ;;
            macOS/ARM64)  LABEL=macos-arm64 ;;
            macOS/X64)    LABEL=macos-x86_64 ;;
            Windows/X64)  LABEL=windows-x86_64 ;;
            *)
              echo "no released seed label is known for ${RUNNER_OS}/${RUNNER_ARCH}" >&2
              exit 1 ;;
          esac
          echo "seed label: $LABEL"
          sh scripts/ci_provision_teko.sh "$LABEL"
          ls -la .seed/

      - name: gen1 — release -> gen0 -> gen1 (both links down the C route)
        shell: bash
        run: |
          set -eu
          sh scripts/build_with_seed_fallback.sh out
          ls -la out/

      # THE QUESTION. Everything above is setup; this is the dispatch's actual payload. On failure
      # it prints the named N2 address of whatever the native backend cannot lower yet — which is
      # the ONE fact a dispatch exists to retrieve.
      - name: THE QUESTION — does the compiler rebuild itself, and does gen2 == gen3?
        shell: bash
        run: sh scripts/fixpoint_gate.sh out/teko . .fixpoint

      # THE HARVEST. A passing fixpoint leaves the freshest C known to rebuild this exact tree, and
      # that file is the next `bootstrap/teko.c`. Until this step existed the run DELETED it and kept
      # only the word "PASSED" — the one artifact worth having was thrown away every time.
      #
      # Owner ruling 2026-07-28: *"fechando tudo verde, coletou o teko.c emitido no vagão 20? Acredito
      # que seja importante a coleta, enviar o último teko.c estável da escada."*
      #
      # THE CANDIDATE IS `gen1.c`, and that moved with the chain. gen2/gen3 emit C only while the
      # `TEKO_FIXPOINT_BACKEND` lever is still `c`; once a leg flips it, they emit nothing and gen1 —
      # the last generation built down the C route — is the only source of a harvest at all. Its
      # descendants are what VOUCH for it: `if: success()` means gen2 == gen3 held over the binary
      # that C encodes. A C from a chain that did not prove the fixpoint is not a seed, it is a guess.
      #
      # gen2.c and gen3.c ride along while they exist: byte-identical, they are evidence the C
      # emission reached its own fixpoint; different, the pair IS the bug report.
      # THE PROBE MATRIX — TEMPORARY, and it runs TWICE, under two different compiler generations.
      #
      # Owner ruling 2026-07-28: *"o que é a compilação do que um binário executando em runtime a
      # identidade de um código? Entende o paradoxo? Se o erro é em runtime, ele pode não morar onde
      # estamos olhando."*
      #
      # THE PARADOX, and why one run of the matrix would have been worthless. The compiler is a
      # binary executing: compiling a project IS `teko`'s own run time. The binary doing it is not
      # the checker source anyone reads — gen1 was lowered by gen0, which the published release
      # lowered before it. Reading `check_pattern` and `type_join` and
      # concluding "the source is correct" says nothing about what the RUNNING binary does, and this
      # wagon has already caught two defects of that exact family (the `byte` carrier width, `push`
      # returning the wrong length).
      #
      # So the same ten shapes are compiled by gen1 AND by gen2. Identical tables mean the behaviour
      # is in the source and the hunt belongs in the checker. DIFFERENT tables mean the defect lives
      # in the LINEAGE — one generation mislowered something the next one got right — and no amount
      # of reading the checker would ever have shown it.
      #
      # It runs AFTER the fixpoint because gen2 only exists once the fixpoint has built it, and it
      # never fails: an instrument, not a gate. Delete with the probe directory.
      # FOUR POINTS, NOT THREE, and the fourth is the one the other three cannot substitute for.
      # Owner ruling 2026-07-28: *"comparar a versão .30, a versão do teko.c do vagão 15 e a gen2 …
      # vejamos onde há erro, entre .30 e vagão 15 ou vagão 15 e nativo."*
      #
      # `gen1` is NOT the committed C's compiler. `.rung-c/teko` is that binary, and it now exists
      # ONLY when a `bootstrap/DEGRAU` declares the committed C a rung — with no declaration the
      # chain never cc's it and this point simply has no data, which the step says out loud instead
      # of pretending. `gen0` is the point that always exists: the release's rendering of today's
      # source, one generation behind `gen1`.
      #
      #   .30 → the C's compiler : the released binary vs the last green ladder — did the train's
      #                            own history break it?
      #   gen0 → gen1            : the release's lowering of today's source vs today's own — did
      #                            TODAY'S source break it?
      #
      # Adjacent pairs, and whichever pair flips a case is the half the defect lives in.
      - name: Probe — the SAME shapes under the DEGRAU's compiler (`.rung-c/teko`, never fails)
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          set -u
          if [ -x .rung-c/teko ]; then
              .rung-c/teko --version || true
              sh examples/probes/match_shapes/run.sh .rung-c/teko degrau-c
          else
              echo "match_shapes: no .rung-c/teko — no degrau is declared, so this point has no data"
          fi

      - name: Probe — the SAME shapes under gen0 (the release's lowering, never fails)
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          set -u
          if [ -x .gen0/teko ]; then
              .gen0/teko --version || true
              sh examples/probes/match_shapes/run.sh .gen0/teko gen0
          else
              echo "match_shapes: no .gen0/teko on this runner — the gen0 point has no data"
          fi

      - name: Probe — the ten `match` shapes under gen1 (temporary, never fails)
        continue-on-error: true
        shell: bash
        run: sh examples/probes/match_shapes/run.sh out/teko gen1

      - name: Probe — the SAME ten shapes under gen2 (the paradox test, temporary, never fails)
        continue-on-error: true
        shell: bash
        run: sh examples/probes/match_shapes/run.sh .fixpoint/gen2 gen2

      # STAGED OUT OF `.fixpoint/` FIRST, and the copy is not ceremony — it is the fix for a silent
      # miss. `actions/upload-artifact` excludes hidden files and anything under a dot-directory by
      # default (v4.4+), and the fixpoint's work dir is `.fixpoint`. The first attempt therefore
      # uploaded NOTHING while reporting success in 0s: the gate had written both files, the action
      # simply refused to look at them. `include-hidden-files: true` would also work, but staging to
      # a plain directory does not depend on the action's version, and it gives the log the sizes —
      # which is the evidence a reader needs to trust the seed before committing it.
      - name: Stage the emitted C for harvest (only from a fixpoint that HELD)
        if: ${{ success() }}
        shell: bash
        run: |
          set -eu
          mkdir -p harvest
          # `if`, never `[ -f … ] && cp` — under `set -e` the && chain returns 1 for a missing file
          # and kills the step. That exact shape already cost this workflow two runs (the `nproc`
          # diagnostic that was named "never fails the job" and did).
          for g in gen1 gen2 gen3; do
              if [ -f ".fixpoint/$g.c" ]; then cp ".fixpoint/$g.c" "harvest/$g.c"; fi
          done
          if [ ! -f harvest/gen1.c ]; then
              echo "NOTE: no gen1.c — the chain emitted no C to harvest this run (see the gate's log)."
          fi
          ls -la harvest/ || true

      - name: Harvest the emitted C (only from a fixpoint that HELD)
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: teko-c-${{ github.sha }}
          path: harvest/
          if-no-files-found: warn
          retention-days: 30

      # PROVISIONED HERE, AFTER THE FIXPOINT, AND THE ORDER IS THE WHOLE POINT. These two capabilities
      # serve the SUITE and nothing else — the fixpoint needs only `cc`, which every runner already
      # has. Installing them first meant every RED run paid for a toolchain it would never reach:
      # measured on run `dcbea9d`, 39s of brew in front of a verdict that arrived 5s after gen1. That
      # is 39s of an agent's wait, on every failed attempt, buying nothing.
      #
      # Owner ruling 2026-07-28: *"A questão não é acelerar os agentes, mas reduzir o tempo de espera
      # deles."* Moving two steps down the file is the cheapest 26% that exists here — a red run drops
      # from ~150s to ~111s, and a green run pays exactly what it paid before, just later.
      #
      # Mingw and not MSVC — owner ruling 2026-07-27: *"eu não gosto, discordo total de usar essa
      # 'coisa', mas como MSVC exigiria adição de flags em C e não devemos mais emitir C, continue
      # no mingw."* The kept choice is the one that asks nothing of the C seam we are removing.
      # `brew`, not `apt-get` — this leg is macOS. clang ships with the Xcode CLT, so only the two
      # cross capabilities need installing.
      #
      # BOTH ARE PROVISIONED, never one: the suite would SKIP the missing one's rows and
      # `no_skips_gate.sh` would fail the run for a reason that has nothing to do with the question
      # being asked. A lane that reds on its own missing toolchain teaches nothing.
      - name: Provision the two capabilities the SUITE needs (mingw cross-linker, wasmtime)
        if: ${{ github.event.inputs.run_tests != 'false' }}
        shell: bash
        run: |
          set -eu
          brew install mingw-w64 wasmtime

      - name: Verify both are on PATH (fail loud before the suite, not inside it)
        if: ${{ github.event.inputs.run_tests != 'false' }}
        shell: bash
        run: |
          set -eu
          x86_64-w64-mingw32-gcc --version | head -n1
          wasmtime --version

      # Only reached when the fixpoint HELD. A suite run before that point would be testing a
      # compiler already known not to reproduce itself — the owner's own words: *"se nem consegue
      # gerar gen2, nem tem que perder tempo com testes"*.
      - name: The suite (only reachable once the fixpoint holds)
        if: ${{ github.event.inputs.run_tests != 'false' }}   # vazio num push => roda
        shell: bash
        env:
          REGRESSION_REQUIRE_TOOLS: "1"
        run: |
          set -eu
          ./out/teko test . --arith-cast-gate 2>&1 | tee teko-test.log

      - name: No skips — every declared row must have run
        if: ${{ always() && github.event.inputs.run_tests != 'false' && hashFiles('teko-test.log') != '' }}
        shell: bash
        run: sh scripts/no_skips_gate.sh teko-test.log

  # THE .30 ANCHOR RUNS ON ITS OWN LEG, ON LINUX, and the split is forced by the artifact rather
  # than chosen. Owner, 2026-07-28: *".30 está como release na fork"* — and it is, but the fork's
  # release says what it is: *"Dry fork-scoped **linux-x86_64-glibc** seed … Canonical
  # multi-platform release lives on the org."* One binary, one platform, and not the platform the
  # fast lane runs on. Asking a macOS runner for a `macos-arm64` asset of that release is what
  # produced "no usable seed" — the asset does not exist, and no retry was going to conjure it.
  #
  # A DIFFERENT HOST IS ACCEPTABLE HERE, and this workflow already argues why: the shapes under test
  # live in the SHARED front half of lowering, not in an arch backend, which is the same reasoning
  # that lets the fast lane pick its runner on wall-clock alone. A lowering stop reproduces
  # identically across hosts — the wagon's six legs spent all day proving exactly that by failing
  # with one sentence everywhere.
  #
  # It needs no gen1 and no fixpoint: it downloads a published compiler and asks it the same 29
  # questions. Under a minute, and it never fails.
  anchor:
    name: theory / .30 anchor (the published seed, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provision the published 0.3.0.30-beta seed FROM THE FORK
        id: seed
        continue-on-error: true
        shell: bash
        env:
          TEKO_SEED_REPO: schivei/teko-lang
        run: |
          set -eu
          sh scripts/ci_provision_teko.sh linux-x86_64-glibc
          ls -la .seed/ || true

      - name: Probe — the 29 shapes under the PUBLISHED .30 (temporary, never fails)
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          set -u
          if [ -x .seed/teko ]; then
              .seed/teko --version || true
              sh examples/probes/match_shapes/run.sh .seed/teko seed-0.3.0.30
          else
              echo "match_shapes: the fork's .30 seed did not provision — anchor has no data this run"
          fi
