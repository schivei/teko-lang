name: Pull Request CI

# ══════════════════════════════════════════════════════════════════════════════════════════════
# THE SINGLE `pull_request` WORKFLOW. It replaces, and deletes, four files:
#   native.yml (Native Build & Test) · tests.yml (Tests) · sanitizers.yml (Sanitizers & Stress)
#   · sast.yml (SAST Gate)
#
# ── WHY ONE FILE (owner ruling 2026-07-26) ────────────────────────────────────────────────────
# "todas as lanes de pull_request precisam depender dessa lane de artefatos, a lane de artefatos
# deve executar build seco `teko build . --no-verify --release` e ela deve ter a inteligência
# sobre o que deve gerar (a escada)" — and, when the structural consequence was put to him,
# "mesmo que custe (exceto a algumas de push) colocar tudo no mesmo yml" / "se não atravessa,
# transforme em um único yaml, os únicos independentes são os que esperam push".
#
# The structural consequence is a GitHub Actions primitive and there is no way around it:
# `needs:` DOES NOT CROSS WORKFLOW FILES. For every lane to depend on the producer legs, every
# lane has to live where those legs live. The cost is a large file; the alternative was eleven
# jobs each paying for its own seed provision and its own self-host before doing its own work,
# which is what was measured here before this wagon.
#
# STILL INDEPENDENT, and deliberately so:
#   codeql.yml       — `pull_request`, but owner ruling 2026-07-26: "CodeQL é independente, até
#                      pq, provavelmente, ainda teremos uma rodada pós linker para ensinar o
#                      CodeQL e o dependabot a analisarem teko." It is separable ON PURPOSE
#                      because it has its own wave coming. Consolidating it now would only create
#                      work to undo. Its required check (`CodeQL`) is published by the
#                      code-scanning service, not by a job name, and leaving the file where it is
#                      keeps that name out of the blast radius entirely.
#   branch-policy.yml — `pull_request`, but it is a source-namespace cancel that runs in seconds
#                      with no checkout and no compiler. Rooting it on a producer leg would
#                      make the CHEAPEST and FASTEST refusal in the repo wait on the most
#                      expensive job, and it can never be affected by anything a producer leg
#                      produces.
#   release.yml, tag-on-version-bump.yml, mirror-pr-to-org.yml, seed-linux-fork.yml — push /
#                      workflow_dispatch. Out of the ruling by its own terms.
#
# ── THE REQUIRED CHECKS ARE INVIOLABLE ────────────────────────────────────────────────────────
#   CI gate · Test suite gate · Sanitizer gate
# They are the only required checks on `main`, and `main` has NO BYPASS — not even for the owner.
# A name that stops reporting does not go red; it goes PENDING FOREVER and jams the drain. So
# these three names survive this consolidation verbatim, and scripts/ci_gate_coverage.sh asserts
# their exact spelling on every run. Leaf check names are free and several changed.
#
# ── THE TOPOLOGY (REDESIGNED 2026-07-29 — NO SHARED MATRIX ON THE PRODUCER LAYER) ─────────────
# Owner correction, 2026-07-29, to a matrix-plus-`if: always()` proposal that was on the table:
# *"discordo em partes, o que pode fazer é não usar matriz (aumenta o tamanho do yml mas por causa
# maior)... Com uma cadeia própria por perna, um `needs:` vermelho pára a cadeia daquela perna e
# nada mais... A propagação passa a ser o comportamento natural do grafo, não uma correcção por
# cima dele."*
#
# So there is no shared `artifact` job any more, and there is no matrix on the producer layer,
# `test`, `cli-surface` or `ar-validation`. Each of the six producer legs is its OWN job
# (`artifact-<label>`), and every layer that consumes exactly one leg is a SEPARATE job per leg,
# `needs:`-chained to that one leg alone:
#
#   artifact-linux-arm64-glibc   ──► test-linux-arm64-glibc    ─┐
#   artifact-linux-arm64-musl    ──► test-linux-arm64-musl     ─┤
#   artifact-linux-x86_64-glibc  ──► test-linux-x86_64-glibc    ├──► Test suite gate
#   artifact-linux-x86_64-musl   ──► test-linux-x86_64-musl    ─┤
#   artifact-macos-arm64         ──► test-macos-arm64          ─┤
#   artifact-windows-x86_64      ──► test-windows-x86_64       ─┘
#
#   artifact-linux-x86_64-glibc  ──► cli-surface-linux-x86_64-glibc ─┐
#   artifact-macos-arm64         ──► cli-surface-macos-arm64        ─┤
#   artifact-linux-x86_64-glibc  ──► ar-validation-linux-x86_64-glibc├─► CI gate
#   artifact-macos-arm64         ──► ar-validation-macos-arm64      ─┤
#   artifact-windows-x86_64      ──► ar-validation-windows-x86_64   ─┤
#   (all four Linux legs)        ──► cross-arch-determinism         ─┤
#   plan                         ──► seed-debut ─────────────────────┘
#
#   artifact-linux-x86_64-glibc  ──► mem-paranoid ────────────────────► Sanitizer gate
#
# A job's DEFAULT GitHub Actions behaviour — skip unless every job named in its own `needs:`
# succeeded — IS the propagation this wagon asked for, with nothing added on top: a red
# `artifact-<label>` stops every job that names it in `needs:` and NOTHING ELSE; a green one lets
# its own chain run all the way to whichever gate it feeds, whatever the other five legs did.
# There is no `if: always()` anywhere in the producer/consumer layers below, and none is needed.
#
# WHY A MATRIX WAS THE WRONG SHAPE, PRECISELY: a matrix job has exactly ONE aggregate `result` —
# `success` only when EVERY leg of it succeeds. A downstream job's default `needs:` semantics read
# THAT single result, not any one leg's, so `needs: artifact` could never tell "the leg I actually
# wanted failed" apart from "some OTHER leg failed" — the aggregate hid the leg, and one red leg
# out of six silently skipped every consumer of the other five. Splitting the producer into six
# named jobs removes the aggregate entirely: there is nothing left that could hide one leg behind
# another.
#
# GREEN IS A SEMAPHORE, NOT A CERTIFICATE (owner, 2026-07-29): *"as pernas verdes são semáforos,
# não para dizer que está bem, mas que há quebra de convergência entre as pernas verdes e
# vermelhas."* A green `artifact-<label>` means only "this producer's chain may now run and be
# MEASURED" — not that the measurement will pass. Most of the jobs downstream of a currently-green
# producer are about to run for the first time in a long while (the whole `artifact` matrix has
# been failing whenever any one of its six legs did, so every consumer behind it was silently
# skipped), so whether `test-*`, `cli-surface-*`, `ar-validation-*` stay green once they actually
# execute is UNKNOWN. This wagon does not predict a color for them; it only lets them report their
# own, honestly, instead of being hidden behind an unrelated leg's failure.
#
# EVERY job appears directly in at least one aggregator's `needs:` (scripts/ci_gate_coverage.sh's
# COVERAGE assertion) — a job outside every aggregator's `needs:` can fail and block nothing. And
# every aggregator directly needs at least one of the two BOTH-TIER producers
# (`artifact-linux-x86_64-glibc`, `artifact-windows-x86_64` — that script's ANCHORED assertion):
# without one, an aggregator whose own legs are all full-tier-only would report SUCCESS in light
# mode having asserted nothing. The rule survives; only the shape of "the root" changed, because
# there is no longer one job it can point at.
#
# ── ONE PRODUCING LEG PER LABEL: THE FOUR LINUX SUBLANES ──────────────────────────────────────
# Owner order, 2026-07-27: *"espero ver 4 sublanes de execução, não duas, não três, não uma, para
# Linux"*. Each Linux label is its own leg and walks the WHOLE path alone — seed, ladder, dry
# build, its one asset. The ladder IS duplicated across the four, deliberately: *"Tem que
# duplicar, pois depois do teko.c, a escada não depende mais dele, e se fosse para não duplicar,
# estaríamos fazendo o primeiro degrau antes de todas as sublanes."* Since 2026-07-29 that leg IS
# the job — there is no matrix row underneath it any more.
#
# THE CLOCK THIS OPTIMISES IS DELIVERY, NOT MACHINE TIME — the owner is explicit: *"Não estou
# falando de relógio de máquina (cicle time), mas sim relógio de processo (o maior tempo de todos
# os tempos)"*. Hoisting the shared ladder into its own job that the six legs consume was BUILT
# AND REJECTED here: it is a BARRIER (nothing starts until the ladder ends, so delivery becomes
# ladder + upload + queue + download + asset, WORSE than a duplicated leg that starts at t=0) and
# it splits an asset's delivery time across two jobs, which kills the very thing being asked for:
# *"A questão é a percepção, delivery time, que não tem hoje ou pior, não é auditável /
# observável."* With one job per label, a leg's own wall clock IS the delivery time of that asset,
# readable straight off the run page. See scripts/ci_producer_matrix.sh for the measured table —
# it still carries the canonical per-leg fields (os/timeout/kind/seed/produces/fixpoint_backend);
# this file's six `artifact-<label>` jobs restate them as literals (the size cost the owner
# accepted) except `fixpoint_backend`, which stays a LOOKUP through `plan` because it is the one
# field under active four-state escada revision — see that script's header.
#
# ── NO LANE BUT THE SIX PRODUCER LEGS BUILDS ──────────────────────────────────────────────────
# Eleven jobs used to call scripts/build_with_seed_fallback.sh or scripts/ci_provision_teko.sh:
# build-test, gen1-checks, regressor-full, ar-elf-macho-coff-validation, seeds, release-cross-smoke,
# mem-paranoid, asan-default, tsan, windows-selfhost, seed-debut. After this wagon exactly the SIX
# `artifact-<label>` jobs do, and scripts/ci_lane_purity.sh (run by `CI gate`) fails the build if a
# seventh job reaches for either script — it is called with the six producer job names as its
# allowed set, since there is no longer one job to name.
# Two of the eleven are GONE rather than converted:
#   * build-test        — it WAS "the seed builds the tip on this host", on the same five hosts
#                         the producer legs now cover. Each leg does it, so the job is not
#                         moved, it is subsumed.
#   * windows-selfhost  — same, for windows-x86_64: `artifact-windows-x86_64` self-builds gen1
#                         on Windows natively and smokes the binary. Duplicate.
#   * seeds             — DEAD BEFORE THIS WAGON: it invoked scripts/cross_compile_seeds.sh,
#                         which does not exist in the tree. On any full run it would have failed
#                         at that step. It also cut its output with zig. Removed.
#   * release-cross-smoke — it existed to validate release.yml's zig cross-compile from PR CI.
#                         zig is dead and release.yml no longer builds at all, so there is
#                         nothing left to smoke. Its ONE unique assertion, the cross-architecture
#                         emitted-C determinism law, is preserved as `cross-arch-determinism`.
#
# ── LIGHT vs FULL ─────────────────────────────────────────────────────────────────────────────
# The criterion CHANGED this wagon and the reason is in scripts/ci_full_mode.sh. Short version:
# `full = (base_ref == main)` meant that on a STACKED TRAIN — where every wagon's base is the
# wagon below it — NO WAGON EVER RAN FULL, so every new lane debuted at the drain. Measured on
# PR #95: two of nine test lanes ran, and of the four lanes the owner had just ordered created,
# zero. The rule is now "can this change break this lane": base==main OR a change under
# .github/workflows/**, scripts/**, src/runtime/**, src/assert/**, src/backend/**, bootstrap/**,
# or teko.tkp. Every job below declares which tier it is on.
#
# TIER SUMMARY
#   BOTH  plan, artifact-linux-x86_64-glibc, artifact-windows-x86_64, test-linux-x86_64-glibc,
#         test-windows-x86_64, cli-surface-linux-x86_64-glibc, CI gate, Test suite gate,
#         Sanitizer gate
#   FULL  artifact-linux-arm64-glibc, artifact-linux-arm64-musl, artifact-linux-x86_64-musl,
#         artifact-macos-arm64, test-linux-arm64-glibc, test-linux-arm64-musl,
#         test-linux-x86_64-musl, test-macos-arm64, cli-surface-macos-arm64,
#         ar-validation-linux-x86_64-glibc, ar-validation-macos-arm64, ar-validation-windows-x86_64,
#         cross-arch-determinism, seed-debut, mem-paranoid
#
# ── ZIG IS DEAD ───────────────────────────────────────────────────────────────────────────────
# Owner, 2026-07-26: "parar de cross compilar em zig, usar compilação nativa na esteira que irá
# gerar os artefatos", then "O zig deve morrer agora, imediatamente, sem espera". The four Linux
# assets are produced by scripts/native_linux_asset.sh with the TARGET's own toolchain, ON THE
# RUNNER, with NO CONTAINER of any kind — see that file for the per-label mapping and for what the
# glibc floor traded when the manylinux image went with it.
# ══════════════════════════════════════════════════════════════════════════════════════════════
on:
  pull_request:
    branches: ['**']   # '**' cruza '/' — casa base com barra (remodel/...); '*' simples nao
    # NO `paths:` FILTER, AND THAT IS THE POINT.
    #
    # The three aggregators are REQUIRED checks on `main`, and `main` has no bypass — not even for
    # the owner. A required check that never REPORTS does not go red; it stays "Expected — waiting
    # for status" forever, and the only PR pointing at `main` in a stacked train is the drain.
    # A trigger-level path filter is therefore not a cost optimisation, it is a way to freeze the
    # drain: a PR whose ENTIRE diff against the base falls outside the filter would silently
    # produce NO run at all — a pure-documentation PR, a memory-file update, a roadmap edit.
    #
    # THE UNIT IS THE PR, NOT THE COMMIT, and getting that backwards is easy: on a `pull_request`
    # event GitHub evaluates `paths:` against every file the PR changes relative to its base, not
    # against the head commit. So pushing a docs-only COMMIT onto a PR that also changes `src/**`
    # keeps matching and keeps running — measured live on this branch, where a `docs/memory/**`
    # commit still produced `run=true`. The hole is narrower than "any docs commit", and it is
    # still a hole: the endgame closes with a W15 wagon and a bump, and a wagon that turned out to
    # be documentation-only would freeze the one PR pointing at `main`.
    #
    # The four merged workflows each carried such a filter, and their union — `**.tks`, `**.c`,
    # `bootstrap/**`, … — reached no Markdown outside those trees. This file inherited the hole.
    #
    # The cost the filter used to buy is bought instead by `plan`, one level down: it computes
    # `run` (with a docs-only guard) and every lane consults it. So a docs-only PR costs one ~12s
    # ubuntu job, the aggregators REPORT (green, having asserted that everything below them was
    # correctly skipped), and nothing hangs.

# ONE RUN AT A TIME PER PR, AND EVERY RUN FINISHES. A newer push QUEUES behind the run in flight
# instead of killing it. The group is keyed on the PR ref so distinct PRs never wait on each other,
# and `github.workflow` is included so this file's runs never collide with another workflow's.
#
# Cancel-in-progress is ON again — owner ruling 2026-08-03.
#
# History (do not re-argue without reading this): it cancelled originally; was turned OFF on
# 2026-07-29 on the reasoning that on a lane whose whole job is to find where the native backend
# STOPS, a cancelled run destroys the only evidence of a stop address — and `cancelled` reaches the
# reader looking like `failure`. Owner then: "Disparar vários de uma vez não é problema, o problema
# é quando algo chega na fila e o processo já está em curso."
#
# That PREMISE no longer holds. The wild-write hunt now reproduces LOCALLY — the arena chunk-canary
# (TEKO_NATIVE_CHUNK_CANARY) under a serialized 2 GB memory harness captures the stop address off-CI
# — so a cancelled CI run destroys no evidence anymore. Meanwhile, under "push early, push often" a
# burst of pushes floods the coordinator with delayed failure signals from commits already
# superseded, clogging live analysis. Owner ruling 2026-08-03: re-enable cancellation — a run
# superseded by a newer push no longer gates anything, and its stop-address evidence lives locally
# now. (If a specific CI run's canary output is wanted, let it finish before pushing again.)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ══ plan ═══════════════════════════════════════════════════════════════════════════════════
  # TIER: both. The mode, the path filters, and every per-leg fixpoint backend, emitted once for
  # the whole file.
  #
  # TWO FILTERS:
  #   run       the compiler-lane allowlist (was native.yml's `changes`). sanitizers.yml's own
  #             filter was a near-subset (it added .github/lsan-suppressions.txt and dropped
  #             examples/** + bootstrap/**) and is FOLDED IN here: the difference bought nothing
  #             but a second list to keep in sync, and erring toward running the sanitizer lanes
  #             is the safe direction.
  #   full      the light/full axis (see scripts/ci_full_mode.sh for the rule and its history).
  #
  # NO `matrix_*` OUTPUTS ANY MORE. The six producer legs, the six test legs and the two
  # cli-surface legs are now explicit jobs below with their own literal os/timeout — there is
  # nothing left for a JSON matrix blob to carry except `fixpoint_backend`, the one field the
  # four-state escada in scripts/ci_producer_matrix.sh still moves. That is the only thing `plan`
  # still looks up for the producer layer.
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      full: ${{ steps.decide.outputs.full }}
      run: ${{ steps.decide.outputs.run }}
      fb_linux_arm64_glibc: ${{ steps.decide.outputs.fb_linux_arm64_glibc }}
      fb_linux_arm64_musl: ${{ steps.decide.outputs.fb_linux_arm64_musl }}
      fb_linux_x86_64_glibc: ${{ steps.decide.outputs.fb_linux_x86_64_glibc }}
      fb_linux_x86_64_musl: ${{ steps.decide.outputs.fb_linux_x86_64_musl }}
      fb_macos_arm64: ${{ steps.decide.outputs.fb_macos_arm64 }}
      fb_windows_x86_64: ${{ steps.decide.outputs.fb_windows_x86_64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          list-files: shell
          filters: |
            run:
              - 'src/**'
              - 'tests/**'
              - 'examples/**'
              - 'scripts/**'
              - 'bootstrap/**'
              - '.github/lsan-suppressions.txt'
              - '.github/ci-lane-exceptions.txt'
              - '.github/workflows/pr.yml'
            full:
              - '.github/workflows/**'
              - 'scripts/**'
              - 'src/runtime/**'
              - 'src/assert/**'
              - 'src/backend/**'
              - 'bootstrap/**'
              - 'teko.tkp'

      - name: Decide (mode, allowlist, per-leg fixpoint backend)
        id: decide
        shell: bash
        env:
          MATCHED: ${{ steps.filter.outputs.run }}
          FILES: ${{ steps.filter.outputs.run_files }}
          FULL_MATCHED: ${{ steps.filter.outputs.full }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -eu

          # ── THE MODE ────────────────────────────────────────────────────────────────────────
          # base_ref == main is KEPT (the landing wagon pays the full gate whatever it touched),
          # but it is no longer the ONLY trigger — see the header and scripts/ci_full_mode.sh.
          # The gates re-derive this INDEPENDENTLY (over the PR's file list, not with dorny) and
          # fail on disagreement, which is what makes a `skipped` leg trustworthy.
          full=false
          reason=""
          if [ "$BASE_REF" = "main" ]; then full=true; reason="base_ref=main"; fi
          if [ "$FULL_MATCHED" = "true" ]; then
            full=true
            reason="${reason:+$reason, }a full-triggering path changed (workflows/scripts/runtime/assert/backend/seeds/manifest)"
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "mode: $([ "$full" = "true" ] && echo full || echo light) (base_ref='$BASE_REF'; ${reason:-no full trigger})"

          # ── the compiler-lane allowlist + the docs-only guard ───────────────────────────────
          # The allowlist globs also match Markdown living INSIDE those trees, so a pure-doc edit
          # would otherwise trigger the whole heavy gate. Skip only when EVERY matched file is
          # *.md — any single non-Markdown match still forces the run, so this can under-skip but
          # never over-skip. A trigger-level `paths-ignore` is deliberately NOT used: the three
          # aggregators are REQUIRED checks, and skipping the workflow would leave them never
          # reported → the PR hangs "waiting for CI gate" forever.
          run=false
          if [ "$MATCHED" != "true" ]; then
            echo "No allowlisted path changed — the compiler-diagnostic lanes have nothing to gate."
          else
            for f in $FILES; do
              case "$f" in
                *.md) ;;
                *)    run=true ;;
              esac
            done
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "run=$run (compiler-diagnostic lanes)"

          # ── PER-LEG FIXPOINT BACKEND, LOOKED UP FROM THE ONE TABLE ──────────────────────────
          # scripts/ci_producer_matrix.sh carries `fixpoint_backend` per leg — the platform-
          # sequencing LEVER (see that script's header for the four-state escada). It is NOT
          # duplicated as a hand-maintained literal here: every `artifact-<label>` job below (its
          # fixpoint step) and every `test-<label>` job (its no-C-in-tests condition) reads it
          # through this one lookup, so the escada's current state lives in exactly one file —
          # the same one `nightly.yml` reads — and never drifts between the two callers.
          backend_of() {
            sh scripts/ci_producer_matrix.sh full \
              | grep -o '{"producer":"'"$1"'"[^}]*}' \
              | sed -n 's/.*"fixpoint_backend":"\([^"]*\)".*/\1/p'
          }
          for pair in "fb_linux_arm64_glibc:linux-arm64-glibc" \
                      "fb_linux_arm64_musl:linux-arm64-musl" \
                      "fb_linux_x86_64_glibc:linux-x86_64-glibc" \
                      "fb_linux_x86_64_musl:linux-x86_64-musl" \
                      "fb_macos_arm64:macos-arm64" \
                      "fb_windows_x86_64:windows-x86_64"; do
            out_key="${pair%%:*}"
            label="${pair#*:}"
            backend="$(backend_of "$label")"
            if [ -z "$backend" ]; then
              echo "ERROR: no fixpoint_backend for '$label' in scripts/ci_producer_matrix.sh" >&2
              exit 1
            fi
            echo "$out_key=$backend" >> "$GITHUB_OUTPUT"
            echo "$label fixpoint_backend=$backend"
          done

  # ══ artifact-linux-arm64-glibc ═════════════════════════════════════════════════════════════
  # TIER: full only.
  #
  # THE PRODUCER LEG, IN FULL, WITH ITS RATIONALE — the other five producer jobs below are the
  # SAME BODY with only os/timeout/seed/produces/fixpoint_backend changed, so the comments live
  # once, HERE, and the other five point back to this one.
  #
  # Owner: "a lane de artefatos deve executar build seco `teko build . --no-verify --release` e
  # ela deve ter a inteligência sobre o que deve gerar (a escada)."
  #
  # THE INTELLIGENCE IS TWO THINGS, and both live in scripts/produce_assets.sh and nowhere else:
  #   1. WHAT TO GENERATE — the `PRODUCES` contract this leg promises.
  #   2. THE LADDER — scripts/build_with_seed_fallback.sh: the newest RELEASED seed builds the tip
  #      directly (fast path); else the COMMITTED seed in bootstrap/seeds/ (rung 0); else the
  #      pinned SHA ladder.
  #
  # `--no-verify --release`: DRY, no test gate. The gate is the `test-*` layer's whole job and
  # running it here would put the cost straight back into the critical path the ruling removed.
  # `--release` because every published asset is an -O2 link, so an asset built without it would
  # not be the asset.
  artifact-linux-arm64-glibc:
    needs: plan
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.full == 'true'
    name: artifact / linux-arm64-glibc
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Named BEFORE the first step that can fail on a missing tool, so a red run on a host whose
      # image no lane has exercised says WHICH toolchain was present instead of leaving the reader
      # to infer it from a cc error deep inside a build log.
      - name: Report the host toolchain (diagnostic — never fails the job)
        shell: bash
        run: |
          for t in cc clang gcc file xz unzip tar curl python3 7z musl-gcc; do
            printf '%-8s ' "$t"
            command -v "$t" || echo '(absent)'
          done
          # THE TARGET TRIPLE, NOT JUST THE PATH. `command -v` says WHERE cc is; it does not say
          # WHAT IT TARGETS, and on Windows that is the whole question: `cc` resolves to
          # /c/mingw64/bin/cc on the runner, so the C route compiles and links through mingw while
          # the native path's linker_is_mingw guard — which lives only in src/build/linker.tks —
          # never fires. `-dumpmachine` is one line per tool and answers it outright
          # (x86_64-w64-mingw32 vs x86_64-pc-windows-msvc vs x86_64-linux-gnu). Full `-v` output
          # would be dozens of lines across every job for information we do not need standing.
          for t in cc clang gcc; do
            if command -v "$t" >/dev/null 2>&1; then
              printf '%-8s target: ' "$t"
              "$t" -dumpmachine 2>/dev/null || echo '(no -dumpmachine)'
            fi
          done

      # ── THE SHARED PRODUCTION PATH ──────────────────────────────────────────────────────────
      # Provision the host-runnable seed, walk the ladder, run the DRY build
      # (`--no-verify --release`), build the Linux asset with its target's own native toolchain,
      # and stage `stage/<label>/teko`. All of it is scripts/produce_assets.sh, and `nightly.yml`
      # makes the IDENTICAL call — one production path, not two.
      - name: Produce this leg's assets (seed → ladder → dry build → native asset → stage)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/produce_assets.sh linux linux-arm64-glibc linux-arm64-glibc

      # ── THE SELF-HOSTING FIXPOINT, IN EVERY LEG ─────────────────────────────────────────────
      # Owner ruling 2026-07-27: *"pode colocar o fixpoint logo após as compilações nos ambientes
      # (direto em cada sublane)"*. So it sits HERE — right after the leg compiled, on the leg's
      # own runner, against the leg's own toolchain — and not in a shared job downstream. Six
      # environments, six independent verdicts: a fixpoint that holds on x86_64 and breaks under
      # musl is exactly the kind of divergence a single shared check would average away.
      #
      # WHAT IT ASSERTS: gen2 == gen3 byte for byte over the SAME source, plus zero emitted C.
      # gen1 is not compared — under the 0.3.1.0 chain (release → gen0 → gen1 down the C route,
      # then gen2/gen3) it comes from a DIFFERENT code generator, so gen1 != gen2 is the healthy,
      # expected shape.
      #
      # IT FAILS THE LANE. There is no soft mode here: owner ruling 2026-07-27: *"se ele diz que
      # falhou, deveria ter saído com exit(1) para sinalizar vermelha a lane"* and *"se esse vagão
      # fechar verde é pura mentira"*.
      #
      # `TEKO_FIXPOINT_BACKEND` comes from `needs.plan.outputs.fb_linux_arm64_glibc` — a LOOKUP
      # into scripts/ci_producer_matrix.sh (see `plan`'s own comment), `native` or `c` per the
      # platform-sequenced plan. It is set ON THE STEP, never on the job or the workflow: a wide
      # `TEKO_BACKEND` pin leaks into everything below it and turns the native regressors green by
      # compiling them down the C route (measured; scripts/fixpoint_gate.sh records the case).
      # The emission check RIDES ALONG, DERIVED: a `native` backend arms zero-C inside the gate.
      #
      # A `native` LEG IS EXPECTED TO GO RED TODAY, and that is the deliverable, not a regression
      # to patch around — the native backend does not build the compiler yet and the stop it
      # reaches is named by address in docs/memory/0.3.1.0-linux-native-first-stop.md. The red
      # measures the distance left. To turn it back, one word per leg in ci_producer_matrix.sh.
      - name: Fixpoint — gen2 == gen3 over the same source, and no emitted C
        shell: bash
        env:
          TEKO_FIXPOINT_BACKEND: ${{ needs.plan.outputs.fb_linux_arm64_glibc }}
        run: sh scripts/fixpoint_gate.sh out/teko . .fixpoint

      # ── THE HARVEST: gen1's C, ONE FILE PER PRODUCER, AND ONLY OVER A GREEN FIXPOINT ─────────
      # Owner ruling 2026-07-28: the `teko.c` *"deixa de ser ENTRADA e passa a ser SAÍDA:
      # versionado depois do verde, colhido do gen1 (a última geração que emite C)"*.
      #
      # `if: success()` PUTS THE PROOF BEFORE THE PAYLOAD, and it is also why this step (and the
      # asset upload below, which carries no `if:` of its own and so inherits the SAME implicit
      # success() requirement) never runs when the Fixpoint step just above failed: a C — or an
      # asset — from a chain that did not prove gen2 == gen3 is a guess, and shipping a guess as
      # the next bootstrap is the exact move that costs a week.
      - name: Harvest gen1's emitted C (only over a fixpoint that HELD)
        if: ${{ success() }}
        shell: bash
        run: |
          set -eu
          mkdir -p harvest
          if [ -f out/teko.c ]; then
              cp out/teko.c harvest/teko.c
              ls -la harvest/
          else
              echo "NOTE: no out/teko.c — this leg's gen1 emitted no C (the native route, or a"
              echo "      ladder change). Nothing to harvest; the fixpoint above still stands."
          fi

      - name: Upload the harvested C
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: teko-c-linux-arm64-glibc
          path: harvest
          if-no-files-found: warn
          retention-days: 7

      # RETENTION IS 7 DAYS, NOT 1, AND IT IS A DEPENDENCY NOW. `nightly.yml` reaches BACK into
      # this run and asserts that what this PR published is byte-identical to what the merged
      # commit rebuilds. NO `if:` HERE — a leg whose Fixpoint step failed never reaches this step,
      # and that IS the point: this leg's whole downstream chain (`test-linux-arm64-glibc`) must
      # never see an asset this leg itself refused to vouch for.
      - name: Upload the assets
        uses: actions/upload-artifact@v4
        with:
          name: teko-assets-linux-arm64-glibc
          path: stage
          if-no-files-found: error
          retention-days: 7

  # ══ artifact-linux-arm64-musl ══════════════════════════════════════════════════════════════
  # TIER: full only. SAME BODY as artifact-linux-arm64-glibc above — see that job for the full
  # rationale. Differs only in: this label's own musl toolchain, seed/produces, and its OWN
  # fixpoint_backend lookup (`fb_linux_arm64_musl`), which may — and today does — differ from its
  # sibling's, because the four-state escada does not flip all four Linux legs together.
  artifact-linux-arm64-musl:
    needs: plan
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.full == 'true'
    name: artifact / linux-arm64-musl
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report the host toolchain (diagnostic — never fails the job)
        shell: bash
        run: |
          for t in cc clang gcc file xz unzip tar curl python3 7z musl-gcc; do
            printf '%-8s ' "$t"
            command -v "$t" || echo '(absent)'
          done
          # THE TARGET TRIPLE, NOT JUST THE PATH. `command -v` says WHERE cc is; it does not say
          # WHAT IT TARGETS, and on Windows that is the whole question: `cc` resolves to
          # /c/mingw64/bin/cc on the runner, so the C route compiles and links through mingw while
          # the native path's linker_is_mingw guard — which lives only in src/build/linker.tks —
          # never fires. `-dumpmachine` is one line per tool and answers it outright
          # (x86_64-w64-mingw32 vs x86_64-pc-windows-msvc vs x86_64-linux-gnu). Full `-v` output
          # would be dozens of lines across every job for information we do not need standing.
          for t in cc clang gcc; do
            if command -v "$t" >/dev/null 2>&1; then
              printf '%-8s target: ' "$t"
              "$t" -dumpmachine 2>/dev/null || echo '(no -dumpmachine)'
            fi
          done

      # musl-tools INSTALLS ON BOTH LINUX RUNNERS — measured green on `ubuntu-24.04-arm` across
      # three separate runs on 2026-07-27. THERE IS NO CONTAINER TO FALL BACK TO AND NONE IS
      # COMING BACK: a red step here is the fail-loud, and the fix is to fix the toolchain, never
      # to route this label back to Alpine.
      - name: Install musl-tools (this asset's native, non-container toolchain)
        shell: bash
        run: |
          set -eu
          sudo apt-get update -y
          sudo apt-get install -y musl-tools
          musl-gcc --version

      - name: Produce this leg's assets (seed → ladder → dry build → native asset → stage)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/produce_assets.sh linux linux-arm64-glibc linux-arm64-musl

      - name: Fixpoint — gen2 == gen3 over the same source, and no emitted C
        shell: bash
        env:
          TEKO_FIXPOINT_BACKEND: ${{ needs.plan.outputs.fb_linux_arm64_musl }}
        run: sh scripts/fixpoint_gate.sh out/teko . .fixpoint

      - name: Harvest gen1's emitted C (only over a fixpoint that HELD)
        if: ${{ success() }}
        shell: bash
        run: |
          set -eu
          mkdir -p harvest
          if [ -f out/teko.c ]; then
              cp out/teko.c harvest/teko.c
              ls -la harvest/
          else
              echo "NOTE: no out/teko.c — this leg's gen1 emitted no C. Nothing to harvest; the"
              echo "      fixpoint above still stands."
          fi

      - name: Upload the harvested C
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: teko-c-linux-arm64-musl
          path: harvest
          if-no-files-found: warn
          retention-days: 7

      - name: Upload the assets
        uses: actions/upload-artifact@v4
        with:
          name: teko-assets-linux-arm64-musl
          path: stage
          if-no-files-found: error
          retention-days: 7

