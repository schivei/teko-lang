      # E VERIFICA A UNIÃO DO QUE OS DOIS GUIÕES CHAMAM, não uma amostra dela — correcção contra
      # mim. A primeira versão deste passo verificava `llvm-readobj` e `llvm-objdump`, passou a
      # verde, e a fila morreu 883 segundos depois a pedir `readelf`, que este passo nunca tinha
      # olhado (medido na run 30568806559). Uma guarda que verifica a coisa errada passa, e passar
      # é exactamente o que a torna pior do que não existir. A lista abaixo é a união literal de
      # `scripts/check_coff.sh` (readobj · objdump · lld-link) e do braço cross de
      # `scripts/check_elf.sh` (readelf · nm · objdump · ld.lld). Quando um guião passar a chamar
      # outra ferramenta, esta lista cresce com ele — está aqui escrito para que a próxima pessoa
      # não tenha de o descobrir com 883 segundos de CI.
      - name: Verify the parsers are on PATH (fail loud before the corpus runs)
        run: |
          set -eu
          llvm-readobj --version
          llvm-objdump --version
          llvm-readelf --version
          llvm-nm --version
          lld-link --version
          ld.lld --version

      - name: Report the host toolchain (diagnostic — never fails the job)
        shell: bash
        run: |
          for t in cc clang gcc file python3; do
            printf '%-8s ' "$t"
            command -v "$t" || echo '(absent)'
          done
          # THE TARGET TRIPLE, NOT JUST THE PATH. `command -v` says WHERE cc is; it does not say
          # WHAT IT TARGETS, and on Windows that is the whole question: `cc` resolves to
          # /c/mingw64/bin/cc on the runner, so the C route compiles and links through mingw while
          # the native path's linker_is_mingw guard — which lives only in src/build/linker.tks —
          # never fires. `-dumpmachine` is one line per tool and answers it outright
          # (x86_64-w64-mingw32 vs x86_64-pc-windows-msvc vs x86_64-linux-gnu). Full `-v` output
          # would be dozens of lines across every job for information we do not need standing.
          for t in cc clang gcc; do
            if command -v "$t" >/dev/null 2>&1; then
              printf '%-8s target: ' "$t"
              "$t" -dumpmachine 2>/dev/null || echo '(no -dumpmachine)'
            fi
          done

      - name: Download this lane's published asset
        uses: actions/download-artifact@v4
        with:
          name: teko-assets-macos-arm64
          path: dl

      - name: Restore the executable bit and name the asset under test
        shell: bash
        run: |
          set -eu
          art="dl/macos-arm64/teko"
          if [ ! -f "$art" ]; then
            echo "ERROR: the producer's upload has no $art" >&2
            ls -lR dl >&2
            exit 1
          fi
          chmod +x "$art"
          file "$art" || true
          "$art" --version

      # THE OBJECT-GATE FAIL-CLOSED FIXTURE, ON EVERY HOST. `scripts/check_{elf,macho,coff}.sh` and
      # `scripts/check_ar_{elf,macho,coff}.sh` used to `exit 0` when the object was absent, the tool
      # missing or the host wrong — and CI reads exit 0 as PASS, so a producer that never wrote its
      # .o scored a green row, and check_elf.sh on aarch64 reported PASS having validated nothing
      # (owner, 2026-07-29: "check_elf.sh é defeito de CI, precisa corrigir então"). They now fail
      # closed; this fixture is what keeps them that way, proving both directions by inversion.
      #
      # RUNS ON ALL SIX HOSTS BY DESIGN. Two regressions in this lane came from a script verified on
      # one host only — a gate wired to a single job, and a `sed -E` that Git-Bash killed at exit
      # 127. The fixture needs no compiler and no binutils (it only ever hands a gate a path that
      # does not exist), so there is no excuse for it to run anywhere but everywhere.
      - name: Structural — the object/archive gates fail closed with nothing to check
        shell: bash
        run: bash scripts/objfile_gate_test.sh


      - name: Asset self-test (the published asset runs its own gate)
        shell: bash
        run: dl/macos-arm64/teko test .

      - name: No generated C after a native-backend test session
        if: needs.plan.outputs.fb_macos_arm64 == 'native'
        shell: bash
        run: sh scripts/no_c_in_tests_gate.sh .

  # ══ test-windows-x86_64 ════════════════════════════════════════════════════════════════════
  # TIER: both. WINDOWS IS NOT A DIFFERENT PATH BUT A DIFFERENT SHELL, with an explicit
  # `$LASTEXITCODE` propagation — this is the one test job whose steps genuinely differ from the
  # five POSIX legs above (and it carries no no-C-in-tests step: its own `fixpoint_backend`,
  # `fb_windows_x86_64`, is `c` on every state of the escada — see ci_producer_matrix.sh).
  test-windows-x86_64:
    needs: [plan, artifact-windows-x86_64]
    if: needs.plan.outputs.run == 'true'
    name: test / windows-x86_64
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # WINDOWS IS 100% pwsh-NATIVE (owner ruling 2026-08-18): no Git-Bash, no `sh scripts/*.sh`.
      - name: Report the host toolchain (diagnostic — never fails the job)
        shell: pwsh
        run: |
          # `-dumpmachine` answers WHAT clang targets — x86_64-pc-windows-msvc, never a MinGW triple.
          foreach ($t in @('clang','lld-link','llvm-lib','python3')) {
            $c = Get-Command $t -ErrorAction SilentlyContinue
            '{0,-14} {1}' -f $t, $(if ($c) { $c.Source } else { '(absent)' })
          }
          foreach ($t in @('clang','cc','gcc')) {
            $c = Get-Command $t -ErrorAction SilentlyContinue
            if ($c) { '{0,-14} target: {1}' -f $t, (& $t -dumpmachine 2>$null) }
          }

      - name: Download this lane's published asset
        uses: actions/download-artifact@v4
        with:
          name: teko-assets-windows-x86_64
          path: dl

      # KNOWN-STOP (.32) — WINDOWS ONLY, and the asymmetry IS the finding. Owner ruling
      # 2026-07-28: *"Ok KNOWN-STOP para os testes de WINDOWS."*
      #
      #     isel x86-64: B1-args — an integer call argument past the ABI's
      #     argument-register window needs the stack-arg slot (0.3.1)
      #
      # Win64 has FOUR integer argument registers (RCX/RDX/R8/R9); System V has SIX
      # (RDI/RSI/RDX/RCX/R8/R9). The same call fits in registers on Linux and macOS and
      # overflows here, so `own_arith_exit`'s project cannot finish its build on this leg alone.
      #
      # WHY THE PIN LIVES IN THE LANE AND NOT IN own_native.tkr: that fixture PASSES on every
      # System V leg. A KNOWN-STOP written into the `.tkr` would assert a failure that does not
      # happen there and would take five green lanes down with it. A fixture cannot hold two
      # truths; a lane can hold the one that is true of its own ABI.
      #
      # THE VERDICT IS DELEGATED to `scripts/win/known_stop_gate.ps1` — the pwsh mirror of
      # `scripts/known_stop_gate.sh` (this Windows leg is bash-free; the `.sh` stays for reference).
      # An envelope may absorb ONLY the diagnostic it pins, never a family of them. Measured in run
      # `30400712261` (job `90416003791`): the PREVIOUS inline check matched the bare SUBSTRING
      # `B1-args`, which THREE distinct honest-stops in `isel_x86_64.tks` all share (the parameter
      # stop, the variadic-call stop, and the call-argument stop this envelope actually pins) — so
      # any one of the three firing read as "held". The gate script matches the pinned diagnostic's
      # FULL text instead; `scripts/known_stop_gate_test.sh` proves the distinction BY INVERSION (a
      # log shaped like a held pin but naming a sibling stop must stay red).
      #
      # THE DAY .32 IMPLEMENTS THE STACK-ARG SLOT, THE GATE'S "LIFTED" BRANCH FIRES. Restore the
      # plain `dl/windows-x86_64/teko.exe test .` invocation and drop this step's gate call.
      # The plan is in docs/memory/b1-args-stack-slot.md.
      # THE OBJECT-GATE FAIL-CLOSED FIXTURE — WINDOWS-SCOPED, pwsh-NATIVE. On the POSIX legs
      # `scripts/objfile_gate_test.sh` proves all six gates (`check_{elf,macho,coff}.sh` and the
      # `check_ar_*` siblings) fail closed with nothing to check — those five legs still run it,
      # unchanged. The Windows leg no longer runs Git-Bash, so it runs the pwsh mirror
      # `scripts/win/objfile_gate_test.ps1`, scoped to the COFF gates it actually uses
      # (check_coff.ps1 / check_ar_coff.ps1). The `.sh`'s GNU-only-spelling lint existed SOLELY
      # because Git-Bash on the Windows runner lacked `sed -E`/`grep -P`; with no Git-Bash on this
      # path that concern is gone. The proof — a gate handed a non-existent path must exit nonzero,
      # and must exit zero only with its documented opt-out armed — is intact for the COFF family.
      - name: Structural — the COFF object/archive gates fail closed with nothing to check
        shell: pwsh
        run: ./scripts/win/objfile_gate_test.ps1

      - name: Asset self-test — Windows (the published asset runs its own gate)
        shell: pwsh
        run: |
          $art = 'dl/windows-x86_64/teko.exe'
          if (-not (Test-Path -LiteralPath $art -PathType Leaf)) {
            Write-Error "ERROR: the producer's upload has no $art"
            Get-ChildItem -Recurse dl | ForEach-Object { $_.FullName }
            exit 1
          }
          & $art --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Capture rc + log WITHOUT letting a non-zero teko abort the step — the KNOWN-STOP gate
          # below is the whole point, and it can only run if `test .` failing does not kill the step
          # first. pwsh does not `set -e` a run block, but a native non-zero would set $LASTEXITCODE
          # and GitHub's trailer would exit on it; capturing rc explicitly and calling the gate last
          # is what makes the gate's verdict — not teko's raw code — the step's outcome.
          & $art test . *> teko-test.log
          $rc = $LASTEXITCODE
          Get-Content teko-test.log
          ./scripts/win/known_stop_gate.ps1 $rc teko-test.log

  # ══ cli-surface-linux-x86_64-glibc ═════════════════════════════════════════════════════════
  # TIER: both.
  # WAS a leg of the matrix `cli-surface` job; the other cli-surface job below
  # (cli-surface-macos-arm64) is the SAME BODY. Validates the PUBLISHED ASSET: these harnesses
  # assert the CLI contract users actually get, and the binary they run is byte-for-byte the one
  # the release would ship. The version assertion in cli_flags_test.sh is why
  # scripts/native_linux_asset.sh passes -DTEKO_VERSION_STRING — an asset that reported
  # 0.0.0.0-dev would fail here, loudly.
  cli-surface-linux-x86_64-glibc:
    needs: [plan, artifact-linux-x86_64-glibc]
    if: needs.plan.outputs.run == 'true'
    name: cli surface / linux-x86_64-glibc
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The own==C differential and the region-drop unit test compile C with the host cc.
      - name: Install cc
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang

      - name: Download the published asset
        uses: actions/download-artifact@v4
        with:
          name: teko-assets-linux-x86_64-glibc
          path: dl

      - name: Restore the executable bit
        shell: bash
        run: |
          set -eu
          chmod +x "dl/linux-x86_64-glibc/teko"
          "dl/linux-x86_64-glibc/teko" --version

      - name: CLI flags (identical version string)
        shell: bash
        run: ./scripts/cli_flags_test.sh "./dl/linux-x86_64-glibc/teko"

      - name: fmt CLI (--check + stdin mode) (issue #229)
        shell: bash
        run: ./scripts/fmt_cli_test.sh "./dl/linux-x86_64-glibc/teko"

      - name: tk_region_drop_subtree unit test (issue #337 — the adopt bulk-drop primitive)
        shell: bash
        run: ./scripts/region_drop_subtree_test.sh

      # A GUARDA DO F1/F2 CORRE AQUI, E ESTA LINHA E A LICAO DO DIA. O agente que construiu a
      # arena por tarefa escreveu a guarda, provou-a por inversao (canaria 4096/4096 com raizes
      # por tarefa contra 0/4096 com raiz partilhada) — e avisou que ela NAO estava invocada em
      # lado nenhum. Uma guarda que existe e nunca corre e decoracao com ar de rede, e foi a
      # patologia que esta lane apanhou quatro vezes em 2026-07-30, duas delas em codigo meu.
      # Afirma tres coisas, e a do meio e a que impede o verde cego: as duas tarefas tem raizes
      # DIFERENTES e geracoes DISTINTAS (vivacidade — sem isto a canaria passava por nao haver
      # duas coisas para corromper), a canaria sobrevive por tarefa, e a regiao do PROGRAMA
      # sobrevive ao pop E a saida da tarefa enquanto a raiz de tarefa nao sobrevive.
      - name: task memory isolation (F1/F2 — arena por tarefa + regiao do programa)
        shell: bash
        run: ./scripts/task_memory_isolation_test.sh

      # ── R1 host-target default (owner ruling 2026-07-24) ────────────────────────────────────
      # regressor.tkr's F5 backend Examples always pin TEKO_TARGET explicitly, so they never
      # exercise native_target()'s host-derived default. This step deliberately leaves TEKO_TARGET
      # unset and asserts the own AOT backend still emits THIS host's own object format (the
      # reproduced bug: an unset TEKO_TARGET used to hardcode arm64 Mach-O on every host).
      - name: R1 host-target default (TEKO_TARGET unset)
        shell: bash
        env:
          TEKO: ./dl/linux-x86_64-glibc/teko
        run: ./scripts/target_host_default_test.sh

  # ══ cli-surface-macos-arm64 ════════════════════════════════════════════════════════════════
  # TIER: full only. SAME BODY as cli-surface-linux-x86_64-glibc above — macOS ships clang with
  # the Xcode CLT, so it needs no `cc` install step.
  cli-surface-macos-arm64:
    needs: [plan, artifact-macos-arm64]
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.full == 'true'
    name: cli surface / macos-arm64
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the published asset
        uses: actions/download-artifact@v4
        with:
          name: teko-assets-macos-arm64
          path: dl

      - name: Restore the executable bit
        shell: bash
        run: |
          set -eu
          chmod +x "dl/macos-arm64/teko"
          "dl/macos-arm64/teko" --version

      - name: CLI flags (identical version string)
        shell: bash
        run: ./scripts/cli_flags_test.sh "./dl/macos-arm64/teko"

      - name: fmt CLI (--check + stdin mode) (issue #229)
        shell: bash
        run: ./scripts/fmt_cli_test.sh "./dl/macos-arm64/teko"

      - name: tk_region_drop_subtree unit test (issue #337 — the adopt bulk-drop primitive)
        shell: bash
        run: ./scripts/region_drop_subtree_test.sh

      # A GUARDA DO F1/F2 CORRE AQUI, E ESTA LINHA E A LICAO DO DIA. O agente que construiu a
      # arena por tarefa escreveu a guarda, provou-a por inversao (canaria 4096/4096 com raizes
      # por tarefa contra 0/4096 com raiz partilhada) — e avisou que ela NAO estava invocada em
      # lado nenhum. Uma guarda que existe e nunca corre e decoracao com ar de rede, e foi a
      # patologia que esta lane apanhou quatro vezes em 2026-07-30, duas delas em codigo meu.
      # Afirma tres coisas, e a do meio e a que impede o verde cego: as duas tarefas tem raizes
      # DIFERENTES e geracoes DISTINTAS (vivacidade — sem isto a canaria passava por nao haver
      # duas coisas para corromper), a canaria sobrevive por tarefa, e a regiao do PROGRAMA
      # sobrevive ao pop E a saida da tarefa enquanto a raiz de tarefa nao sobrevive.
      - name: task memory isolation (F1/F2 — arena por tarefa + regiao do programa)
        shell: bash
        run: ./scripts/task_memory_isolation_test.sh

      - name: R1 host-target default (TEKO_TARGET unset)
        shell: bash
        env:
          TEKO: ./dl/macos-arm64/teko
        run: ./scripts/target_host_default_test.sh

  # ══ ar-validation-linux-x86_64-glibc ═══════════════════════════════════════════════════════
  # TIER: full only.
  #
  # Proves the own-native static-archive writer's GNU/ELF container against a REAL host
  # toolchain, then links + RUNS a C consumer against the archive — the PRIMARY consumibility
  # criterion (`add(40, 2)` must exit 42). `AR_CHECK_REQUIRE_TOOLS=1` so an honest-skip here is a
  # hard failure: the toolchain is guaranteed present on this runner.
  #
  # `needs: [plan, artifact-linux-x86_64-glibc]` — this was already a single-producer matrix row;
  # unrolling changes only its name. The other two ar-validation jobs below are the SAME SHAPE for
  # their own container format.
  ar-validation-linux-x86_64-glibc:
    needs: [plan, artifact-linux-x86_64-glibc]
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.full == 'true'
    name: ar validation / linux-x86_64-glibc (elf)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the published asset
        uses: actions/download-artifact@v4
        with:
          name: teko-assets-linux-x86_64-glibc
          path: dl

      - name: Restore the executable bit
        shell: bash
        run: |
          set -eu
          chmod +x "dl/linux-x86_64-glibc/teko"
          "dl/linux-x86_64-glibc/teko" --version

      - name: Build the static-lib fixture (own-native, host-default target)
        shell: bash
        env:
          TEKO_BACKEND: native
        run: |
          set -eu
          teko="$PWD/dl/linux-x86_64-glibc/teko"
          cd examples/toolchain/ar_link_run
          "$teko" build . -o bin --no-verify --release
          ls -la bin

      - name: Host-toolchain well-formedness gate (ar/nm/ld — ELF/GNU)
        shell: bash
        env:
          AR_CHECK_REQUIRE_TOOLS: "1"
        run: ./scripts/check_ar_elf.sh examples/toolchain/ar_link_run/bin/libar_link_run.a ar_link_run__add

      - name: Link + run the consumer against the ELF/GNU archive (expect exit 42)
        shell: bash
        run: |
          set -eu
          cc -c scripts/ar_link_run_consumer.c -o /tmp/ar_link_run_consumer.o
          cc /tmp/ar_link_run_consumer.o examples/toolchain/ar_link_run/bin/libar_link_run.a -o /tmp/ar_link_run_consumer_bin
          set +e
          /tmp/ar_link_run_consumer_bin
          rc=$?
          set -e
          echo "consumer exit code: $rc"
          [ "$rc" -eq 42 ] || { echo "FAIL — expected exit 42, got $rc"; exit 1; }

  # ══ ar-validation-macos-arm64 ══════════════════════════════════════════════════════════════
  # TIER: full only. SAME SHAPE as ar-validation-linux-x86_64-glibc above, for the BSD Mach-O
  # `__.SYMDEF SORTED` container.
  ar-validation-macos-arm64:
    needs: [plan, artifact-macos-arm64]
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.full == 'true'
    name: ar validation / macos-arm64 (macho)
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the published asset
        uses: actions/download-artifact@v4
        with:
          name: teko-assets-macos-arm64
          path: dl

      - name: Restore the executable bit
        shell: bash
        run: |
          set -eu
          chmod +x "dl/macos-arm64/teko"
          "dl/macos-arm64/teko" --version

      - name: Build the static-lib fixture (own-native, host-default target)
        shell: bash
        env:
          TEKO_BACKEND: native
        run: |
          set -eu
          teko="$PWD/dl/macos-arm64/teko"
          cd examples/toolchain/ar_link_run
          "$teko" build . -o bin --no-verify --release
          ls -la bin

      - name: Host-toolchain well-formedness gate (ar/nm/ld64 — Mach-O)
        shell: bash
        env:
          AR_CHECK_REQUIRE_TOOLS: "1"
        run: ./scripts/check_ar_macho.sh examples/toolchain/ar_link_run/bin/libar_link_run.a ar_link_run__add

      - name: Link + run the consumer against the Mach-O archive (expect exit 42)
        shell: bash
        run: |
          set -eu
          clang -c scripts/ar_link_run_consumer.c -o /tmp/ar_link_run_consumer.o
          clang /tmp/ar_link_run_consumer.o examples/toolchain/ar_link_run/bin/libar_link_run.a -o /tmp/ar_link_run_consumer_bin
          set +e
          /tmp/ar_link_run_consumer_bin
          rc=$?
          set -e
          echo "consumer exit code: $rc"
          [ "$rc" -eq 42 ] || { echo "FAIL — expected exit 42, got $rc"; exit 1; }

  # ══ ar-validation-windows-x86_64 ═══════════════════════════════════════════════════════════
  # TIER: full only. SAME SHAPE as ar-validation-linux-x86_64-glibc above, for the MS
  # two-linker-member COFF `.lib` container.
  ar-validation-windows-x86_64:
    needs: [plan, artifact-windows-x86_64]
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.full == 'true'
    name: ar validation / windows-x86_64 (coff)
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the published asset
        uses: actions/download-artifact@v4
        with:
          name: teko-assets-windows-x86_64
          path: dl

      # WINDOWS IS 100% pwsh-NATIVE (owner ruling 2026-08-18): no Git-Bash, no `sh scripts/*.sh`.
      # In native PowerShell there is no MSYS layer, so the cygpath/MSYS_NO_PATHCONV dance the `.sh`
      # needed to keep `/switches` and paths intact simply does not exist here.
      - name: Build the static-lib fixture (own-native, host-default target)
        shell: pwsh
        env:
          TEKO_BACKEND: native
        run: |
          $teko = "$PWD/dl/windows-x86_64/teko.exe"
          if (-not (Test-Path -LiteralPath $teko)) { $teko = "$PWD/dl/windows-x86_64/teko" }
          Push-Location examples/toolchain/ar_link_run
          try {
            & $teko build . -o bin --no-verify --release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Get-ChildItem bin | Format-Table -AutoSize
          } finally { Pop-Location }

      - name: Host-toolchain well-formedness gate (llvm-lib/lib.exe + dumpbin — COFF)
        shell: pwsh
        env:
          AR_CHECK_REQUIRE_TOOLS: "1"
        run: ./scripts/win/check_ar_coff.ps1 examples/toolchain/ar_link_run/bin/ar_link_run.lib ar_link_run__add

      # lld-link links + RUNS the consumer natively (no MSYS path conversion needed under pwsh).
      - name: Link + run the consumer against the COFF archive (expect exit 42)
        shell: pwsh
        run: |
          & clang -c scripts/ar_link_run_consumer.c -o ar_link_run_consumer.o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & lld-link /nologo /out:ar_link_run_consumer.exe /entry:main /subsystem:console ar_link_run_consumer.o examples/toolchain/ar_link_run/bin/ar_link_run.lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./ar_link_run_consumer.exe
          $rc = $LASTEXITCODE
          Write-Host "consumer exit code: $rc"
          # Explicit exit: the consumer's own 42 is left in $LASTEXITCODE, and GitHub's pwsh trailer
          # exits on it — so a bare success path would fail the step with 42. Normalise to 0/1 here.
          if ($rc -ne 42) { Write-Host "FAIL — expected exit 42, got $rc"; exit 1 }
          exit 0

  # ══ cross-arch-determinism ═════════════════════════════════════════════════════════════════
  # TIER: full only.
  #
  # THE ONE JOB THAT GENUINELY NEEDS SEVERAL LEGS AT ONCE, not one — it COMPARES the four Linux
  # producers' emitted objects, so there is no single leg it could be re-chained to. `needs:` now
  # names all four `artifact-<label>` jobs directly:
  #
  #   needs: [plan, artifact-linux-arm64-glibc, artifact-linux-arm64-musl,
  #           artifact-linux-x86_64-glibc, artifact-linux-x86_64-musl]
  #
  # A job's default GitHub Actions behaviour already gives this the "declare the set, compare
  # against green" property the earlier draft of this wagon asked for explicitly: `needs:` on all
  # four means this job runs ONLY when all four succeeded (GH's default `success()` over `needs:`)
  # and is SKIPPED otherwise — there is no partial-subset state it could silently run over, and so
  # nothing left to declare or cross-check. That earlier requirement is now moot BY CONSTRUCTION,
  # exactly because there is no shared matrix result left to hide a leg behind.
  #
  # THE ONE THING `release-cross-smoke` PROVED THAT NOTHING ELSE DOES: the four Linux artifacts
  # must emit BYTE-IDENTICAL output for the same project. Determinism is already a law WITHIN one
  # architecture (the gen2 == gen3 fixpoint); this extends it ACROSS architectures, where a
  # pointer-width, endianness or hash-order leak into the emitter is invisible to the
  # within-architecture fixpoint and shows up here as a diverging sha256 and nowhere else.
  #
  # ── DOES `fixpoint_backend` MATTER HERE? NO — AND HERE IS WHY, PRECISELY (owner question,
  # 2026-07-29): *"o determinismo deve comparar pernas de backends diferentes? [...] Comparar uma
  # nativa com uma C é comparar coisas que não têm de bater — ou é precisamente a convergência que
  # interessa medir?"* Two readings, and the answer is neither guess — it follows from what the
  # SHIPPED ASSET actually is:
  #
  #   READING A (adopted): compare all four SHIPPED assets unconditionally, exactly as today,
  #   ignoring `fixpoint_backend` entirely. `fixpoint_backend` selects the backend for gen2/gen3
  #   INSIDE `scripts/fixpoint_gate.sh`'s own ephemeral, in-job self-hosting PROOF (`build_gen`'s
  #   `TEKO_FIXPOINT_BACKEND`) — a build that runs at `.fixpoint/out`, is compared, and is deleted.
  #   It is NEVER the backend that builds the SHIPPED asset: `scripts/build_with_seed_fallback.sh`
  #   pins `TEKO_SELFHOST_BACKEND` to `c` by default (`bp_backend="${TEKO_SELFHOST_BACKEND:-c}"`)
  #   and no leg in this file ever overrides it, so every one of the six published assets — on
  #   every state of the four-state escada — is gen1, built down the SAME C route, then (for the
  #   `linux` kind) recompiled from the identical `out/teko.c` by that label's own toolchain. This
  #   is not an implementation detail this job happens to rely on; it is the WHOLE REASON the
  #   fixpoint-backend pin is scoped to a subshell inside `fixpoint_gate.sh` rather than exported
  #   on the step or the job (see that job's Fixpoint step: *"a wide `TEKO_BACKEND` pin leaks into
  #   everything below it"*) — the shipped asset was DELIBERATELY insulated from this axis.
  #
  #   READING B (rejected): gate this job on all four legs sharing one `fixpoint_backend` value —
  #   i.e. only compare legs that are ALL `native` or ALL `c`. This would model the shipped assets
  #   as if they differed by that axis, which Reading A shows they do not: all four are C-route
  #   gen1 regardless of the label their fixpoint proof carries. Adopting it would refuse valid
  #   comparisons for no architectural reason (e.g. it would forbid comparing today's
  #   arm64-glibc/c against x86_64-musl/c while arm64-musl/native and x86_64-glibc/native sit out,
  #   even though all four binaries are the same generation) and would silently stop asserting the
  #   very cross-arch leak class this job exists for, the day the escada reaches "all four native"
  #   (state 4) — exactly the state where the job is MOST needed, since gen1 might by then be
  #   built by four DIFFERENT native emitters instead of one shared `cc`.
  #
  # RECOMMENDATION: Reading A, unconditionally, is what this job does below. If a future wagon
  # changes what backend BUILDS THE SHIPPED ASSET (not the fixpoint proof) — i.e. flips
  # `TEKO_SELFHOST_BACKEND` on a leg — this job's assumption breaks and must be revisited then,
  # with the new premise stated as explicitly as this one is.
  #
  # It is a pure CONSUMER: it downloads the four published assets and runs them. The x86_64 pair
  # runs natively; the arm64 pair runs under qemu-user with `-L <sysroot>` so the dynamic glibc
  # artifact finds its loader (measured, not assumed: without `-L` a dynamic aarch64
  # artifact dies at "Could not open '/lib/ld-linux-*.so.*'").
  #
  # EXPECTED RED UNTIL THE LADDER REACHES IT: `uniontest` currently stops at the honest
  # `native backend N1: field/index access on a non-struct receiver not yet lowered (N2)`. That is
  # the ladder working — the lane turns green when that rung closes, and until then it is naming a
  # real gap instead of hiding one.
  cross-arch-determinism:
    needs: [plan, artifact-linux-arm64-glibc, artifact-linux-arm64-musl, artifact-linux-x86_64-glibc, artifact-linux-x86_64-musl]
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.full == 'true'
    name: cross-arch determinism (four Linux assets emit an identical object)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # qemu-user-static executes the non-native artifacts; libc6-arm64-cross carries
      # ONLY the target loader + shared libc the glibc artifact needs at runtime — no
      # compiler.
      - name: Install qemu-user-static + the arm64 loader
        run: |
          sudo apt-get update -y
          sudo apt-get install -y qemu-user-static libc6-arm64-cross

      # Every Linux producer's upload, merged into one tree. Labels are unique across producers,
      # so `merge-multiple` cannot collide and the result is exactly `dl/<label>/teko`.
      - name: Download every Linux asset
        uses: actions/download-artifact@v4
        with:
          pattern: teko-assets-linux-*
          merge-multiple: true
          path: dl

      - name: Run all four assets + assert an identical emitted object
        shell: bash
        run: |
          set -eu
          # The target every asset emits FOR. Pinned on purpose — see the job comment: leaving it
          # to the host-aware default makes the four outputs differ legitimately and the lane stops
          # measuring anything.
          PINNED_TARGET="x86_64-linux"
          echo "comparing the SET: linux-x86_64-glibc linux-x86_64-musl linux-arm64-glibc linux-arm64-musl (all four required legs succeeded, or this job would not be running)"
          # run_art LABEL ARGS… — invoke dl/LABEL/teko, natively or under the right emulator. The
          # `-L` sysroot is required by the glibc (dynamic) artifact and harmless for the
          # static musl one, so the shape is uniform.
          run_art() {
            label="$1"; shift
            case "$label" in
              *-x86_64-*)  "./dl/$label/teko" "$@" ;;
              *-arm64-*)   qemu-aarch64-static -L /usr/aarch64-linux-gnu "./dl/$label/teko" "$@" ;;
              *) echo "run_art: unknown label '$label'" >&2; return 1 ;;
            esac
          }
          REF_SHA=""
          for label in linux-x86_64-glibc linux-x86_64-musl \
                       linux-arm64-glibc linux-arm64-musl; do
            echo "=== $label ==="
            chmod +x "./dl/$label/teko"
            file "./dl/$label/teko"
            run_art "$label" --version
            out="/tmp/xemit-$label"
            rm -rf "$out"
            run_art "$label" build examples/smoke/uniontest -o "$out" \
                    --target="$PINNED_TARGET" --no-verify --release
            # Located, not assumed: the object's on-disk name comes from the project stem and the
            # output layout, and a hard-coded path that silently stops matching would turn this
            # lane into a `sha256sum` error instead of the determinism verdict it owes.
            obj="$(find "$out" -name '*.o' -type f | sort | head -n1)"
            if [ -z "$obj" ]; then
              echo "FAIL — $label emitted no object under $out" >&2
              echo "contents:" >&2
              find "$out" -type f | sed 's/^/  /' >&2
              exit 1
            fi
            sha="$(sha256sum "$obj" | awk '{print $1}')"
            echo "$label emitted $(basename "$obj") for $PINNED_TARGET, sha256 $sha"
            if [ -z "$REF_SHA" ]; then
              REF_SHA="$sha"
            elif [ "$sha" != "$REF_SHA" ]; then
              echo "FAIL — $label emitted a DIFFERENT object than the first artifact ($sha != $REF_SHA)" >&2
              echo "every asset emitted for the SAME pinned target ($PINNED_TARGET), so the only" >&2
              echo "variable is the architecture the compiler RAN on — a pointer-width," >&2
              echo "endianness or hash-order leak into the emitter is the thing this catches" >&2
              exit 1
            fi
          done
          echo "all four artifacts ran and emitted a byte-identical object for $PINNED_TARGET ($REF_SHA)"

  # ══ seed-debut ═════════════════════════════════════════════════════════════════════════════
  # TIER: full only.
  #
  # `needs: [plan]` ONLY — no producer leg. This lane never downloaded a published asset (it
  # provisions its OWN seed via `scripts/ci_provision_teko.sh`, independently, on each of its four
  # hosts), so before this wagon it was tied to the single `artifact` job purely by the (now
  # revoked) blanket rule "every leaf needs: [plan, artifact]" — a rule that COST something real:
  # a red leg on a producer this lane never touches used to skip it anyway. Since there is no
  # longer one shared job to name, and this lane genuinely consumes NONE of the six, it needs only
  # `plan` — this is the "regra própria" the redesign's risk review called for: a layer that
  # cannot be chained to one leg gets its own rule instead of being forced through gymnastics to
  # fake a dependency it does not have.
  #
  # THE ONE LANE THAT MAY NAME scripts/ci_provision_teko.sh outside a producer leg, declared in
  # .github/ci-lane-exceptions.txt with its reason: the provisioning path IS the subject under
  # test. Every producer leg wants "a working teko on this host" and can provision one to get
  # there; this lane wants the answer to "does the committed blob still provision and still build
  # the tip, on this host", which no download can answer.
  #
  # PROVENANCE (owner ruling 2026-07-26): the committed blobs are NOT produced by an agent
  # locally — they are extracted from the ARTIFACTS OF A GREEN CI RUN at bump time and only then
  # versioned. The wrongly-provenanced blobs were REMOVED, so `bootstrap/seeds/` does not exist in
  # the tree today. This lane reports that absence honestly and exits 0: an absent transitional
  # blob is not a failure. On the bump wagon's own run the directory exists, the probe does not
  # trip, and this is where the seeds debut and must pass.
  #
  # WHY IT BUILDS RATHER THAN JUST SMOKING `--version`: a seed's whole job is to compile the tip.
  # `--version` proves the binary loads on the host, which is necessary and nowhere near
  # sufficient — a seed that loads and then cannot build is a seed that fails at the moment it is
  # needed, on the run that needed it.
  seed-debut:
    needs: [plan]
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: ubuntu-24.04-arm
            label: linux-arm64
          - os: macos-latest
            label: macos-arm64
          - os: windows-latest
            label: windows-x86_64
    name: seed debut / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # THE HONEST-ABSENCE PROBE. It gates every step below, so while the blobs are out of the
      # tree this lane costs a checkout and reports why it did nothing — rather than failing on a
      # missing manifest and teaching everyone to ignore a red lane.
      # THIS LANE IS A MULTI-OS MATRIX (linux x2, macOS, Windows). The POSIX legs keep their bash
      # steps UNCHANGED; the Windows leg (owner ruling 2026-08-18) is bash-free — its steps are pwsh
      # twins gated on `runner.os == 'Windows'`, and the POSIX steps carry `runner.os != 'Windows'`
      # so nothing runs twice. linux/macos behaviour is identical: `runner.os != 'Windows'` is
      # always true for them. The lane is INERT today (bootstrap/seeds/ is absent, so every probe
      # reports present=false and the steps below skip on every host).
      - name: Is there a committed seed to debut? (POSIX)
        id: probe
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          if [ -f bootstrap/seeds/SEEDS.sha256 ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "bootstrap/seeds/SEEDS.sha256 is present — the committed seed debuts on this host."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "bootstrap/seeds/ is ABSENT — there is no committed seed to debut."
            echo "This is the expected state until the bump wagon extracts the blobs from a green"
            echo "CI run's artifacts (owner ruling 2026-07-26 on provenance). Reporting the"
            echo "absence and passing: an absent transitional blob is not a failure."
          fi

      - name: Is there a committed seed to debut? (Windows, pwsh)
        id: probe_win
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath bootstrap/seeds/SEEDS.sha256 -PathType Leaf) {
            "present=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "bootstrap/seeds/SEEDS.sha256 is present — the committed seed debuts on this host."
          } else {
            "present=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "bootstrap/seeds/ is ABSENT — there is no committed seed to debut (expected until the bump wagon extracts the blobs)."
          }

      - name: Report the host toolchain (diagnostic — never fails the job)
        if: steps.probe.outputs.present == 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          for t in cc clang gcc xz python3 7z; do
            printf '%-8s ' "$t"
            command -v "$t" || echo '(absent)'
          done
          # THE TARGET TRIPLE, NOT JUST THE PATH. `command -v` says WHERE cc is; it does not say
          # WHAT IT TARGETS. `-dumpmachine` answers it outright (x86_64-w64-mingw32 vs
          # x86_64-pc-windows-msvc vs x86_64-linux-gnu). Full `-v` output would be dozens of lines.
          for t in cc clang gcc; do
            if command -v "$t" >/dev/null 2>&1; then
              printf '%-8s target: ' "$t"
              "$t" -dumpmachine 2>/dev/null || echo '(no -dumpmachine)'
            fi
          done

      - name: Report the host toolchain (Windows, pwsh — never fails the job)
        if: steps.probe_win.outputs.present == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($t in @('clang','lld-link','llvm-lib','python3')) {
            $c = Get-Command $t -ErrorAction SilentlyContinue
            '{0,-14} {1}' -f $t, $(if ($c) { $c.Source } else { '(absent)' })
          }
          foreach ($t in @('clang','cc','gcc')) {
            $c = Get-Command $t -ErrorAction SilentlyContinue
            if ($c) { '{0,-14} target: {1}' -f $t, (& $t -dumpmachine 2>$null) }
          }

      - name: Install cc (Linux only — macOS and the Windows images ship clang)
        if: steps.probe.outputs.present == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang

      - name: Provision the COMMITTED seed (sha256-verified before decompression)
        if: steps.probe.outputs.present == 'true' && runner.os != 'Windows'
        shell: bash
        env:
          TEKO_SEED_PREFER_COMMITTED: "1"
          LABEL: ${{ matrix.label }}
        run: ./scripts/ci_provision_teko.sh "$LABEL"

      # WINDOWS pwsh twin: native download/extract (Get-FileHash + python3 lzma), never MinGW xz/curl.
      - name: Provision the COMMITTED seed (Windows, pwsh — sha256-verified before decompression)
        if: steps.probe_win.outputs.present == 'true' && runner.os == 'Windows'
        shell: pwsh
        env:
          TEKO_SEED_PREFER_COMMITTED: "1"
          LABEL: ${{ matrix.label }}
        run: ./scripts/win/provision_seed.ps1 -Label $env:LABEL -PreferCommitted

      # The committed seed compiles THIS tip. No fallback ladder here on purpose: the ladder
      # exists to bridge a released seed to a newer tip, and this seed was cut FROM the tip — if
      # it cannot build it directly, the committed blob is wrong and that is exactly the finding.
      # SAME BACKEND PIN AS THE LADDER: the only route that self-hosts today is C.
      - name: Build the tip with the committed seed
        if: steps.probe.outputs.present == 'true' && runner.os != 'Windows'
        shell: bash
        env:
          TEKO_BACKEND: ${{ env.TEKO_SELFHOST_BACKEND || 'c' }}
        run: teko . -o out --no-verify --release

      - name: Build the tip with the committed seed (Windows, pwsh)
        if: steps.probe_win.outputs.present == 'true' && runner.os == 'Windows'
        shell: pwsh
        env:
          TEKO_BACKEND: ${{ env.TEKO_SELFHOST_BACKEND || 'c' }}
        run: |
          & teko . -o out --no-verify --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # ══ mem-paranoid ═══════════════════════════════════════════════════════════════════════════
  # TIER: full only.
  #
  # `needs: [plan, artifact-linux-x86_64-glibc]` — this always downloaded exactly this one
  # producer, so unrolling the matrix changes only its name.
  mem-paranoid:
    needs: [plan, artifact-linux-x86_64-glibc]
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.full == 'true'
    name: Memory paranoid (native self-host)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # THE OBJECT-FORMAT PARSERS THE CROSS GATES READ WITH — and this leg installed NOTHING.
      # `scripts/check_coff.sh` and `scripts/check_elf.sh` read the CROSS-emitted object with
      # `llvm-readobj`/`llvm-objdump` (the only parsers that read COFF, and foreign-arch ELF, on this
      # host) and both FAIL CLOSED when they are absent: *"a gate that passes with nothing to check
      # is a hidden error"*. Measured on run 30535419502: `own_cross_x86_64_windows_emits_coff` died
      # for lack of the parser the moment it became REACHABLE (the rows before it now pass). The
      # image's `clang` does not carry them; `llvm` does.
      #
      # `lld` JOINS IT, and the gate itself named the reason. With `llvm` alone the COFF row passed and
      # the next row — `own_cross_arm64_linux_emits_elf` — became reachable and failed with
      # *"no cross-capable LLVM disassembler/relinker for an arm64 object exists on Linux-x86_64
      # (looked for llvm-objdump / ld.lld) — install LLVM's lld+objdump on this host"* (measured, run
      # 30539595001, six times). `ld.lld` ships in `lld`, not in `llvm`.
      - name: Install the object-format parsers the cross gates read with
        run: |
          sudo apt-get update -y
          sudo apt-get install -y llvm lld

      - name: Download the published x86_64 asset
        uses: actions/download-artifact@v4
        with:
          name: teko-assets-linux-x86_64-glibc
          path: dl

      - name: Restore the executable bit
        run: |
          set -eu
          chmod +x dl/linux-x86_64-glibc/teko
          dl/linux-x86_64-glibc/teko --version

      # KNOWN-STOP (.32) — THIS STEP ASSERTS THE STOP, NOT THE SELF-HOST. Owner ruling 2026-07-28:
      # *"Converter em KNOWN-STOP explícito."*
      #
      # The step used to demand a NATIVE self-host, and the native backend cannot build the compiler
      # yet — `scripts/fixpoint_gate.sh` says so in as many words: *"gen1 (the wagon's own compiler)
      # defaults to the NATIVE backend, which cannot yet build the compiler"*. That is why the .31
      # plan is *".31 com as duas rotas, .32 ensina o nativo, .33 remove"*. So this lane was asking
      # for something the wagon's own design says arrives one version later.
      #
      # NOT SKIPPED, NOT PINNED TO THE C ROUTE. Pinning `TEKO_BACKEND=c` would make the step pass
      # while measuring a road we are retiring — and `fixpoint_gate.sh` records what that costs:
      # the variable *"LEAKS INTO EVERYTHING THAT RUNS BELOW IT"* and turned a regressor green
      # without fixing it. So the native route stays selected.
      #
      # IT NO LONGER NAMES WHICH DEGRAU (owner signed off 2026-07-30). It used to `grep` for
      # *"needs slice elements held BY VALUE"* and fail when the stop was anything else — and that
      # degrau CLOSED, so the pin was already stale — the self-host had moved on to
      # `resolve_generic_inst`, and has moved on TWICE MORE since (measured in run 30563221738:
      # `builtin one_byte not yet lowered (N2)`). That drift is the whole argument, and this comment
      # deliberately stops naming a current degrau so it cannot go stale the same way a third time.
      # A pin keyed on the current degrau goes red on EVERY degrau the ladder
      # closes, which is noise: closing one is progress, and progress must not read as breakage. The
      # owner's own warning cuts both ways here — *"um KNOWN-STOP que falha (vermelho) não
      # necessariamente significa que o erro que existia foi corrigido"* — and a pin that cannot tell
      # "we advanced" from "we broke" tells you nothing.
      #
      # WHAT IT ASSERTS INSTEAD is the pair that is actually stable across the whole ladder:
      #   1. the native self-host does NOT complete; and
      #   2. the way it fails is a NAMED HONEST STOP (`native backend N1`) — not a crash, not a
      #      silent wrong answer, not an empty failure.
      # (2) is the half that earns its keep every run. "Paragem barulhenta é sempre melhor que
      # resposta errada calada": the day the native backend starts failing by segfault or by
      # producing garbage instead of stopping by name, THIS step is what catches it, and no
      # degrau-specific pin ever could.
      #
      # SO IT GOES RED EXACTLY ONCE, on the real event: the day the native self-host SUCCEEDS. That
      # red is the signal to delete this step and restore the plain build:
      #     run: ./dl/linux-x86_64-glibc/teko . -o gen2-mp --no-verify --release
      # The degrau it reaches today is printed for the record, never asserted.
      - name: KNOWN-STOP (.32) — the native self-host stops, and stops HONESTLY
        env:
          TEKO_MEM_PARANOID: '1'
        run: |
          set -u
          # `set +e` IS LOAD-BEARING. GitHub runs this step as `bash -e`, and this build is EXPECTED
          # to fail — that failure is the whole assertion. Without it the step dies on the build's
          # own non-zero status, `rc=$?` and the verdict below become dead code, and the step exits
          # with teko's raw status while the log that explains it goes unread. That is exactly how
          # the Windows asset self-test reported a bare `exit 127` with no output (fixed 2026-07-29,
          # same file). A step that captures `$?` and does not clear `-e` first is always this bug.
          set +e
          ./dl/linux-x86_64-glibc/teko . -o gen2-mp --no-verify --release > mp.log 2>&1
          rc=$?
          set -e
          sh scripts/native_selfhost_known_stop.sh "$rc" mp.log

      - name: Run the single regression executor (TEKO_MEM_PARANOID)
        env:
          TEKO_MEM_PARANOID: '1'
        run: ./dl/linux-x86_64-glibc/teko test .

  # ══ mem-paranoid-linux-x86_64-musl ═════════════════════════════════════════════════════════
  # TIER: full only.
  #
  # THE MEMORY ORACLE, SPLIT OFF FROM THE NATIVE SELF-HOST KNOWN-STOP (owner ruling 2026-07-30:
  # *"tem que ter pra glibc e musl (geramos ambas)"*). Two defects made the single `mem-paranoid`
  # job report nothing at all, and BOTH had to be fixed for the oracle to run again:
  #
  #   1. IT RODE A RED PRODUCER. `mem-paranoid` needs `artifact-linux-x86_64-glibc`, which carries
  #      `fixpoint_backend: native` and is therefore RED BY DESIGN until the native ladder closes —
  #      so the job was `skipped` on every run, and the `Sanitizer gate` correctly refused to accept
  #      its absence ("a gate that accepts its absence gates nothing"). Measured in run
  #      30500310856: `mem-paranoid = skipped`.
  #   2. THE ORACLE SAT BEHIND A STALE PIN — and this reason is HISTORY, kept because it explains
  #      why the oracle lives here and not there. At the time, the first step of `mem-paranoid`
  #      asserted the self-host stopped at *"needs slice elements held BY VALUE"*, and steps run in
  #      order — so even with a green producer the oracle would never be reached, because that
  #      degrau had CLOSED. The pin failing was the pin working (owner: *"ou pq mudamos a direção...
  #      ou pq de fato o corrigimos"*) — but it still blocked the unrelated oracle behind it.
  #      THAT PIN WAS RE-SHAPED on 2026-07-30 with the owner's sign-off and no longer names any
  #      degrau. Reason 1 is the one still standing today; this one is why the layout is what it is.
  #
  # So the oracle lives HERE, on its own, riding a leg whose producer is GREEN. This job makes no
  # claim about the native self-host; that claim stays in `mem-paranoid`, where it belongs.
  #
  # WHY musl AND glibc, not one of them: we SHIP both, so a leak that only the musl allocator
  # surfaces is a leak we ship. `TEKO_MEM_PARANOID` is teko's OWN arena bookkeeping rather than a
  # libc sanitizer, so the two runs mostly agree — but "mostly" is not a reason to measure one.
  mem-paranoid-linux-x86_64-musl:
    needs: [plan, artifact-linux-x86_64-musl]
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.full == 'true'
    name: Memory paranoid (linux-x86_64-musl)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # THE OBJECT-FORMAT PARSERS THE CROSS GATES READ WITH — and this leg installed NOTHING.
      # `scripts/check_coff.sh` and `scripts/check_elf.sh` read the CROSS-emitted object with
      # `llvm-readobj`/`llvm-objdump` (the only parsers that read COFF, and foreign-arch ELF, on this
      # host) and both FAIL CLOSED when they are absent: *"a gate that passes with nothing to check
      # is a hidden error"*. Measured on run 30535419502: `own_cross_x86_64_windows_emits_coff` died
      # for lack of the parser the moment it became REACHABLE (the rows before it now pass). The
      # image's `clang` does not carry them; `llvm` does.
      #
      # `lld` JOINS IT, and the gate itself named the reason. With `llvm` alone the COFF row passed and
      # the next row — `own_cross_arm64_linux_emits_elf` — became reachable and failed with
      # *"no cross-capable LLVM disassembler/relinker for an arm64 object exists on Linux-x86_64
      # (looked for llvm-objdump / ld.lld) — install LLVM's lld+objdump on this host"* (measured, run
      # 30539595001, six times). `ld.lld` ships in `lld`, not in `llvm`.
      - name: Install the object-format parsers the cross gates read with
        run: |
          sudo apt-get update -y
          sudo apt-get install -y llvm lld

      - name: Download the published linux-x86_64-musl asset
        uses: actions/download-artifact@v4
        with:
          name: teko-assets-linux-x86_64-musl
          path: dl

      - name: Restore the executable bit
        run: |
          set -eu
          chmod +x dl/linux-x86_64-musl/teko
          dl/linux-x86_64-musl/teko --version

      - name: Run the regression executor under TEKO_MEM_PARANOID
        env:
          TEKO_MEM_PARANOID: '1'
        run: ./dl/linux-x86_64-musl/teko test .

  # ══ mem-paranoid-linux-arm64-glibc ═════════════════════════════════════════════════════════
  # TIER: full only. SAME BODY as mem-paranoid-linux-x86_64-musl above, for the glibc half of the
  # owner's "glibc e musl" ruling — on arm64, because that is the glibc leg whose producer is GREEN
  # (x86_64-glibc carries the native backend and is red by design). The oracle therefore covers both
  # libcs and both architectures between the two jobs, without waiting on the native ladder.
  mem-paranoid-linux-arm64-glibc:
    needs: [plan, artifact-linux-arm64-glibc]
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.full == 'true'
    name: Memory paranoid (linux-arm64-glibc)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # THE OBJECT-FORMAT PARSERS THE CROSS GATES READ WITH — and this leg installed NOTHING.
      # `scripts/check_coff.sh` and `scripts/check_elf.sh` read the CROSS-emitted object with
      # `llvm-readobj`/`llvm-objdump` (the only parsers that read COFF, and foreign-arch ELF, on this
      # host) and both FAIL CLOSED when they are absent: *"a gate that passes with nothing to check
      # is a hidden error"*. Measured on run 30535419502: `own_cross_x86_64_windows_emits_coff` died
      # for lack of the parser the moment it became REACHABLE (the rows before it now pass). The
      # image's `clang` does not carry them; `llvm` does.
      #
      # `lld` JOINS IT, and the gate itself named the reason. With `llvm` alone the COFF row passed and
      # the next row — `own_cross_arm64_linux_emits_elf` — became reachable and failed with
      # *"no cross-capable LLVM disassembler/relinker for an arm64 object exists on Linux-x86_64
      # (looked for llvm-objdump / ld.lld) — install LLVM's lld+objdump on this host"* (measured, run
      # 30539595001, six times). `ld.lld` ships in `lld`, not in `llvm`.
      - name: Install the object-format parsers the cross gates read with
        run: |
          sudo apt-get update -y
          sudo apt-get install -y llvm lld

      - name: Download the published linux-arm64-glibc asset
        uses: actions/download-artifact@v4
        with:
          name: teko-assets-linux-arm64-glibc
          path: dl

      - name: Restore the executable bit
        run: |
          set -eu
          chmod +x dl/linux-arm64-glibc/teko
          dl/linux-arm64-glibc/teko --version

      - name: Run the regression executor under TEKO_MEM_PARANOID
        env:
          TEKO_MEM_PARANOID: '1'
        run: ./dl/linux-arm64-glibc/teko test .

  # ══ gate ═══════════════════════════════════════════════════════════════════════════════════
  gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [plan, artifact-linux-x86_64-glibc, cli-surface-linux-x86_64-glibc, cli-surface-macos-arm64, ar-validation-linux-x86_64-glibc, ar-validation-macos-arm64, ar-validation-windows-x86_64, cross-arch-determinism, seed-debut]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Structural — every job is covered, every aggregator is anchored
        run: |
          sh scripts/ci_gate_coverage.sh .github/workflows/pr.yml \
            "artifact-linux-x86_64-glibc artifact-windows-x86_64" \
            gate test-suite-gate sanitizer-gate

      # THE PURITY PROOF, run once (here) because it is a property of the whole file: no job but
      # the six producer legs may seed or walk the ladder, and zig may not appear anywhere in
      # .github/workflows or scripts. See scripts/ci_lane_purity.sh.
      - name: Structural — only the producer legs build, and the cross toolchain is gone
        run: |
          sh scripts/ci_lane_purity.sh .github/workflows/pr.yml \
            "artifact-linux-arm64-glibc artifact-linux-arm64-musl artifact-linux-x86_64-glibc artifact-linux-x86_64-musl artifact-macos-arm64 artifact-windows-x86_64"

      # THE ONE SWITCH IN THE BOOTSTRAP CHAIN THAT CAN FAIL SILENTLY. Every other break in the
      # chain is loud — a build stops, a comparison disagrees. A criterion that says "declared"
      # when nothing is declared re-routes gen0 through `cc` and the run still goes GREEN, having
      # proven a compiler nobody asked for. It runs here because it needs no compiler and no
      # network: fixtures in a temp dir, under a second.
      - name: Structural — `bootstrap/teko.c` is a rung only when a degrau declares it
        run: sh scripts/degrau_test.sh

      # THE GATE THAT MAKES "teko test . passed" MEAN SOMETHING ON A NATIVE LEG. Owner ruling
      # 2026-07-29: a native-backend test session that still leaves generated C on disk proves
      # nothing about the native backend, so `scripts/no_c_in_tests_gate.sh` (wired onto the
      # test-* jobs above, on the legs whose `fixpoint_backend` is `native`) fails that lane RED
      # when it finds one. This step proves the GATE ITSELF — clean passes, a generated .c/.h fails
      # and is named, a versioned one is never mistaken for it, every unprovable state is FATAL —
      # against throwaway git fixtures, needing no compiler and no network.
      - name: Structural — the no-C-in-tests gate passes clean, fails dirty, never mistakes tracked C
        run: sh scripts/no_c_in_tests_gate_test.sh

      # THE NATIVE SELF-HOST KNOWN-STOP'S OWN TEST. The gate it covers lives in `mem-paranoid`, a job
      # that rides the NATIVE leg and is therefore SKIPPED on every run until the degrau ladder
      # closes — so without this step its logic would ship on the strength of having been read, and
      # "I read it and it looks right" is exactly the proof this lane refuses. It fabricates its own
      # logs, needs no compiler, and proves all three verdicts BY INVERSION: an honest named stop
      # holds, a DIFFERENT degrau still holds (the stale-pin defect, which is what the owner signed
      # off on fixing), a successful self-host goes red, and a CRASH goes red.
      - name: Structural — the native self-host KNOWN-STOP holds, lifts, and refuses a crash
        run: bash scripts/native_selfhost_known_stop_test.sh

      # THE KNOWN-STOP ENVELOPE INTEGRITY GATE. Owner ruling: an envelope may absorb ONLY the
      # diagnostic it pins, never a family of them. Measured directly in run `30400712261` (job
      # `90416003791`, `test / windows-x86_64`): the PREVIOUS inline PowerShell check matched the
      # bare substring `B1-args`, and `src/backend/isel_x86_64.tks` names THREE distinct
      # honest-stops that share it — any one of the three firing read as "KNOWN-STOP held" and
      # would have turned a genuinely different regression green. `scripts/known_stop_gate.sh`
      # (wired onto `test-windows-x86_64` above) matches the pinned diagnostic's FULL text instead.
      # This step proves the gate BY INVERSION: a log shaped exactly like a held pin, but naming a
      # SIBLING B1-args stop, MUST stay red — the shape the bug actually shipped.
      - name: Structural — the KNOWN-STOP envelope absorbs only its own pinned diagnostic
        run: sh scripts/known_stop_gate_test.sh

      # THE PROVENANCE PROOF, against the ACTUAL checked-out tree — not a fixture. `degrau_test.sh`
      # above only proves the DEGRAU library's own logic; nothing yet asks whether a PR that
      # SWAPS `bootstrap/teko.c` (adds, replaces, or removes-and-reintroduces it) can say which CI
      # run produced the new bytes. Owner ruling 2026-07-29, first pass: "arquivos C de gerações ou
      # teko C precisam ser construídos via CI, não pelos agentes, e somente quando o CI passar
      # verde. Assim que se cria degrau." Second pass, and it is the one that fixes this gate's
      # SHAPE: "só podemos trocar o teko.c se ele passar por toda uma cadeia válida, senão não há
      # garantia e 'perdemos' a origem." The verb is TROCAR, so an UNCHANGED `bootstrap/teko.c` is
      # never judged; see scripts/provenance_gate.sh.
      #
      # THE BASE MUST BE FETCHED BEFORE THE GATE CAN SEE IT. The checkout above is shallow
      # (`fetch-depth` defaults to 1), so the PR's base commit is not yet a resolvable object —
      # this fetches EXACTLY that one commit. `github.event.pull_request.base.sha` is always set
      # on this workflow's own trigger (`on: pull_request`), so no fallback is offered here — an
      # absent base is the gate's own FATAL to report, not a case for this step to paper over.
      - name: Fetch the PR base commit (for the provenance gate's diff, nothing else)
        run: git fetch --depth=1 origin "${{ github.event.pull_request.base.sha }}"

      - name: Structural — every SWAP of `bootstrap/teko.c` has a matching provenance record
        env:
          TEKO_PROVENANCE_BASE: ${{ github.event.pull_request.base.sha }}
        run: sh scripts/provenance_gate.sh .

      - name: Structural — the provenance gate's own verdicts are proven, not assumed
        run: sh scripts/provenance_gate_test.sh

      - name: Cross-check the mode against an independent derivation
        if: needs.plan.result == 'success'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          PLAN_FULL: ${{ needs.plan.outputs.full }}
        run: |
          set -euo pipefail
          derived="$(sh scripts/ci_full_mode.sh | sed -n 's/^full=//p')"
          echo "plan says full='$PLAN_FULL'; the independent derivation says full='$derived'"
          if [ "$derived" != "$PLAN_FULL" ]; then
            echo "ERROR: the planner and an independent re-derivation disagree about the mode." >&2
            echo "A gate that accepts 'skipped' on the planner's word cannot detect a broken" >&2
            echo "planner — which is the failure this cross-check exists to catch." >&2
            exit 1
          fi

      # ── THE VERDICT, PER JOB, NOT PER MATRIX ──────────────────────────────────────────────────
      # There is no more planner-emitted matrix to cross-check against a hand-maintained "want"
      # list (that class of check protected against a `plan` that emitted the WRONG matrix; there
      # is no matrix left to get wrong). Each job below is named directly, and its own `.result`
      # is read directly — the explicit job graph above IS the single source of truth this used to
      # need a second list to restate.
      #
      # `artifact-linux-x86_64-glibc` is the ANCHOR: the one both-tier producer this gate's own
      # both-tier consumer (`cli-surface-linux-x86_64-glibc`) depends on. It is currently the
      # `native`-flagged leg on the escada's state 1 (see scripts/ci_producer_matrix.sh), so it is
      # EXPECTED to be red today — which means this gate is expected to STAY red today too, for
      # the same honest reason it always has been. That is not a regression this wagon
      # introduces: it is the same root cause reported before this wagon, now correctly isolated
      # to the chains that actually depend on it (`cli-surface-linux-x86_64-glibc`, `regressor-
      # full`, `ar-validation-linux-x86_64-glibc`, and transitively `cross-arch-determinism`),
      # while `ar-validation-macos-arm64`, `ar-validation-windows-x86_64` and
      # `cli-surface-macos-arm64` — none of which need this anchor — now run and report for
      # themselves instead of being silently skipped behind it.
      - name: Evaluate results
        env:
          CHANGES: ${{ needs.plan.outputs.run }}
          FULL: ${{ needs.plan.outputs.full }}
          PLAN_RESULT: ${{ needs.plan.result }}
          ANCHOR_RESULT: ${{ needs.artifact-linux-x86_64-glibc.result }}
          CLI_XG_RESULT: ${{ needs.cli-surface-linux-x86_64-glibc.result }}
          CLI_MAC_RESULT: ${{ needs.cli-surface-macos-arm64.result }}
          AR_XG_RESULT: ${{ needs.ar-validation-linux-x86_64-glibc.result }}
          AR_MAC_RESULT: ${{ needs.ar-validation-macos-arm64.result }}
          AR_WX_RESULT: ${{ needs.ar-validation-windows-x86_64.result }}
          DETERMINISM_RESULT: ${{ needs.cross-arch-determinism.result }}
          DEBUT_RESULT: ${{ needs.seed-debut.result }}
        run: |
          set -u
          if [ "$FULL" = "true" ]; then MODE=full; else MODE=light; fi
          echo "mode=$MODE"
          echo "plan                                = $PLAN_RESULT"
          echo "plan.run                            = $CHANGES"
          echo "artifact-linux-x86_64-glibc (anchor) = $ANCHOR_RESULT   (both tiers)"
          echo "cli-surface-linux-x86_64-glibc       = $CLI_XG_RESULT   (both tiers)"
          echo "cli-surface-macos-arm64              = $CLI_MAC_RESULT   (full only)"
          echo "ar-validation-linux-x86_64-glibc     = $AR_XG_RESULT   (full only)"
          echo "ar-validation-macos-arm64            = $AR_MAC_RESULT   (full only)"
          echo "ar-validation-windows-x86_64         = $AR_WX_RESULT   (full only)"
          echo "cross-arch-determinism               = $DETERMINISM_RESULT   (full only)"
          echo "seed-debut                           = $DEBUT_RESULT   (full only)"

          FAILED=0

          if [ "$PLAN_RESULT" != "success" ]; then
            echo "ERROR: plan = $PLAN_RESULT (it is unconditional)"
            FAILED=1
          fi

          if [ "$CHANGES" = "true" ]; then
            if [ "$ANCHOR_RESULT" != "success" ]; then
              echo "ERROR: artifact-linux-x86_64-glibc (anchor) = $ANCHOR_RESULT — the both-tier producer must succeed"
              FAILED=1
            fi
          elif [ "$ANCHOR_RESULT" != "skipped" ]; then
            echo "ERROR: artifact-linux-x86_64-glibc (anchor) = $ANCHOR_RESULT with plan.run=false — expected skipped"
            FAILED=1
          fi

          if [ "$CHANGES" != "true" ]; then
            echo "No allowlisted path changed — the compiler-diagnostic lanes had nothing to gate."
            if [ "$FAILED" = "1" ]; then echo "CI gate FAILED (mode=$MODE)."; exit 1; fi
            echo "CI gate passed (mode=$MODE, diagnostics not applicable)."
            exit 0
          fi

          # A both-tiers job must SUCCEED. `skipped` here is a broken condition, not an absence of
          # work.
          require_success() {
            [ "$2" = "success" ] && return 0
            echo "ERROR: $1 = $2 (it runs in both tiers; a skip means a broken condition)"
            FAILED=1
          }
          require_success cli-surface-linux-x86_64-glibc "$CLI_XG_RESULT"

          # A full-only job must SUCCEED in full mode and be SKIPPED on the light tier. The mode
          # itself was cross-checked above against an independent derivation, so "skipped because
          # the mode does not ask" is now a VERIFIED statement and not a self-report.
          require_full_only() {
            if [ "$MODE" = "full" ]; then
              [ "$2" = "success" ] && return 0
              echo "ERROR: $1 = $2 (full mode requires success)"
              FAILED=1
              return 0
            fi
            [ "$2" = "skipped" ] && return 0
            echo "::warning::$1 = $2 on the light tier — expected skipped; check its \`if:\` condition."
          }
          require_full_only cli-surface-macos-arm64          "$CLI_MAC_RESULT"
          require_full_only ar-validation-linux-x86_64-glibc  "$AR_XG_RESULT"
          require_full_only ar-validation-macos-arm64         "$AR_MAC_RESULT"
          require_full_only ar-validation-windows-x86_64      "$AR_WX_RESULT"
          require_full_only cross-arch-determinism            "$DETERMINISM_RESULT"
          require_full_only seed-debut                        "$DEBUT_RESULT"

          if [ "$FAILED" = "1" ]; then
            echo "CI gate FAILED (mode=$MODE)."
            exit 1
          fi
          echo "CI gate passed (mode=$MODE)."
          exit 0

  test-suite-gate:
    name: Test suite gate
    runs-on: ubuntu-latest
    needs: [plan, artifact-linux-arm64-glibc, artifact-linux-arm64-musl, artifact-linux-x86_64-glibc, artifact-linux-x86_64-musl, artifact-macos-arm64, artifact-windows-x86_64, test-linux-arm64-glibc, test-linux-arm64-musl, test-linux-x86_64-glibc, test-linux-x86_64-musl, test-macos-arm64, test-windows-x86_64]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Structural — every job is covered, every aggregator is anchored
        run: |
          sh scripts/ci_gate_coverage.sh .github/workflows/pr.yml \
            "artifact-linux-x86_64-glibc artifact-windows-x86_64" \
            gate test-suite-gate sanitizer-gate

      - name: Cross-check the mode against an independent derivation
        if: needs.plan.result == 'success'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          PLAN_FULL: ${{ needs.plan.outputs.full }}
        run: |
          set -euo pipefail
          derived="$(sh scripts/ci_full_mode.sh | sed -n 's/^full=//p')"
          echo "plan says full='$PLAN_FULL'; the independent derivation says full='$derived'"
          [ "$derived" = "$PLAN_FULL" ] || { echo "ERROR: mode disagreement — see CI gate's note." >&2; exit 1; }

      # THIS AGGREGATES ALL SIX PRODUCER LEGS AND ALL SIX TEST LEGS DIRECTLY — it is the one
      # aggregator that happens to need every producer job, because it is the one layer where
      # every leg has its own test consumer. That is a fact about what this gate aggregates, not a
      # rule imposed by `ci_gate_coverage.sh`'s ANCHORED check (which only asks for at least one
      # both-tier anchor — this gate simply has all six).
      #
      # THE OLD "PLANNED ASSET SET" CROSS-CHECK IS GONE, and correctly: it existed to catch a
      # `plan` that emitted a JSON matrix listing the wrong assets. There is no matrix left to get
      # wrong — the twelve jobs named in `needs:` above ARE the required set, checked here by
      # reading their own `.result` directly.
      - name: Evaluate results
        env:
          CHANGES: ${{ needs.plan.outputs.run }}
          FULL: ${{ needs.plan.outputs.full }}
          PLAN_RESULT: ${{ needs.plan.result }}
          AG_A: ${{ needs.artifact-linux-arm64-glibc.result }}
          AM_A: ${{ needs.artifact-linux-arm64-musl.result }}
          XG_A: ${{ needs.artifact-linux-x86_64-glibc.result }}
          XM_A: ${{ needs.artifact-linux-x86_64-musl.result }}
          MAC_A: ${{ needs.artifact-macos-arm64.result }}
          WX_A: ${{ needs.artifact-windows-x86_64.result }}
          AG_T: ${{ needs.test-linux-arm64-glibc.result }}
          AM_T: ${{ needs.test-linux-arm64-musl.result }}
          XG_T: ${{ needs.test-linux-x86_64-glibc.result }}
          XM_T: ${{ needs.test-linux-x86_64-musl.result }}
          MAC_T: ${{ needs.test-macos-arm64.result }}
          WX_T: ${{ needs.test-windows-x86_64.result }}
        run: |
          set -u
          if [ "$FULL" = "true" ]; then MODE=full; else MODE=light; fi
          echo "mode=$MODE"
          echo "plan                        = $PLAN_RESULT"
          echo "artifact-linux-arm64-glibc  = $AG_A     test-linux-arm64-glibc  = $AG_T   (full only)"
          echo "artifact-linux-arm64-musl   = $AM_A     test-linux-arm64-musl   = $AM_T   (full only)"
          echo "artifact-linux-x86_64-glibc = $XG_A     test-linux-x86_64-glibc = $XG_T   (both tiers)"
          echo "artifact-linux-x86_64-musl  = $XM_A     test-linux-x86_64-musl  = $XM_T   (full only)"
          echo "artifact-macos-arm64        = $MAC_A    test-macos-arm64        = $MAC_T  (full only)"
          echo "artifact-windows-x86_64     = $WX_A     test-windows-x86_64     = $WX_T   (both tiers)"

          FAILED=0
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "ERROR: plan = $PLAN_RESULT (it is unconditional)"
            FAILED=1
          fi

          if [ "$CHANGES" != "true" ]; then
            echo "plan.run=false (docs-only) — every producer and test job must be SKIPPED."
            for pair in "artifact-linux-arm64-glibc:$AG_A" "artifact-linux-arm64-musl:$AM_A" \
                        "artifact-linux-x86_64-glibc:$XG_A" "artifact-linux-x86_64-musl:$XM_A" \
                        "artifact-macos-arm64:$MAC_A" "artifact-windows-x86_64:$WX_A" \
                        "test-linux-arm64-glibc:$AG_T" "test-linux-arm64-musl:$AM_T" \
                        "test-linux-x86_64-glibc:$XG_T" "test-linux-x86_64-musl:$XM_T" \
                        "test-macos-arm64:$MAC_T" "test-windows-x86_64:$WX_T"; do
              name="${pair%%:*}"; result="${pair#*:}"
              if [ "$result" != "skipped" ]; then
                echo "ERROR: $name = $result with plan.run=false — expected skipped"
                FAILED=1
              fi
            done
            if [ "$FAILED" = "1" ]; then echo "Test suite gate FAILED (mode=$MODE)."; exit 1; fi
            echo "Test suite gate passed (mode=$MODE, diagnostics not applicable)."
            exit 0
          fi

          # BOTH-TIER legs: the producer AND its test job must SUCCEED in both modes.
          require_success() {
            [ "$2" = "success" ] && return 0
            echo "ERROR: $1 = $2 (it runs in both tiers; a skip means a broken condition)"
            FAILED=1
          }
          require_success "artifact-linux-x86_64-glibc" "$XG_A"
          require_success "test-linux-x86_64-glibc"     "$XG_T"
          require_success "artifact-windows-x86_64"     "$WX_A"
          require_success "test-windows-x86_64"         "$WX_T"

          # FULL-ONLY legs: SUCCEED in full mode, SKIPPED on light.
          require_full_only() {
            if [ "$MODE" = "full" ]; then
              [ "$2" = "success" ] && return 0
              echo "ERROR: $1 = $2 (full mode requires success)"
              FAILED=1
              return 0
            fi
            [ "$2" = "skipped" ] && return 0
            echo "::warning::$1 = $2 on the light tier — expected skipped; check its \`if:\` condition."
          }
          require_full_only "artifact-linux-arm64-glibc" "$AG_A"
          require_full_only "test-linux-arm64-glibc"     "$AG_T"
          require_full_only "artifact-linux-arm64-musl"  "$AM_A"
          require_full_only "test-linux-arm64-musl"      "$AM_T"
          require_full_only "artifact-linux-x86_64-musl" "$XM_A"
          require_full_only "test-linux-x86_64-musl"     "$XM_T"
          require_full_only "artifact-macos-arm64"       "$MAC_A"
          require_full_only "test-macos-arm64"           "$MAC_T"

          if [ "$FAILED" = "1" ]; then
            echo "Test suite gate FAILED (mode=$MODE)."
            exit 1
          fi
          echo "Test suite gate passed (mode=$MODE)."
          exit 0

  sanitizer-gate:
    name: Sanitizer gate
    runs-on: ubuntu-latest
    needs: [plan, artifact-linux-x86_64-glibc, mem-paranoid, mem-paranoid-linux-x86_64-musl, mem-paranoid-linux-arm64-glibc]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Structural — every job is covered, every aggregator is anchored
        run: |
          sh scripts/ci_gate_coverage.sh .github/workflows/pr.yml \
            "artifact-linux-x86_64-glibc artifact-windows-x86_64" \
            gate test-suite-gate sanitizer-gate

      - name: Cross-check the mode against an independent derivation
        if: needs.plan.result == 'success'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          PLAN_FULL: ${{ needs.plan.outputs.full }}
        run: |
          set -euo pipefail
          derived="$(sh scripts/ci_full_mode.sh | sed -n 's/^full=//p')"
          echo "plan says full='$PLAN_FULL'; the independent derivation says full='$derived'"
          [ "$derived" = "$PLAN_FULL" ] || { echo "ERROR: mode disagreement — see CI gate's note." >&2; exit 1; }

      # `artifact-linux-x86_64-glibc` IS THE ANCHOR HERE TOO: `mem-paranoid` consumes exactly that
      # one producer, so it is both this gate's ONLY both-tier dependency and the reason this gate
      # can never report success in light mode having asserted nothing.
      - name: Evaluate results
        env:
          CHANGES: ${{ needs.plan.outputs.run }}
          FULL: ${{ needs.plan.outputs.full }}
          PLAN_RESULT: ${{ needs.plan.result }}
          ANCHOR_RESULT: ${{ needs.artifact-linux-x86_64-glibc.result }}
          MEM_PARANOID: ${{ needs.mem-paranoid.result }}
          MP_XM: ${{ needs.mem-paranoid-linux-x86_64-musl.result }}
          MP_AG: ${{ needs.mem-paranoid-linux-arm64-glibc.result }}
        run: |
          set -u
          if [ "$FULL" = "true" ]; then MODE=full; else MODE=light; fi
          echo "mode=$MODE"
          echo "plan                                = $PLAN_RESULT"
          echo "plan.run                            = $CHANGES"
          echo "artifact-linux-x86_64-glibc (anchor) = $ANCHOR_RESULT   (both tiers)"
          echo "mem-paranoid                         = $MEM_PARANOID   (full only)"
          echo "mem-paranoid-linux-x86_64-musl        = $MP_XM   (full only)"
          echo "mem-paranoid-linux-arm64-glibc        = $MP_AG   (full only)"

          FAILED=0
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "ERROR: plan = $PLAN_RESULT (it is unconditional)"; FAILED=1
          fi
          if [ "$CHANGES" = "true" ]; then
            if [ "$ANCHOR_RESULT" != "success" ]; then
              echo "ERROR: artifact-linux-x86_64-glibc (anchor) = $ANCHOR_RESULT — mem-paranoid consumes its output"; FAILED=1
            fi
          elif [ "$ANCHOR_RESULT" != "skipped" ]; then
            echo "ERROR: artifact-linux-x86_64-glibc (anchor) = $ANCHOR_RESULT with plan.run=false — expected skipped"; FAILED=1
          fi

          if [ "$CHANGES" != "true" ]; then
            echo "No allowlisted path changed — nothing for the sanitizer lane to gate."
            if [ "$FAILED" = "1" ]; then echo "Sanitizer gate FAILED (mode=$MODE)."; exit 1; fi
            echo "Sanitizer gate passed (mode=$MODE, not applicable)."
            exit 0
          fi

          # The LAST memory oracle. TSan, ASan/UBSan and LSan left with the C emitter they
          # instrumented — a backend that writes objects directly has no clang to instrument it.
          # `mem-paranoid` stays because its oracle is the ARENA, not C: poison-on-free plus
          # never-reuse, which the runtime carries in whatever language it is written in.
          # BOTH LIBCS, BECAUSE WE SHIP BOTH (owner ruling 2026-07-30: "tem que ter pra glibc e musl
          # (geramos ambas)"). These two ride GREEN producers, so unlike `mem-paranoid` they actually
          # run — a leak the musl allocator surfaces is a leak we ship, and measuring one libc while
          # publishing two is the same class of blind spot as a row nobody runs.
          if [ "$MODE" = "full" ]; then
            if [ "$MEM_PARANOID" != "success" ]; then
              echo "ERROR: mem-paranoid = $MEM_PARANOID (full mode requires success — it carries the"
              echo "native self-host KNOWN-STOP, and its producer is the native leg, red by design."
              echo "The PIN is not the cause and needs no decision: it stopped naming a degrau on"
              echo "2026-07-30 (owner signed off) and now asserts only that the self-host does not"
              echo "complete AND that it stops BY NAME. This line goes green when the native ladder"
              echo "closes — not before, and nothing here is waiting on you.)"
              FAILED=1
            fi
            if [ "$MP_XM" != "success" ]; then
              echo "ERROR: mem-paranoid-linux-x86_64-musl = $MP_XM (full mode requires success)"
              FAILED=1
            fi
            if [ "$MP_AG" != "success" ]; then
              echo "ERROR: mem-paranoid-linux-arm64-glibc = $MP_AG (full mode requires success)"
              FAILED=1
            fi
          elif [ "$MEM_PARANOID" != "skipped" ]; then
            echo "::warning::mem-paranoid = $MEM_PARANOID on the light tier — expected skipped."
          fi

          if [ "$FAILED" = "1" ]; then
            echo "Sanitizer gate FAILED (mode=$MODE)."
            exit 1
          fi
          echo "Sanitizer gate passed (mode=$MODE)."
          exit 0
