  # ══ artifact-windows-x86_64 ════════════════════════════════════════════════════════════════
  # TIER: both. `kind=native`: the runner IS the target, so the dry build's own binary is the
  # asset — there is no separate native-Linux-asset step. SAME RATIONALE as
  # artifact-linux-arm64-glibc above.
  artifact-windows-x86_64:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    name: artifact / windows-x86_64
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # WINDOWS IS NOW 100% pwsh-NATIVE (owner ruling 2026-08-18: "a falha real é rodar em mingw,
      # ao invés do powershell nativo usando as ferramentas corretas. Mingw é lento, obeso e fraco.")
      # No `shell: bash` (= Git-Bash/MinGW), no `sh scripts/*.sh`: every Windows step runs pwsh and
      # calls the pwsh mirrors under scripts/win/. The `.sh` scripts are untouched and keep serving
      # linux/macos.
      - name: Report the host toolchain (diagnostic — never fails the job)
        shell: pwsh
        run: |
          # THE TARGET TRIPLE, NOT JUST THE PATH. The toolchain that matters on Windows is clang
          # (x86_64-pc-windows-msvc) + lld-link + llvm-lib — never MinGW cc. `-dumpmachine` answers
          # WHAT clang targets in one line; a `cc` resolving to x86_64-w64-mingw32 would be the bug.
          foreach ($t in @('clang','lld-link','llvm-lib','dumpbin','llvm-readobj','tar','python3')) {
            $c = Get-Command $t -ErrorAction SilentlyContinue
            '{0,-14} {1}' -f $t, $(if ($c) { $c.Source } else { '(absent)' })
          }
          foreach ($t in @('clang','cc','gcc')) {
            $c = Get-Command $t -ErrorAction SilentlyContinue
            if ($c) { '{0,-14} target: {1}' -f $t, (& $t -dumpmachine 2>$null) }
          }

      - name: Produce this leg's assets (degrau → dry build → this runner IS the asset)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          # The rung -1 degrau compiler is C-linked directly by build_gen1_from_c.ps1, OUTSIDE
          # teko's own run_cc (which already emits -Wl,/STACK via build_cc_argv). It therefore inherits
          # Windows' ~1 MiB default main-thread stack and faults with 0xC00000FD (STATUS_STACK_OVERFLOW)
          # in consteval while building the tip. Widen the PE stack reserve to 64 MiB (0x4000000) via
          # the script's link-flag passthrough (clang forwards `/STACK:` to lld-link) — Windows leg only.
          TEKO_DEGRAU_LDFLAGS: "-Wl,/STACK:67108864"
        run: ./scripts/win/produce_assets.ps1 native windows-x86_64 windows-x86_64

      - name: Fixpoint — gen2 == gen3 over the same source, and no emitted C
        shell: pwsh
        env:
          TEKO_FIXPOINT_BACKEND: ${{ needs.plan.outputs.fb_windows_x86_64 }}
        run: ./scripts/win/fixpoint_gate.ps1 out/teko . .fixpoint

      - name: Harvest gen1's emitted C (only over a fixpoint that HELD)
        if: ${{ success() }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path harvest | Out-Null
          if (Test-Path -LiteralPath out/teko.c -PathType Leaf) {
            Copy-Item -LiteralPath out/teko.c -Destination harvest/teko.c
            Get-ChildItem harvest | Format-Table -AutoSize
          } else {
            Write-Host "NOTE: no out/teko.c — this leg's gen1 emitted no C. Nothing to harvest; the fixpoint above still stands."
          }

      - name: Upload the harvested C
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: teko-c-windows-x86_64
          path: harvest
          if-no-files-found: warn
          retention-days: 7

      - name: Upload the assets
        uses: actions/upload-artifact@v4
        with:
          name: teko-assets-windows-x86_64
          path: stage
          if-no-files-found: error
          retention-days: 7

