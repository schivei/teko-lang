      # boa. Quando o `llvm`+`lld` entraram nas pernas Linux ficou escrito que macOS e Windows
      # paravam antes de chegar às filas de objecto, logo não se sabia se tinham os parsers. Agora
      # sabe-se, e a medição é do CI (run 30559176876, `test / macos-arm64`):
      #
      #   check_coff: FAIL — the cross-format COFF parser 'llvm-readobj' is absent on Darwin-arm64
      #
      # É a MESMA causa das pernas Linux, com outro gestor de pacotes. O `objdump` que a Apple
      # instala é LLVM por baixo, mas não expõe `llvm-readobj`, que é o que lê COFF em qualquer
      # hospedeiro. `scripts/check_coff.sh` e `scripts/check_elf.sh` falham CLOSED sem eles — é a
      # regra da casa, e não se contorna com OBJ_CHECK_ALLOW_SKIP.
