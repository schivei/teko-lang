      # emitir C quando for compilar nativo [...] se ao final de uma sessão de testes houver um C
      # gerado, tem que fechar vermelha a lane." `scripts/no_c_in_tests_gate.sh` is that check;
      # `scripts/no_c_in_tests_gate_test.sh` (run in `CI gate`) proves the check itself.
