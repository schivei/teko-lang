name: Pull Request CI

# ══════════════════════════════════════════════════════════════════════════════════════════════
# THE SINGLE `pull_request` WORKFLOW. It replaces, and deletes, four files:
#   native.yml (Native Build & Test) · tests.yml (Tests) · sanitizers.yml (Sanitizers & Stress)
#   · sast.yml (SAST Gate)
#
# ── WHY ONE FILE (owner ruling 2026-07-26) ────────────────────────────────────────────────────
# "todas as lanes de pull_request precisam depender dessa lane de artefatos, a lane de artefatos
# deve executar build seco `teko build . --no-verify --release` e ela deve ter a inteligência
# sobre o que deve gerar (a escada)" — and, when the structural consequence was put to him,
# "mesmo que custe (exceto a algumas de push) colocar tudo no mesmo yml" / "se não atravessa,
# transforme em um único yaml, os únicos independentes são os que esperam push".
#
# The structural consequence is a GitHub Actions primitive and there is no way around it:
# `needs:` DOES NOT CROSS WORKFLOW FILES. For every lane to depend on one artifact root, every
# lane has to live where that root lives. The cost is a large file; the alternative was eleven
# jobs each paying for its own seed provision and its own self-host before doing its own work,
# which is what was measured here before this wagon.
#
# STILL INDEPENDENT, and deliberately so:
#   codeql.yml       — `pull_request`, but owner ruling 2026-07-26: "CodeQL é independente, até
#                      pq, provavelmente, ainda teremos uma rodada pós linker para ensinar o
#                      CodeQL e o dependabot a analisarem teko." It is separable ON PURPOSE
#                      because it has its own wave coming. Consolidating it now would only create
#                      work to undo. Its required check (`CodeQL`) is published by the
#                      code-scanning service, not by a job name, and leaving the file where it is
#                      keeps that name out of the blast radius entirely.
#   branch-policy.yml — `pull_request`, but it is a source-namespace cancel that runs in seconds
#                      with no checkout and no compiler. Rooting it on the artifact lane would
#                      make the CHEAPEST and FASTEST refusal in the repo wait on the most
#                      expensive job, and it can never be affected by anything the root produces.
#   release.yml, tag-on-version-bump.yml, mirror-pr-to-org.yml, seed-linux-fork.yml — push /
#                      workflow_dispatch. Out of the ruling by its own terms.
#
# ── THE FIVE REQUIRED CHECKS ARE INVIOLABLE ───────────────────────────────────────────────────
#   CI gate · Test suite gate · Sanitizer gate
# They are the only required checks on `main`, and `main` has NO BYPASS — not even for the owner.
# A name that stops reporting does not go red; it goes PENDING FOREVER and jams the drain. So the
# five names survive this consolidation verbatim, and scripts/ci_gate_coverage.sh asserts their
# exact spelling on every run. Leaf check names are free and several changed.
#
# ── THE TOPOLOGY ──────────────────────────────────────────────────────────────────────────────
#   plan ──► artifact ──┬──► test ─────────────────────────────► Test suite gate
#     (the ROOT: seed,  ├──► cli-surface ──┐
#      ladder, dry      ├──► regressor-full├─► CI gate
#      build, one leg   ├──► ar-validation │
#      PER PUBLISHED    ├──► cross-arch-determinism
#      LABEL)           ├──► seed-debut ───┘
#                       └──► mem-paranoid ───────────────────► Sanitizer gate
#
# ── ONE PRODUCING LEG PER LABEL: THE FOUR LINUX SUBLANES ──────────────────────────────────────
# Owner order, 2026-07-27: *"espero ver 4 sublanes de execução, não duas, não três, não uma, para
# Linux"*. Each Linux label is its own leg and walks the WHOLE path alone — seed, ladder, dry
# build, its one asset. The ladder IS duplicated across the four, deliberately: *"Tem que
# duplicar, pois depois do teko.c, a escada não depende mais dele, e se fosse para não duplicar,
# estaríamos fazendo o primeiro degrau antes de todas as sublanes."*
#
# THE CLOCK THIS OPTIMISES IS DELIVERY, NOT MACHINE TIME — the owner is explicit: *"Não estou
# falando de relógio de máquina (cicle time), mas sim relógio de processo (o maior tempo de todos
# os tempos)"*. Hoisting the shared ladder into its own job that the four legs consume was BUILT
# AND REJECTED here: it is a BARRIER (nothing starts until the ladder ends, so delivery becomes
# ladder + upload + queue + download + asset, WORSE than a duplicated leg that starts at t=0) and
# it splits an asset's delivery time across two jobs, which kills the very thing being asked for:
# *"A questão é a percepção, delivery time, que não tem hoje ou pior, não é auditável /
# observável."* With one leg per label, a leg's own wall clock IS the delivery time of that asset,
# readable straight off the run page. See scripts/ci_producer_matrix.sh for the measured table.
#
# TSan, ASan+UBSan, ASan+UBSan+LSan and clang-tidy LEFT WITH THE C (2026-07-26). They instrumented
# or scanned the EMITTED C, and a backend that writes objects directly gives them nothing to read;
# `Heavy sanitizer gate (main)` and `SAST gate` went with them, removed from main's ruleset FIRST
# so no required name was ever left without a job. `mem-paranoid` stays and inherits
# `Sanitizer gate`: its oracle is the ARENA (poison-on-free, never reuse), not the language the
# runtime is written in — and it was never redundant with what left, because arena reuse is
# invisible to ASan.
#
# EVERY leaf `needs: [plan, artifact]`. EVERY aggregator `needs: artifact` too — see the ROOTED
# assertion in scripts/ci_gate_coverage.sh: an aggregator that does not stand on the root can
# report success while the lane every other lane consumes was never green, and (the light-tier
# case) can report success in a mode where all of its own legs legitimately skipped.
#
# ── NO LANE BUT THE ROOT BUILDS ───────────────────────────────────────────────────────────────
# Eleven jobs used to call scripts/build_with_seed_fallback.sh or scripts/ci_provision_teko.sh:
# build-test, gen1-checks, regressor-full, ar-elf-macho-coff-validation, seeds, release-cross-smoke,
# mem-paranoid, asan-default, tsan, windows-selfhost, seed-debut. After this wagon exactly ONE
# does, and scripts/ci_lane_purity.sh (run by `CI gate`) fails the build if a twelfth appears.
# Two of the eleven are GONE rather than converted:
#   * build-test        — it WAS "the seed builds the tip on this host", on the same five hosts
#                         the artifact producers now cover. The root does it, so the job is not
#                         moved, it is subsumed.
#   * windows-selfhost  — same, for windows-x86_64: `artifact / windows-x86_64` self-builds gen1
#                         on Windows natively and smokes the binary. Duplicate.
#   * seeds             — DEAD BEFORE THIS WAGON: it invoked scripts/cross_compile_seeds.sh,
#                         which does not exist in the tree. On any full run it would have failed
#                         at that step. It also cut its output with zig. Removed.
#   * release-cross-smoke — it existed to validate release.yml's zig cross-compile from PR CI.
#                         zig is dead and release.yml no longer builds at all, so there is
#                         nothing left to smoke. Its ONE unique assertion, the cross-architecture
#                         emitted-C determinism law, is preserved as `cross-arch-determinism`.
#
# ── LIGHT vs FULL ─────────────────────────────────────────────────────────────────────────────
# The criterion CHANGED this wagon and the reason is in scripts/ci_full_mode.sh. Short version:
# `full = (base_ref == main)` meant that on a STACKED TRAIN — where every wagon's base is the
# wagon below it — NO WAGON EVER RAN FULL, so every new lane debuted at the drain. Measured on
# PR #95: two of nine test lanes ran, and of the four lanes the owner had just ordered created,
# zero. The rule is now "can this change break this lane": base==main OR a change under
# .github/workflows/**, scripts/**, src/runtime/**, src/assert/**, src/backend/**, bootstrap/**,
# or teko.tkp. Every job below declares which tier it is on.
#
# TIER SUMMARY
#   BOTH  plan, artifact, test, cli-surface, tsan, asan-smoke, clang-tidy-audit, all five gates
#   FULL  regressor-full, ar-validation, cross-arch-determinism, seed-debut, asan-default,
#         mem-paranoid  (and the full tier widens `artifact`/`test`/`cli-surface`'s matrices)
#
# ── ZIG IS DEAD ───────────────────────────────────────────────────────────────────────────────
# Owner, 2026-07-26: "parar de cross compilar em zig, usar compilação nativa na esteira que irá
# gerar os artefatos", then "O zig deve morrer agora, imediatamente, sem espera". The four Linux
# assets are produced by scripts/native_linux_asset.sh with the TARGET's own toolchain, ON THE
# RUNNER, with NO CONTAINER of any kind — see that file for the per-label mapping and for what the
# glibc floor traded when the manylinux image went with it.
# ══════════════════════════════════════════════════════════════════════════════════════════════
on:
  pull_request:
    branches: ['**']   # '**' cruza '/' — casa base com barra (remodel/...); '*' simples nao
    # NO `paths:` FILTER, AND THAT IS THE POINT.
    #
    # The five aggregators are REQUIRED checks on `main`, and `main` has no bypass — not even for
    # the owner. A required check that never REPORTS does not go red; it stays "Expected — waiting
    # for status" forever, and the only PR pointing at `main` in a stacked train is the drain.
    # A trigger-level path filter is therefore not a cost optimisation, it is a way to freeze the
    # drain: a PR whose ENTIRE diff against the base falls outside the filter would silently
    # produce NO run at all — a pure-documentation PR, a memory-file update, a roadmap edit.
    #
    # THE UNIT IS THE PR, NOT THE COMMIT, and getting that backwards is easy: on a `pull_request`
    # event GitHub evaluates `paths:` against every file the PR changes relative to its base, not
    # against the head commit. So pushing a docs-only COMMIT onto a PR that also changes `src/**`
    # keeps matching and keeps running — measured live on this branch, where a `docs/memory/**`
    # commit still produced `run=true`. The hole is narrower than "any docs commit", and it is
    # still a hole: the endgame closes with a W15 wagon and a bump, and a wagon that turned out to
    # be documentation-only would freeze the one PR pointing at `main`.
    #
    # The four merged workflows each carried such a filter, and their union — `**.tks`, `**.c`,
    # `bootstrap/**`, … — reached no Markdown outside those trees. This file inherited the hole.
    #
    # The cost the filter used to buy is bought instead by `plan`, one level down: it computes
    # `run` (with a docs-only guard) and every lane INCLUDING the artifact root consults it. So a
    # docs-only PR costs one ~12s ubuntu job, the aggregators REPORT (green, having asserted that
    # everything below them was correctly skipped), and nothing hangs.

# ONE LIVE RUN PER PR. Without this, every push starts a full set — four producers plus six test
# legs — and the previous set keeps running to completion on a commit nobody will ever merge,
# burning parallel capacity to grade dead commits.
#
# Cancelling is safe here because a required check is evaluated on the PR's HEAD commit: a run
# cancelled by a newer push belongs to a superseded SHA, which no longer gates anything. The
# group is keyed on the PR ref so distinct PRs never cancel each other, and `github.workflow` is
# included so this file's runs never collide with another workflow's.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ══ plan ═══════════════════════════════════════════════════════════════════════════════════
  # TIER: both. The mode, the path filters, and every matrix, emitted once for the whole file.
  #
  # THREE FILTERS, down from the four workflows' three-plus-one:
  #   run       the compiler-lane allowlist (was native.yml's `changes`). sanitizers.yml's own
  #             filter was a near-subset (it added .github/lsan-suppressions.txt and dropped
  #             examples/** + bootstrap/**) and is FOLDED IN here: the difference bought nothing
  #             but a second list to keep in sync, and erring toward running the sanitizer lanes
  #             is the safe direction.
  #   full      the light/full axis (see scripts/ci_full_mode.sh for the rule and its history).
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      full: ${{ steps.decide.outputs.full }}
      run: ${{ steps.decide.outputs.run }}
      labels: ${{ steps.decide.outputs.labels }}
      matrix_artifact: ${{ steps.decide.outputs.matrix_artifact }}
      matrix_test: ${{ steps.decide.outputs.matrix_test }}
      matrix_cli: ${{ steps.decide.outputs.matrix_cli }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          list-files: shell
          filters: |
            run:
              - 'src/**'
              - 'tests/**'
              - 'examples/**'
              - 'scripts/**'
              - 'bootstrap/**'
              - '.github/lsan-suppressions.txt'
              - '.github/ci-lane-exceptions.txt'
              - '.github/workflows/pr.yml'
            full:
              - '.github/workflows/**'
              - 'scripts/**'
              - 'src/runtime/**'
              - 'src/assert/**'
              - 'src/backend/**'
              - 'bootstrap/**'
              - 'teko.tkp'

      - name: Decide (mode, allowlists, matrices)
        id: decide
        shell: bash
        env:
          MATCHED: ${{ steps.filter.outputs.run }}
          FILES: ${{ steps.filter.outputs.run_files }}
          SAST_MATCHED: ${{ steps.filter.outputs.sast }}
          FULL_MATCHED: ${{ steps.filter.outputs.full }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -eu

          # ── THE MODE ────────────────────────────────────────────────────────────────────────
          # base_ref == main is KEPT (the landing wagon pays the full gate whatever it touched),
          # but it is no longer the ONLY trigger — see the header and scripts/ci_full_mode.sh.
          # The gates re-derive this INDEPENDENTLY (over the PR's file list, not with dorny) and
          # fail on disagreement, which is what makes a `skipped` leg trustworthy.
          full=false
          reason=""
          if [ "$BASE_REF" = "main" ]; then full=true; reason="base_ref=main"; fi
          if [ "$FULL_MATCHED" = "true" ]; then
            full=true
            reason="${reason:+$reason, }a full-triggering path changed (workflows/scripts/runtime/assert/backend/seeds/manifest)"
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "mode: $([ "$full" = "true" ] && echo full || echo light) (base_ref='$BASE_REF'; ${reason:-no full trigger})"

          # ── SAST allowlist ──────────────────────────────────────────────────────────────────

          # ── the compiler-lane allowlist + the docs-only guard ───────────────────────────────
          # The allowlist globs also match Markdown living INSIDE those trees, so a pure-doc edit
          # would otherwise trigger the whole heavy gate. Skip only when EVERY matched file is
          # *.md — any single non-Markdown match still forces the run, so this can under-skip but
          # never over-skip. A trigger-level `paths-ignore` is deliberately NOT used: the five
          # aggregators are REQUIRED checks, and skipping the workflow would leave them never
          # reported → the PR hangs "waiting for CI gate" forever.
          #
          # `artifact` and `test` DO consult this flag, since the trigger no longer filters paths
          # (see the `on:` block for why it must not). That does not reopen the "everything
          # skipped, pass anyway" hole the earlier design feared: the five aggregators do not
          # tolerate the skip, they REQUIRE it — `run=false` demands `skipped` and `run=true`
          # demands `success`, so a broken `if:` is caught in either direction.
          run=false
          if [ "$MATCHED" != "true" ]; then
            echo "No allowlisted path changed — the compiler-diagnostic lanes have nothing to gate."
          else
            for f in $FILES; do
              case "$f" in
                *.md) ;;
                *)    run=true ;;
              esac
            done
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "run=$run (compiler-diagnostic lanes)"

          # ── PRODUCER LEGS ───────────────────────────────────────────────────────────────────
          # THE LEG TABLE IS NOT HERE. It is scripts/ci_producer_matrix.sh, because `nightly.yml`
          # runs the SAME producers to mint the build the release promotes, and a leg added to one
          # workflow and forgotten in the other is a nightly that publishes six assets or a PR
          # that gates six and ships seven — failures that surface at the release. See that
          # script for what each field means.
          #
          # ── TEST LEGS ───────────────────────────────────────────────────────────────────────
          # `os` is the runner that EXECUTES the asset, which need not be the runner that minted
          # it. `timeout` is a GATE-ONLY budget — the build left this layer.
          # `producer` NAMES THE UPLOAD THIS LEG DOWNLOADS. With one producing leg per published
          # label (the four Linux sublanes), a Linux label's producer IS that label — the two
          # columns are equal here, and stay separate fields only because they are NOT equal for
          # a `native` producer, which mints under its own host name.
          T_XG='{"label":"linux-x86_64-glibc","producer":"linux-x86_64-glibc","os":"ubuntu-latest","timeout":45}'
          T_XM='{"label":"linux-x86_64-musl","producer":"linux-x86_64-musl","os":"ubuntu-latest","timeout":45}'
          T_AG='{"label":"linux-arm64-glibc","producer":"linux-arm64-glibc","os":"ubuntu-24.04-arm","timeout":45}'
          T_AM='{"label":"linux-arm64-musl","producer":"linux-arm64-musl","os":"ubuntu-24.04-arm","timeout":45}'
          T_MAC='{"label":"macos-arm64","producer":"macos-arm64","os":"macos-latest","timeout":45}'
          T_WX='{"label":"windows-x86_64","producer":"windows-x86_64","os":"windows-latest","timeout":60}'

          C_X='{"label":"linux-x86_64-glibc","producer":"linux-x86_64-glibc","os":"ubuntu-latest"}'
          C_MAC='{"label":"macos-arm64","producer":"macos-arm64","os":"macos-latest"}'

          if [ "$full" = "true" ]; then
            # SLOWEST FIRST in every matrix: GitHub starts legs in declaration order, so the
            # slowest legs must not queue behind cheap ones. (The producer matrix carries that
            # order inside the shared table.)
            echo "matrix_artifact=$(sh scripts/ci_producer_matrix.sh full)" >> "$GITHUB_OUTPUT"
            echo "matrix_test={\"include\":[$T_WX,$T_XG,$T_XM,$T_AG,$T_AM,$T_MAC]}" >> "$GITHUB_OUTPUT"
            echo "matrix_cli={\"include\":[$C_X,$C_MAC]}" >> "$GITHUB_OUTPUT"
            echo "labels=linux-arm64-glibc linux-arm64-musl linux-x86_64-glibc linux-x86_64-musl macos-arm64 windows-x86_64" >> "$GITHUB_OUTPUT"
          else
            echo "matrix_artifact=$(sh scripts/ci_producer_matrix.sh light)" >> "$GITHUB_OUTPUT"
            echo "matrix_test={\"include\":[$T_WX,$T_XG]}" >> "$GITHUB_OUTPUT"
            echo "matrix_cli={\"include\":[$C_X]}" >> "$GITHUB_OUTPUT"
            echo "labels=linux-x86_64-glibc windows-x86_64" >> "$GITHUB_OUTPUT"
          fi

  # ══ artifact — THE ROOT ════════════════════════════════════════════════════════════════════
  # TIER: both (the matrix widens on full).
  #
  # Owner: "a lane de artefatos deve executar build seco `teko build . --no-verify --release` e
  # ela deve ter a inteligência sobre o que deve gerar (a escada)."
  #
  # THE INTELLIGENCE IS TWO THINGS, and both live here and nowhere else:
  #   1. WHAT TO GENERATE — `produces`, which is why the light path mints ONE Linux asset instead
  #      of six rather than building six and discarding five.
  #   2. THE LADDER — scripts/build_with_seed_fallback.sh: the newest RELEASED seed builds the tip
  #      directly (fast path); else the COMMITTED seed in bootstrap/seeds/ (rung 0); else the
  #      pinned SHA ladder.
  #
  # `--no-verify --release`: DRY, no test gate. The gate is the `test` layer's whole job and
  # running it here would put the cost straight back into the critical path the ruling removed.
  # `--release` because every published asset is an -O2 link, so an asset built without it would
  # not be the asset.
  artifact:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix_artifact) }}
    name: artifact / ${{ matrix.producer }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Named BEFORE the first step that can fail on a missing tool, so a red run on a host whose
      # image no lane has exercised says WHICH toolchain was present instead of leaving the reader
      # to infer it from a cc error deep inside a build log. `unzip`/`tar` because
      # ci_provision_teko.sh needs one of them to open the release asset, `xz`/`python3`/`7z`
      # because they are the decompressor chain the committed-seed rung walks, `cc` because it is
      # what the glibc Linux asset is now built with (NO CONTAINER — owner order 2026-07-27),
      # `musl-gcc` because it is what the musl Linux asset is built with (see the install step
      # just below — it is not on the image by default, this line only reports whether it is
      # already there), and `file` because native_linux_asset.sh asserts each asset's
      # architecture with it.
      - name: Report the host toolchain (diagnostic — never fails the job)
        shell: bash
        run: |
          for t in cc clang gcc file xz unzip tar curl python3 7z musl-gcc; do
            printf '%-8s ' "$t"
            command -v "$t" || echo '(absent)'
          done

      # musl-tools INSTALLS ON BOTH LINUX RUNNERS — measured green on `ubuntu-24.04-arm` across
      # three separate runs on 2026-07-27, so this is a CONFIRMED FACT and no longer the assertion
      # an earlier revision of this comment called it. It stays a WORKFLOW STEP rather than logic
      # buried inside a script so a regression goes red HERE with a legible "Unable to locate
      # package" from apt instead of failing deep inside a build log. THERE IS NO CONTAINER TO
      # FALL BACK TO AND NONE IS COMING BACK: a red step here is the fail-loud, and the fix is to
      # fix the toolchain, never to route a label back to Alpine.
      #
      # Gated on the LABEL, not on `kind`: with one leg per published label the glibc legs never
      # touch musl-gcc, so making them wait ~15s for a package they do not use would be delivery
      # time spent on nothing.
      - name: Install musl-tools (the musl asset's native, non-container toolchain)
        if: endsWith(matrix.producer, '-musl')
        shell: bash
        run: |
          set -eu
          sudo apt-get update -y
          sudo apt-get install -y musl-tools
          musl-gcc --version

      # ── THE SHARED PRODUCTION PATH ──────────────────────────────────────────────────────────
      # Provision the host-runnable seed, walk the ladder, run the DRY build
      # (`--no-verify --release`), build each Linux asset with its target's own native toolchain,
      # and stage `stage/<label>/teko[.exe]`. All of it is scripts/produce_assets.sh, and
      # `nightly.yml` makes the IDENTICAL call — one production path, not two. That script is also
      # the reason `seed` is a matrix field rather than a derivation: the label a leg PRODUCES is
      # not always the label whose binary RUNS on its runner, and a derivation the caller can get
      # wrong is a derivation that silently picks the wrong blob.
      #
      # `$PRODUCES` is unquoted deliberately: word-splitting is what turns the contract string into
      # one argument per asset label.
      - name: Produce this leg's assets (seed → ladder → dry build → native assets → stage)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ matrix.kind }}
          SEED: ${{ matrix.seed }}
          PRODUCES: ${{ matrix.produces }}
        run: sh scripts/produce_assets.sh "$KIND" "$SEED" $PRODUCES

      # ── THE SELF-HOSTING FIXPOINT, IN EVERY SUBLANE ────────────────────────────────────────
      # Owner ruling 2026-07-27: *"pode colocar o fixpoint logo após as compilações nos ambientes
      # (direto em cada sublane)"*. So it sits HERE — right after the leg compiled, on the leg's
      # own runner, against the leg's own toolchain — and not in a shared job downstream. Six
      # environments, six independent verdicts: a fixpoint that holds on x86_64 and breaks under
      # musl is exactly the kind of divergence a single shared check would average away.
      #
      # WHAT IT ASSERTS: gen2 == gen3 byte for byte over the SAME source, plus zero emitted C.
      # gen1 is not compared — it comes from a DIFFERENT compiler (today the versioned
      # `bootstrap/teko.c` from wagon 15), so gen1 != gen2 is the healthy, expected shape.
      #
      # WHY `TEKO_FIXPOINT_SOFT=1` TODAY, and this is a dated, removable concession rather than a
      # policy: the native backend cannot yet build the compiler at all — it honest-stops with
      # `fat-pointer receiver \`call\` not yet lowered (N2)` — so gen2 does not exist and the gate
      # fails for a cause already reported by every test lane. Failing HARD here would make this
      # job red, and `needs: artifact` would turn every downstream lane into a SKIP, deleting the
      # signal from the very lanes being used to close that gap. The soft flag suppresses the exit
      # status and NOTHING ELSE: the verdict is printed in full on every run, so the gate is
      # observable from the day it lands rather than from the day it can pass.
      #
      # HOW IT BECOMES REAL: delete the `TEKO_FIXPOINT_SOFT` line. One line, no other change. Do it
      # the moment the N2 degrau closes and gen1 self-hosts — that is the same event as the owner's
      # own stopping criterion, *"um teko.c que não gera outro teko.c"*.
      - name: Fixpoint — gen2 == gen3 over the same source, and no emitted C
        shell: bash
        env:
          TEKO_FIXPOINT_SOFT: '1'
        run: sh scripts/fixpoint_gate.sh out/teko . .fixpoint

      # RETENTION IS 7 DAYS, NOT 1, AND IT IS A DEPENDENCY NOW. `nightly.yml` reaches BACK into
      # this run — resolved through scripts/originating_pr_run.sh, never guessed — and asserts that
      # what this PR published is byte-identical to what the merged commit rebuilds. A 1-day
      # retention silently disabled that gate for any PR that sat more than a day between its last
      # green run and its merge, which on a stacked train is most of them. Storage for Actions
      # artifacts on a public repository is free; a gate that quietly stops gating is not.
      - name: Upload the assets
        uses: actions/upload-artifact@v4
        with:
          name: teko-assets-${{ matrix.producer }}
          path: stage
          if-no-files-found: error
          retention-days: 7

  # ══ test — DOWNLOAD AND RUN. NO BUILD. ═════════════════════════════════════════════════════
  # TIER: both (two assets on light, all nine on full).
  #
  # `needs: [plan, artifact]` — one name for the whole producer layer, because `needs:` cannot
  # reference a MATRIX LEG. The consequence is bounded and stated: a test leg starts when the
  # SLOWEST producer finishes, and pays NOTHING for the wait (a queued leg spends zero runner
  # minutes and zero of its own timeout budget; a leg that BUILDS spends both).
  #
  # A C TOOLCHAIN IS STILL REQUIRED HERE, and that is not a build sneaking back in: `teko test .`
  # IS a native gate — it emits the #test corpus as C, compiles it and runs it out-of-process
  # (#168). The compiler under test is the downloaded asset; `cc` is the suite's engine.
  test:
    needs: [plan, artifact]
    if: needs.plan.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix_test) }}
    name: test / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
    steps:
      # The corpus under test. The asset arrives by download; the SOURCE it compiles is this PR's.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report the host toolchain (diagnostic — never fails the job)
        shell: bash
        run: |
          for t in cc clang gcc file python3; do
            printf '%-8s ' "$t"
            command -v "$t" || echo '(absent)'
          done

      - name: Download this lane's published asset
        uses: actions/download-artifact@v4
        with:
          name: teko-assets-${{ matrix.producer }}
          path: dl

      # `actions/upload-artifact` does NOT preserve the executable bit, so restoring it is
      # MANDATORY, not hygiene — without it every POSIX lane dies at "permission denied" and the
      # cause sits three steps from the symptom. `--version` is the diagnostic that names the
      # binary under test BEFORE the suite.
      - name: Restore the executable bit and name the asset under test
        if: runner.os != 'Windows'
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
        run: |
          set -eu
          art="dl/$LABEL/teko"
          if [ ! -f "$art" ]; then
            echo "ERROR: the producer's upload has no $art" >&2
            ls -lR dl >&2
            exit 1
          fi
          chmod +x "$art"
          file "$art" || true
          "$art" --version

      # ── the suite, run BY the asset. THE ONLY WORK THIS LAYER DOES. ─────────────────────────
      # TWO steps, and the split is not cosmetic: Windows is not a different path but a different
      # SHELL with an explicit `$LASTEXITCODE` propagation. EXACTLY ONE runs on any given leg, and
      # the guard below PROVES it.
      - name: Asset self-test — POSIX lanes (the published asset runs its own gate)
        if: runner.os != 'Windows'
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
        run: |
          set -eu
          art="dl/$LABEL/teko"
          "$art" test .
          : > .lane-ran

      - name: Asset self-test — Windows lanes (the published asset runs its own gate)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LABEL: ${{ matrix.label }}
        run: |
          $art = "dl/$env:LABEL/teko.exe"
          if (-not (Test-Path -LiteralPath $art)) {
            Get-ChildItem -Recurse dl | Out-String | Write-Host
            throw "the producer's upload has no $art"
          }
          & $art --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $art test .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType File -Force .lane-ran | Out-Null

      # J3 AT THE LEG LEVEL. The two steps above are each guarded by an `if:`, so an asset whose
      # label matched no predicate would SKIP both and the leg would go green having executed no
      # suite at all — and a green leg is exactly what the aggregate `success` the gate trusts is
      # made of. The marker file is written by whichever self-test step ran, so its absence PROVES
      # none did.
      - name: Guard — the asset self-test must actually have run
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
        run: |
          set -eu
          if [ ! -f .lane-ran ]; then
            echo "ERROR: no self-test step claimed asset '$LABEL' — this leg would have reported" >&2
            echo "success without running 'teko test .' at all. Add the label to one of the two" >&2
            echo "self-test steps' conditions." >&2
            exit 1
          fi
          echo "asset '$LABEL' — the self-test ran"

  # ══ cli-surface ════════════════════════════════════════════════════════════════════════════
  # TIER: both (linux-x86_64-glibc on light; + macos-arm64 on full).
  # WAS `gen1-checks`, which built gen1 from a seed before running any of these. It now validates
  # the PUBLISHED ASSET, which is strictly better: these harnesses assert the CLI contract users
  # actually get, and the binary they now run is byte-for-byte the one the release would ship.
  # The version assertion in cli_flags_test.sh is why scripts/native_linux_asset.sh passes
  # -DTEKO_VERSION_STRING — an asset that reported 0.0.0.0-dev would fail here, loudly.
  cli-surface:
    needs: [plan, artifact]
    if: needs.plan.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix_cli) }}
    name: cli surface / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The own==C differential and the region-drop unit test compile C with the host cc, so cc is
      # still needed. macOS ships clang with the Xcode CLT, so only Linux needs an install.
      - name: Install cc (Linux only — macOS ships clang)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang

      - name: Download the published asset
        uses: actions/download-artifact@v4
        with:
          name: teko-assets-${{ matrix.producer }}
          path: dl

      - name: Restore the executable bit
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
        run: |
          set -eu
          chmod +x "dl/$LABEL/teko"
          "dl/$LABEL/teko" --version

      - name: CLI flags (identical version string)
        shell: bash
        run: ./scripts/cli_flags_test.sh "./dl/${{ matrix.label }}/teko"

      - name: fmt CLI (--check + stdin mode) (issue #229)
        shell: bash
        run: ./scripts/fmt_cli_test.sh "./dl/${{ matrix.label }}/teko"

      - name: tk_region_drop_subtree unit test (issue #337 — the adopt bulk-drop primitive)
        shell: bash
        run: ./scripts/region_drop_subtree_test.sh

      # ── R1 host-target default (owner ruling 2026-07-24) ────────────────────────────────────
      # regressor.tkr's F5 backend Examples always pin TEKO_TARGET explicitly, so they never
      # exercise native_target()'s host-derived default. This step deliberately leaves TEKO_TARGET
      # unset and asserts the own AOT backend still emits THIS host's own object format (the
      # reproduced bug: an unset TEKO_TARGET used to hardcode arm64 Mach-O on every host).
      - name: R1 host-target default (TEKO_TARGET unset)
        shell: bash
        env:
          TEKO: ./dl/${{ matrix.label }}/teko
        run: ./scripts/target_host_default_test.sh

  # ══ regressor-full ═════════════════════════════════════════════════════════════════════════
  # TIER: full only. It no longer builds anything.
  #
  # This is the ONE lane that runs the regression executor with REGRESSION_REQUIRE_TOOLS=1, and
  # that flag IS the point: without it a lane whose provisioning broke would honest-SKIP the
  # wasm rows and report green — worse than having no lane at all, because it LOOKS like
  # coverage. With it, an absent wasmtime is a hard failure.
  #
  # …and BECAUSE the flag is fail-closed for EVERY capability the corpus declares, this is the one
  # lane that must provision ALL of them: the host binutils that scripts/check_elf.sh needs, and
  # wasmtime for F7's `Given target = "wasm32-wasi"` scenario.
  # That is why the flag lives HERE and not on the `test` legs: a lane that cannot run part of the
  # corpus cannot honestly demand that none of it be skipped.
  regressor-full:
    needs: [plan, artifact]
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.full == 'true'
    name: regressor / all capabilities (wasm, fail-closed)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      WASMTIME_VERSION: "v39.0.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the host clang the corpus links with
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang

      - name: Install wasmtime (the F7 wasm32-wasi scenario's executor)
        run: |
          set -eu
          curl -fsSL "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/wasmtime-${WASMTIME_VERSION}-x86_64-linux.tar.xz" | tar -xJ
          echo "$PWD/wasmtime-${WASMTIME_VERSION}-x86_64-linux" >> "$GITHUB_PATH"

      - name: Verify wasmtime is on PATH (fail loud before the fail-closed run)
        run: wasmtime --version

      - name: Download the published x86_64 asset
        uses: actions/download-artifact@v4
        with:
          name: teko-assets-linux-x86_64-glibc
          path: dl

      - name: Restore the executable bit
        run: |
          set -eu
          chmod +x dl/linux-x86_64-glibc/teko
          dl/linux-x86_64-glibc/teko --version

      - name: The single regression executor, fail-closed on every declared capability
        shell: bash
        env:
          REGRESSION_REQUIRE_TOOLS: "1"
        run: ./dl/linux-x86_64-glibc/teko test .

  # ══ ar-validation ══════════════════════════════════════════════════════════════════════════
  # TIER: full only — three OS runners for the archive-container lanes is landing-wagon cost.
  # Proves the own-native static-archive writer's three containers (GNU/ELF, BSD Mach-O
  # `__.SYMDEF SORTED`, MS two-linker-member COFF `.lib`) against a REAL host toolchain, then
  # links + RUNS a C consumer against the archive — the PRIMARY consumibility criterion
  # (`add(40, 2)` must exit 42). `AR_CHECK_REQUIRE_TOOLS=1` so an honest-skip here is a hard
  # failure: the toolchains are guaranteed present on these runners.
  ar-validation:
    needs: [plan, artifact]
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64-glibc
            producer: linux-x86_64-glibc
            format: elf
          - os: macos-latest
            label: macos-arm64
            producer: macos-arm64
            format: macho
          - os: windows-latest
            label: windows-x86_64
            producer: windows-x86_64
            format: coff
    name: ar validation / ${{ matrix.label }} (${{ matrix.format }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the published asset
        uses: actions/download-artifact@v4
        with:
          name: teko-assets-${{ matrix.producer }}
          path: dl

      - name: Restore the executable bit (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          chmod +x "dl/${{ matrix.label }}/teko"
          "dl/${{ matrix.label }}/teko" --version

      - name: Build the static-lib fixture (own-native, host-default target)
        shell: bash
        env:
          TEKO_BACKEND: native
          LABEL: ${{ matrix.label }}
        run: |
          set -eu
          teko="$PWD/dl/$LABEL/teko"
          [ -f "$teko" ] || teko="$PWD/dl/$LABEL/teko.exe"
          cd examples/toolchain/ar_link_run
          "$teko" build . -o bin --no-verify --release
          ls -la bin

      - name: Host-toolchain well-formedness gate (ar/nm/ld — ELF/GNU)
        if: matrix.format == 'elf'
        shell: bash
        env:
          AR_CHECK_REQUIRE_TOOLS: "1"
        run: ./scripts/check_ar_elf.sh examples/toolchain/ar_link_run/bin/libar_link_run.a ar_link_run__add

      - name: Host-toolchain well-formedness gate (ar/nm/ld64 — Mach-O)
        if: matrix.format == 'macho'
        shell: bash
        env:
          AR_CHECK_REQUIRE_TOOLS: "1"
        run: ./scripts/check_ar_macho.sh examples/toolchain/ar_link_run/bin/libar_link_run.a ar_link_run__add

      - name: Host-toolchain well-formedness gate (llvm-lib/lib.exe + dumpbin — COFF)
        if: matrix.format == 'coff'
        shell: bash
        env:
          AR_CHECK_REQUIRE_TOOLS: "1"
        run: ./scripts/check_ar_coff.sh examples/toolchain/ar_link_run/bin/ar_link_run.lib ar_link_run__add

      - name: Link + run the consumer against the ELF/GNU archive (expect exit 42)
        if: matrix.format == 'elf'
        shell: bash
        run: |
          set -eu
          cc -c scripts/ar_link_run_consumer.c -o /tmp/ar_link_run_consumer.o
          cc /tmp/ar_link_run_consumer.o examples/toolchain/ar_link_run/bin/libar_link_run.a -o /tmp/ar_link_run_consumer_bin
          set +e
          /tmp/ar_link_run_consumer_bin
          rc=$?
          set -e
          echo "consumer exit code: $rc"
          [ "$rc" -eq 42 ] || { echo "FAIL — expected exit 42, got $rc"; exit 1; }

      - name: Link + run the consumer against the Mach-O archive (expect exit 42)
        if: matrix.format == 'macho'
        shell: bash
        run: |
          set -eu
          clang -c scripts/ar_link_run_consumer.c -o /tmp/ar_link_run_consumer.o
          clang /tmp/ar_link_run_consumer.o examples/toolchain/ar_link_run/bin/libar_link_run.a -o /tmp/ar_link_run_consumer_bin
          set +e
          /tmp/ar_link_run_consumer_bin
          rc=$?
          set -e
          echo "consumer exit code: $rc"
          [ "$rc" -eq 42 ] || { echo "FAIL — expected exit 42, got $rc"; exit 1; }

      # lld-link (the same tool + MSYS path-conversion guard scripts/check_coff.sh already uses)
      # links + RUNS the consumer natively.
      - name: Link + run the consumer against the COFF archive (expect exit 42)
        if: matrix.format == 'coff'
        shell: bash
        run: |
          set -eu
          clang -c scripts/ar_link_run_consumer.c -o ar_link_run_consumer.o
          obj_arg=ar_link_run_consumer.o
          lib_arg="examples/toolchain/ar_link_run/bin/ar_link_run.lib"
          out_arg=ar_link_run_consumer.exe
          if command -v cygpath >/dev/null 2>&1; then
            obj_arg="$(cygpath -w ar_link_run_consumer.o)"
            lib_arg="$(cygpath -w examples/toolchain/ar_link_run/bin/ar_link_run.lib)"
            out_arg="$(cygpath -w ar_link_run_consumer.exe)"
          fi
          MSYS_NO_PATHCONV=1 MSYS2_ARG_CONV_EXCL='*' lld-link /nologo "/out:$out_arg" /entry:main /subsystem:console "$obj_arg" "$lib_arg"
          set +e
          ./ar_link_run_consumer.exe
          rc=$?
          set -e
          echo "consumer exit code: $rc"
          [ "$rc" -eq 42 ] || { echo "FAIL — expected exit 42, got $rc"; exit 1; }

  # ══ cross-arch-determinism ═════════════════════════════════════════════════════════════════
  # TIER: full only.
  #
  # THE ONE THING `release-cross-smoke` PROVED THAT NOTHING ELSE DOES: the six Linux artifacts
  # must emit BYTE-IDENTICAL output for the same project. Determinism is already a law WITHIN one
  # architecture (the gen2 == gen3 fixpoint); this extends it ACROSS architectures, where a
  # pointer-width, endianness or hash-order leak into the emitter is invisible to the
  # within-architecture fixpoint and shows up here as a diverging sha256 and nowhere else.
  #
  # ── THE SUBJECT CHANGED WITH THE BACKEND, THE ORACLE DID NOT (2026-07-27) ────────────────────
  # This lane used to hash the emitted `uniontest.c`. Native is now the only backend, so no `.c`
  # is written and the old assertion has no subject. Deleting the lane was the wrong call: the
  # leak class it catches — the HOST's word size / endianness / hash order bleeding into what the
  # compiler EMITS — has no other oracle in the project, and it got MORE dangerous with the native
  # backend, not less, because the emitter now writes machine code and relocations by hand instead
  # of delegating to a C compiler.
  #
  # So the subject moves from the emitted C to the emitted OBJECT, and the assertion gets stronger:
  # the object is what actually ships.
  #
  # THE TARGET MUST BE PINNED, and this is the part that is easy to get wrong. Emitted C was
  # target-independent (the `cc` did the targeting); an OBJECT is not. Left to the host-aware
  # default, the four assets would each emit for their OWN architecture and differ for a completely
  # legitimate reason — a green-looking lane asserting nothing, or a red one blaming the wrong
  # thing. Pinning `--target` to one value makes the HOST the only variable, which is precisely the
  # leak this lane exists to catch.
  #
  # It is a pure CONSUMER: it downloads the four published assets and runs them. The x86_64 pair
  # runs natively; the arm64 pair runs under qemu-user with `-L <sysroot>` so the dynamic glibc
  # artifact finds its loader (measured, not assumed: without `-L` a dynamic aarch64
  # artifact dies at "Could not open '/lib/ld-linux-*.so.*'").
  #
  # EXPECTED RED UNTIL THE LADDER REACHES IT: `uniontest` currently stops at the honest
  # `native backend N1: field/index access on a non-struct receiver not yet lowered (N2)`. That is
  # the ladder working — the lane turns green when that rung closes, and until then it is naming a
  # real gap instead of hiding one.
  cross-arch-determinism:
    needs: [plan, artifact]
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.full == 'true'
    name: cross-arch determinism (four Linux assets emit an identical object)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # qemu-user-static executes the non-native artifacts; libc6-arm64-cross carries
      # ONLY the target loader + shared libc the glibc artifact needs at runtime — no
      # compiler.
      - name: Install qemu-user-static + the arm64 loader
        run: |
          sudo apt-get update -y
          sudo apt-get install -y qemu-user-static libc6-arm64-cross

      # Every Linux producer's upload, merged into one tree. Labels are unique across producers,
      # so `merge-multiple` cannot collide and the result is exactly `dl/<label>/teko`.
      - name: Download every Linux asset
        uses: actions/download-artifact@v4
        with:
          pattern: teko-assets-linux-*
          merge-multiple: true
          path: dl

      - name: Run all four assets + assert an identical emitted object
        shell: bash
        run: |
          set -eu
          # The target every asset emits FOR. Pinned on purpose — see the job comment: leaving it
          # to the host-aware default makes the four outputs differ legitimately and the lane stops
          # measuring anything.
          PINNED_TARGET="x86_64-linux"
          # run_art LABEL ARGS… — invoke dl/LABEL/teko, natively or under the right emulator. The
          # `-L` sysroot is required by the glibc (dynamic) artifact and harmless for the
          # static musl one, so the shape is uniform.
          run_art() {
            label="$1"; shift
            case "$label" in
              *-x86_64-*)  "./dl/$label/teko" "$@" ;;
              *-arm64-*)   qemu-aarch64-static -L /usr/aarch64-linux-gnu "./dl/$label/teko" "$@" ;;
              *) echo "run_art: unknown label '$label'" >&2; return 1 ;;
            esac
          }
          REF_SHA=""
          for label in linux-x86_64-glibc linux-x86_64-musl \
                       linux-arm64-glibc linux-arm64-musl; do
            echo "=== $label ==="
            chmod +x "./dl/$label/teko"
            file "./dl/$label/teko"
            run_art "$label" --version
            out="/tmp/xemit-$label"
            rm -rf "$out"
            run_art "$label" build examples/smoke/uniontest -o "$out" \
                    --target="$PINNED_TARGET" --no-verify --release
            # Located, not assumed: the object's on-disk name comes from the project stem and the
            # output layout, and a hard-coded path that silently stops matching would turn this
            # lane into a `sha256sum` error instead of the determinism verdict it owes.
            obj="$(find "$out" -name '*.o' -type f | sort | head -n1)"
            if [ -z "$obj" ]; then
              echo "FAIL — $label emitted no object under $out" >&2
              echo "contents:" >&2
              find "$out" -type f | sed 's/^/  /' >&2
              exit 1
            fi
            sha="$(sha256sum "$obj" | awk '{print $1}')"
            echo "$label emitted $(basename "$obj") for $PINNED_TARGET, sha256 $sha"
            if [ -z "$REF_SHA" ]; then
              REF_SHA="$sha"
            elif [ "$sha" != "$REF_SHA" ]; then
              echo "FAIL — $label emitted a DIFFERENT object than the first artifact ($sha != $REF_SHA)" >&2
              echo "every asset emitted for the SAME pinned target ($PINNED_TARGET), so the only" >&2
              echo "variable is the architecture the compiler RAN on — a pointer-width," >&2
              echo "endianness or hash-order leak into the emitter is the thing this catches" >&2
              exit 1
            fi
          done
          echo "all four artifacts ran and emitted a byte-identical object for $PINNED_TARGET ($REF_SHA)"

  # ══ seed-debut ═════════════════════════════════════════════════════════════════════════════
  # TIER: full only.
  #
  # THE ONE LANE OUTSIDE THE ROOT THAT MAY NAME scripts/ci_provision_teko.sh, declared in
  # .github/ci-lane-exceptions.txt with its reason: the provisioning path IS the subject under
  # test. Every other lane wants "a working teko on this host" and the root can hand it one; this
  # lane wants the answer to "does the committed blob still provision and still build the tip, on
  # this host", which no download can answer.
  #
  # PROVENANCE (owner ruling 2026-07-26): the committed blobs are NOT produced by an agent
  # locally — they are extracted from the ARTIFACTS OF A GREEN CI RUN at bump time and only then
  # versioned. The wrongly-provenanced blobs were REMOVED, so `bootstrap/seeds/` does not exist in
  # the tree today. This lane reports that absence honestly and exits 0: an absent transitional
  # blob is not a failure. On the bump wagon's own run the directory exists, the probe does not
  # trip, and this is where the seeds debut and must pass.
  #
  # WHY IT BUILDS RATHER THAN JUST SMOKING `--version`: a seed's whole job is to compile the tip.
  # `--version` proves the binary loads on the host, which is necessary and nowhere near
  # sufficient — a seed that loads and then cannot build is a seed that fails at the moment it is
  # needed, on the run that needed it.
  seed-debut:
    needs: [plan, artifact]
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: ubuntu-24.04-arm
            label: linux-arm64
          - os: macos-latest
            label: macos-arm64
          - os: windows-latest
            label: windows-x86_64
    name: seed debut / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # THE HONEST-ABSENCE PROBE. It gates every step below, so while the blobs are out of the
      # tree this lane costs a checkout and reports why it did nothing — rather than failing on a
      # missing manifest and teaching everyone to ignore a red lane.
      - name: Is there a committed seed to debut?
        id: probe
        shell: bash
        run: |
          set -eu
          if [ -f bootstrap/seeds/SEEDS.sha256 ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "bootstrap/seeds/SEEDS.sha256 is present — the committed seed debuts on this host."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "bootstrap/seeds/ is ABSENT — there is no committed seed to debut."
            echo "This is the expected state until the bump wagon extracts the blobs from a green"
            echo "CI run's artifacts (owner ruling 2026-07-26 on provenance). Reporting the"
            echo "absence and passing: an absent transitional blob is not a failure."
          fi

      - name: Report the host toolchain (diagnostic — never fails the job)
        if: steps.probe.outputs.present == 'true'
        shell: bash
        run: |
          for t in cc clang gcc xz python3 7z; do
            printf '%-8s ' "$t"
            command -v "$t" || echo '(absent)'
          done

      - name: Install cc (Linux only — macOS and the Windows images ship clang)
        if: steps.probe.outputs.present == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang

      - name: Provision the COMMITTED seed (sha256-verified before decompression)
        if: steps.probe.outputs.present == 'true'
        shell: bash
        env:
          TEKO_SEED_PREFER_COMMITTED: "1"
          LABEL: ${{ matrix.label }}
        run: ./scripts/ci_provision_teko.sh "$LABEL"

      # The committed seed compiles THIS tip. No fallback ladder here on purpose: the ladder
      # exists to bridge a released seed to a newer tip, and this seed was cut FROM the tip — if
      # it cannot build it directly, the committed blob is wrong and that is exactly the finding.
      - name: Build the tip with the committed seed
        if: steps.probe.outputs.present == 'true'
        shell: bash
        run: teko . -o out --no-verify --release

  # ══ tsan ═══════════════════════════════════════════════════════════════════════════════════
  # TIER: both — PROMOTED to the light tier by this wagon, and the promotion is a consequence,
  # not a preference. This lane's 90-minute budget existed because it walked the seed ladder with
  # every generation TSan-instrumented; the root removed that, and what is left is ONE
  # instrumented link of a C file the root already emitted, plus one tiny fixture. A lane that
  # cheap belongs on every wagon — and `Sanitizer gate` NEEDS a leg that runs in both tiers, or it
  # is a required check that reports SUCCESS in light mode having asserted nothing (measured on
  # PR #95).
  #
  # WHAT IT STILL ASSERTS on a single-threaded codebase (user-ratified, supersedes #127's
  # full-suite-under-TSan approach): the test path has ZERO pthread/thread/atomic/spawn in src/,
  # so a full suite under `-fsanitize=thread` produces NO additional coverage over the other lanes
  # and only exposes the suite to environmental flake. What TSan CAN still assert is (1) that the
  # instrumentation builds at all, so the day threading lands the toolchain is already known-good,
  # and (2) that the runtime executes race-clean end-to-end on a real program. RESTORE the full
  # `teko test .` gate under TSan incrementally as the concurrency surface lands (S8/ASYNC).
  mem-paranoid:
    needs: [plan, artifact]
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.full == 'true'
    name: Memory paranoid (native self-host)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the published x86_64 asset
        uses: actions/download-artifact@v4
        with:
          name: teko-assets-linux-x86_64-glibc
          path: dl

      - name: Restore the executable bit
        run: |
          set -eu
          chmod +x dl/linux-x86_64-glibc/teko
          dl/linux-x86_64-glibc/teko --version

      - name: Run the gate on the published asset (TEKO_MEM_PARANOID)
        env:
          TEKO_MEM_PARANOID: '1'
        run: ./dl/linux-x86_64-glibc/teko . -o gen2-mp --no-verify --release

      - name: Run the single regression executor (TEKO_MEM_PARANOID)
        env:
          TEKO_MEM_PARANOID: '1'
        run: ./dl/linux-x86_64-glibc/teko test .

  # ══ clang-tidy-audit ═══════════════════════════════════════════════════════════════════════
  # TIER: both, and path-gated on src/runtime/** + src/assert/**.
  #
  # It needs no compiler from the root — it scans the LIVE maintained C (the runtime seam + the
  # assert seed linked into every generated program) with clang-tidy. It still `needs: artifact`
  # because the ruling is "todas as lanes de pull_request precisam depender dessa lane" without a
  # carve-out, and because the cost of complying is zero in practice: the PR's wall clock is
  # already the root's, so a cheap lane that starts after it does not lengthen anything. The
  # honest note is that this is the one lane where the dependency buys nothing but uniformity.
  gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [plan, artifact, cli-surface, regressor-full, ar-validation, cross-arch-determinism, seed-debut]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Structural — every job is covered, every aggregator is rooted
        run: |
          sh scripts/ci_gate_coverage.sh .github/workflows/pr.yml artifact \
            gate test-suite-gate sanitizer-gate

      # THE PURITY PROOF, run once (here) because it is a property of the whole file: no job but
      # the root may seed or walk the ladder, and zig may not appear anywhere in .github/workflows
      # or scripts. See scripts/ci_lane_purity.sh.
      - name: Structural — only the root builds, and the cross toolchain is gone
        run: sh scripts/ci_lane_purity.sh .github/workflows/pr.yml artifact

      - name: Cross-check the mode against an independent derivation
        if: needs.plan.result == 'success'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          PLAN_FULL: ${{ needs.plan.outputs.full }}
        run: |
          set -euo pipefail
          derived="$(sh scripts/ci_full_mode.sh | sed -n 's/^full=//p')"
          echo "plan says full='$PLAN_FULL'; the independent derivation says full='$derived'"
          if [ "$derived" != "$PLAN_FULL" ]; then
            echo "ERROR: the planner and an independent re-derivation disagree about the mode." >&2
            echo "A gate that accepts 'skipped' on the planner's word cannot detect a broken" >&2
            echo "planner — which is the failure this cross-check exists to catch." >&2
            exit 1
          fi

      - name: Evaluate results
        env:
          CHANGES: ${{ needs.plan.outputs.run }}
          FULL: ${{ needs.plan.outputs.full }}
          PLAN_RESULT: ${{ needs.plan.result }}
          ARTIFACT_RESULT: ${{ needs.artifact.result }}
          CLI_RESULT: ${{ needs.cli-surface.result }}
          REGRESSOR_RESULT: ${{ needs.regressor-full.result }}
          AR_RESULT: ${{ needs.ar-validation.result }}
          DETERMINISM_RESULT: ${{ needs.cross-arch-determinism.result }}
          DEBUT_RESULT: ${{ needs.seed-debut.result }}
        run: |
          set -u
          if [ "$FULL" = "true" ]; then MODE=full; else MODE=light; fi
          echo "mode=$MODE"
          echo "plan                    = $PLAN_RESULT"
          echo "plan.run                = $CHANGES"
          echo "artifact (ROOT)         = $ARTIFACT_RESULT   (both tiers)"
          echo "cli-surface             = $CLI_RESULT   (both tiers)"
          echo "regressor-full          = $REGRESSOR_RESULT   (full only)"
          echo "ar-validation           = $AR_RESULT   (full only)"
          echo "cross-arch-determinism  = $DETERMINISM_RESULT   (full only)"
          echo "seed-debut              = $DEBUT_RESULT   (full only)"

          FAILED=0

          # The planner is unconditional; anything but success is a break, and every `if:` below
          # reads its outputs, so a broken planner must never be waved through.
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "ERROR: plan = $PLAN_RESULT (it is unconditional)"
            FAILED=1
          fi

          # The ROOT follows `plan.run`, and this gate demands the matching result in BOTH
          # directions: green when there is something to build, SKIPPED when there is not. The
          # second half is the one that matters — it is what stops a docs-only run (or a broken
          # `if:`) from reporting green while the root quietly did nothing.
          if [ "$CHANGES" = "true" ]; then
            if [ "$ARTIFACT_RESULT" != "success" ]; then
              echo "ERROR: artifact (the ROOT, matrix) = $ARTIFACT_RESULT — every producer must succeed"
              FAILED=1
            fi
          elif [ "$ARTIFACT_RESULT" != "skipped" ]; then
            echo "ERROR: artifact (the ROOT) = $ARTIFACT_RESULT with plan.run=false — expected skipped"
            FAILED=1
          fi

          if [ "$CHANGES" != "true" ]; then
            echo "No allowlisted path changed — the compiler-diagnostic lanes had nothing to gate."
            if [ "$FAILED" = "1" ]; then echo "CI gate FAILED (mode=$MODE)."; exit 1; fi
            echo "CI gate passed (mode=$MODE, diagnostics not applicable)."
            exit 0
          fi

          # A both-tiers job must SUCCEED. `skipped` here is a broken condition, not an absence of
          # work.
          require_success() {
            [ "$2" = "success" ] && return 0
            echo "ERROR: $1 = $2 (it runs in both tiers; a skip means a broken condition)"
            FAILED=1
          }
          require_success cli-surface "$CLI_RESULT"

          # A full-only job must SUCCEED in full mode and be SKIPPED on the light tier. The mode
          # itself was cross-checked above against an independent derivation, so "skipped because
          # the mode does not ask" is now a VERIFIED statement and not a self-report.
          require_full_only() {
            if [ "$MODE" = "full" ]; then
              [ "$2" = "success" ] && return 0
              echo "ERROR: $1 = $2 (full mode requires success)"
              FAILED=1
              return 0
            fi
            [ "$2" = "skipped" ] && return 0
            echo "::warning::$1 = $2 on the light tier — expected skipped; check its \`if:\` condition."
          }
          require_full_only regressor-full         "$REGRESSOR_RESULT"
          require_full_only ar-validation          "$AR_RESULT"
          require_full_only cross-arch-determinism "$DETERMINISM_RESULT"
          require_full_only seed-debut             "$DEBUT_RESULT"

          if [ "$FAILED" = "1" ]; then
            echo "CI gate FAILED (mode=$MODE)."
            exit 1
          fi
          echo "CI gate passed (mode=$MODE)."
          exit 0

  test-suite-gate:
    name: Test suite gate
    runs-on: ubuntu-latest
    needs: [plan, artifact, test]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Structural — every job is covered, every aggregator is rooted
        run: |
          sh scripts/ci_gate_coverage.sh .github/workflows/pr.yml artifact \
            gate test-suite-gate sanitizer-gate

      - name: Cross-check the mode against an independent derivation
        if: needs.plan.result == 'success'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          PLAN_FULL: ${{ needs.plan.outputs.full }}
        run: |
          set -euo pipefail
          derived="$(sh scripts/ci_full_mode.sh | sed -n 's/^full=//p')"
          echo "plan says full='$PLAN_FULL'; the independent derivation says full='$derived'"
          [ "$derived" = "$PLAN_FULL" ] || { echo "ERROR: mode disagreement — see CI gate's note." >&2; exit 1; }

      # THE PLANNED-SET ASSERTION. A gate that only asks "were the matrix jobs green?" is vacuously
      # satisfiable by a `plan` that emits the wrong matrices — drop eight assets and one green leg
      # reports success. So this re-derives the REQUIRED asset set from the mode itself and demands
      # it exactly; and it cross-checks that the producers' `produces` union, the test matrix's
      # labels, and `labels` are the SAME set — a producer minting nothing a lane consumes, or a
      # lane with no producer, is caught here rather than as a download error. WANT_LABELS is
      # duplicated from `plan` on purpose: an independent statement of the requirement is the only
      # thing a broken planner cannot satisfy by agreeing with itself.
      - name: Evaluate results
        env:
          FULL: ${{ needs.plan.outputs.full }}
          CHANGES: ${{ needs.plan.outputs.run }}
          PLAN_RESULT: ${{ needs.plan.result }}
          PLANNED: ${{ needs.plan.outputs.labels }}
          MATRIX_ARTIFACT: ${{ needs.plan.outputs.matrix_artifact }}
          MATRIX_TEST: ${{ needs.plan.outputs.matrix_test }}
          ARTIFACT_RESULT: ${{ needs.artifact.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          set -u
          if [ "$FULL" = "true" ]; then
            MODE=full
            WANT_LABELS="linux-arm64-glibc linux-arm64-musl linux-x86_64-glibc linux-x86_64-musl macos-arm64 windows-x86_64"
          else
            MODE=light
            WANT_LABELS="linux-x86_64-glibc windows-x86_64"
          fi
          echo "mode=$MODE"
          echo "plan               = $PLAN_RESULT"
          echo "planned assets     = $PLANNED"
          echo "required assets    = $WANT_LABELS"
          echo "artifact (matrix)  = $ARTIFACT_RESULT"
          echo "test (matrix)      = $TEST_RESULT"

          FAILED=0
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "ERROR: plan = $PLAN_RESULT (it is unconditional)"
            FAILED=1
          fi

          # Sorted-and-compared as text so an omission, a duplicate and a typo all fail the same
          # way. Unquoted on purpose — word-splitting is what turns each list into one token per
          # label.
          WANT="$(printf '%s\n' $WANT_LABELS | sort | tr '\n' ' ')"
          GOT="$(printf '%s\n' $PLANNED | sort | tr '\n' ' ')"
          if [ "$GOT" != "$WANT" ]; then
            echo "ERROR: planned asset set does not match mode=$MODE"
            echo "  planned : $GOT"
            echo "  required: $WANT"
            FAILED=1
          fi

          # ONE LINE EACH, deliberately: a `python3 -c` whose continuation lines start at column 0
          # terminates the surrounding YAML block scalar, and indenting them instead would be a
          # python IndentationError. The trailing space matches WANT's, which `tr` leaves.
          PRODUCED="$(printf '%s' "$MATRIX_ARTIFACT" | python3 -c 'import json,sys; print(" ".join(sorted(x for e in json.load(sys.stdin)["include"] for x in e["produces"].split())) + " ")')"
          TESTED="$(printf '%s' "$MATRIX_TEST" | python3 -c 'import json,sys; print(" ".join(sorted(e["label"] for e in json.load(sys.stdin)["include"])) + " ")')"
          echo "producers mint     = $PRODUCED"
          echo "test legs consume  = $TESTED"
          if [ "$PRODUCED" != "$WANT" ] || [ "$TESTED" != "$WANT" ]; then
            echo "ERROR: the two layers and the required set do not agree (mode=$MODE)"
            FAILED=1
          fi

          # A matrix job's aggregate result is `success` only when EVERY leg succeeded, so this
          # rejects failure, cancellation and a skipped/empty matrix alike.
          #
          # There is exactly ONE legitimate skip — `plan.run=false`, a docs-only PR — and it is
          # not tolerated, it is DEMANDED. The asset-set cross-checks above stay in force either
          # way: they read the planner's matrices, which are emitted whether or not the layers
          # run, so a docs-only PR still proves the two layers agree about what they WOULD build.
          if [ "$CHANGES" = "true" ]; then
            if [ "$ARTIFACT_RESULT" != "success" ]; then
              echo "ERROR: artifact (matrix) = $ARTIFACT_RESULT — every producer must succeed"
              FAILED=1
            fi
            if [ "$TEST_RESULT" != "success" ]; then
              echo "ERROR: test (matrix over: $PLANNED) = $TEST_RESULT — every asset must succeed"
              FAILED=1
            fi
          else
            echo "plan.run=false (docs-only) — both layers must be SKIPPED, and are asserted so."
            for pair in "artifact:$ARTIFACT_RESULT" "test:$TEST_RESULT"; do
              if [ "${pair#*:}" != "skipped" ]; then
                echo "ERROR: ${pair%%:*} = ${pair#*:} with plan.run=false — expected skipped"
                FAILED=1
              fi
            done
          fi

          if [ "$FAILED" = "1" ]; then
            echo "Test suite gate FAILED (mode=$MODE)."
            exit 1
          fi
          echo "Test suite gate passed (mode=$MODE, assets: $PLANNED)."
          exit 0

  sanitizer-gate:
    name: Sanitizer gate
    runs-on: ubuntu-latest
    needs: [plan, artifact, mem-paranoid]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Structural — every job is covered, every aggregator is rooted
        run: |
          sh scripts/ci_gate_coverage.sh .github/workflows/pr.yml artifact \
            gate test-suite-gate sanitizer-gate

      - name: Cross-check the mode against an independent derivation
        if: needs.plan.result == 'success'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          PLAN_FULL: ${{ needs.plan.outputs.full }}
        run: |
          set -euo pipefail
          derived="$(sh scripts/ci_full_mode.sh | sed -n 's/^full=//p')"
          echo "plan says full='$PLAN_FULL'; the independent derivation says full='$derived'"
          [ "$derived" = "$PLAN_FULL" ] || { echo "ERROR: mode disagreement — see CI gate's note." >&2; exit 1; }

      # THIS GATE USED TO BE ABLE TO REPORT SUCCESS HAVING VALIDATED NOTHING (measured, PR #95:
      # tsan and windows-selfhost both `skipped`, gate `success`). Two changes close it: its only
      # remaining leg, `tsan`, now runs in BOTH tiers (the root removed the ladder that made it
      # expensive), and the root itself is a `needs:` so a red root can never be aggregated green.
      # windows-selfhost is GONE — `artifact / windows-x86_64` self-builds gen1 on Windows and
      # smokes the binary, which is verbatim what that lane did.
      - name: Evaluate results
        env:
          CHANGES: ${{ needs.plan.outputs.run }}
          FULL: ${{ needs.plan.outputs.full }}
          PLAN_RESULT: ${{ needs.plan.result }}
          ARTIFACT_RESULT: ${{ needs.artifact.result }}
          MEM_PARANOID: ${{ needs.mem-paranoid.result }}
        run: |
          set -u
          if [ "$FULL" = "true" ]; then MODE=full; else MODE=light; fi
          echo "mode=$MODE"
          echo "plan          = $PLAN_RESULT"
          echo "plan.run      = $CHANGES"
          echo "artifact ROOT = $ARTIFACT_RESULT   (both tiers)"
          echo "mem-paranoid  = $MEM_PARANOID   (full only)"

          FAILED=0
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "ERROR: plan = $PLAN_RESULT (it is unconditional)"; FAILED=1
          fi
          if [ "$CHANGES" = "true" ]; then
            if [ "$ARTIFACT_RESULT" != "success" ]; then
              echo "ERROR: artifact (the ROOT) = $ARTIFACT_RESULT — tsan consumes its output"; FAILED=1
            fi
          elif [ "$ARTIFACT_RESULT" != "skipped" ]; then
            echo "ERROR: artifact (the ROOT) = $ARTIFACT_RESULT with plan.run=false — expected skipped"; FAILED=1
          fi

          if [ "$CHANGES" != "true" ]; then
            echo "No allowlisted path changed — nothing for the sanitizer lane to gate."
            if [ "$FAILED" = "1" ]; then echo "Sanitizer gate FAILED (mode=$MODE)."; exit 1; fi
            echo "Sanitizer gate passed (mode=$MODE, not applicable)."
            exit 0
          fi

          # The LAST memory oracle. TSan, ASan/UBSan and LSan left with the C emitter they
          # instrumented — a backend that writes objects directly has no clang to instrument it.
          # `mem-paranoid` stays because its oracle is the ARENA, not C: poison-on-free plus
          # never-reuse, which the runtime carries in whatever language it is written in. The C
          # runtime's own comment records why that is not redundant with what left —
          # "Arena reuse is invisible to ASan, so a wrong linearity proof would corrupt silently".
          if [ "$MODE" = "full" ]; then
            if [ "$MEM_PARANOID" != "success" ]; then
              echo "ERROR: mem-paranoid = $MEM_PARANOID (full mode requires success — it is the only"
              echo "memory oracle left, and a gate that accepts its absence gates nothing)"
              FAILED=1
            fi
          elif [ "$MEM_PARANOID" != "skipped" ]; then
            echo "::warning::mem-paranoid = $MEM_PARANOID on the light tier — expected skipped."
          fi

          if [ "$FAILED" = "1" ]; then
            echo "Sanitizer gate FAILED (mode=$MODE)."
            exit 1
          fi
          echo "Sanitizer gate passed (mode=$MODE)."
          exit 0
