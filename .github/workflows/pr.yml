  # ══ test-linux-arm64-glibc ═════════════════════════════════════════════════════════════════
  # TIER: full only.
  #
  # THE TEST LEG, IN FULL, WITH ITS RATIONALE — the other five test jobs below are the SAME BODY
  # with only os/timeout/label and the fixpoint-backend lookup changed.
  #
  # `needs: [plan, artifact-linux-arm64-glibc]` — ONLY this one producer. A red
  # `artifact-linux-arm64-glibc` skips this job and NOTHING ELSE; the other five test-* jobs are
  # untouched, because they each name only their OWN producer.
  #
  # A C TOOLCHAIN IS STILL REQUIRED HERE, and that is not a build sneaking back in: `teko test .`
  # IS a native gate — it emits the #test corpus as C, compiles it and runs it out-of-process
  # (#168). The compiler under test is the downloaded asset; `cc` is the suite's engine.
  #
  # NO "asset self-test must have run" GUARD ANY MORE, and its removal is deliberate, not an
  # omission. The matrix version needed it because ONE shared job carried both a POSIX and a
  # Windows self-test step behind `if: runner.os != 'Windows'` / `if: runner.os == 'Windows'`, so
  # a label that matched NEITHER predicate would silently skip both and still report success. Each
  # test-* job below now hardcodes its own OS and carries exactly ONE self-test step with no `if:`
  # of its own — the ambiguity the guard existed to catch cannot occur any more, because there is
  # no shared predicate left for a label to fail to match.
  test-linux-arm64-glibc:
    needs: [plan, artifact-linux-arm64-glibc]
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.full == 'true'
    name: test / linux-arm64-glibc
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      # The corpus under test. The asset arrives by download; the SOURCE it compiles is this PR's.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report the host toolchain (diagnostic — never fails the job)
        shell: bash
        run: |
          for t in cc clang gcc file python3; do
            printf '%-8s ' "$t"
            command -v "$t" || echo '(absent)'
          done

      - name: Download this lane's published asset
        uses: actions/download-artifact@v4
        with:
          name: teko-assets-linux-arm64-glibc
          path: dl

      # `actions/upload-artifact` does NOT preserve the executable bit, so restoring it is
      # MANDATORY, not hygiene. `--version` is the diagnostic that names the binary under test
      # BEFORE the suite.
      - name: Restore the executable bit and name the asset under test
        shell: bash
        run: |
          set -eu
          art="dl/linux-arm64-glibc/teko"
          if [ ! -f "$art" ]; then
            echo "ERROR: the producer's upload has no $art" >&2
            ls -lR dl >&2
            exit 1
          fi
          chmod +x "$art"
          file "$art" || true
          "$art" --version

      - name: Asset self-test (the published asset runs its own gate)
        shell: bash
        run: dl/linux-arm64-glibc/teko test .

      # THE NO-C-IN-TESTS GATE (owner ruling 2026-07-29, literal): "esse é outro que não pode
      # emitir C quando for compilar nativo [...] se ao final de uma sessão de testes houver um C
      # gerado, tem que fechar vermelha a lane." `teko test .`'s unit half emits the `#test` corpus
      # as C and compiles it with `cc` UNCONDITIONALLY — it never reads `TEKO_BACKEND` — so a green
      # suite on a leg that claims to run native proves nothing about the native backend unless
      # something checks that no C survived the session. `scripts/no_c_in_tests_gate.sh` is that
      # check; `scripts/no_c_in_tests_gate_test.sh` (run in `CI gate`) proves the check itself.
      #
      # SCOPED TO A NATIVE LEG ONLY, via the SAME lookup the producer's fixpoint step uses. RUNS
      # ON THE CHECKED-OUT SOURCE TREE (`.`), NOT ON `dl/`: `teko test .` compiled ITS OWN
      # `#test`/regression corpus in the checkout's `bin/`.
      - name: No generated C after a native-backend test session
        if: needs.plan.outputs.fb_linux_arm64_glibc == 'native'
        shell: bash
        run: sh scripts/no_c_in_tests_gate.sh .

  # ══ test-linux-arm64-musl ══════════════════════════════════════════════════════════════════
