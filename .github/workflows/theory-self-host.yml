# .github/workflows/theory-self-host.yml — A THEORY: how far is the native backend from
# self-hosting, and which degraus are between here and there.
#
# Owner ruling 2026-07-27: *"recomendo fazer a mesma técnica de degrau do 15, mas partindo do
# teko.c do 15, assim consegue chegar em uma gen2 e gen3 realmente nativa, pode usar uma theory
# para validar e encontrar ao invés de queimar muitos runners, algo simples, finalizar a escada e
# passar fixpoint + testes, nada mais, validado isso, reaplica no vagão 20."*
#
# WHAT MAKES THIS A THEORY AND NOT A LANE. It gates NOTHING, publishes NOTHING, and runs only on
# `workflow_dispatch`. Its whole job is to answer one question per dispatch — "what stops the
# compiler from building itself today?" — and print the address. The wagon's own six sublanes
# answer the same question, but they cost six runners plus every downstream lane to say it once.
# This costs ONE.
#
# WHY IT IS SO SHORT, and the shortness is the design rather than a corner cut. Three steps:
#
#   1. cc the committed `bootstrap/teko.c`          -> gen1     (~60s)
#   2. fixpoint: gen2 = gen1(src), gen3 = gen2(src) -> the verdict, with the degrau's address
#   3. `teko test .`                                -> the suite, only if the fixpoint held
#
# No assets, no staging, no matrix, no artifact upload, no downstream anything. Every one of those
# exists to SHIP a compiler; none of them helps answer whether the compiler can rebuild itself. A
# theory that reproduces the production pipeline is just a slower copy of it.
#
# ONE LEG, x86_64, ON PURPOSE. The degraus this hunts (`ltype_of(Named) = Ptr`, aggregate value
# semantics, the per-instruction frame slot) live in the SHARED front half of lowering, not in an
# arch backend — they reproduce identically on arm64, as the wagon's own six lanes have shown all
# day by failing with the same message on every one. Paying for a second architecture to hear the
# same sentence twice is the runner burn this file exists to avoid. If a degrau ever turns out to
# be arch-specific, THAT is the moment to add the leg.
#
# HOW IT IS MEANT TO BE USED: dispatch, read the address, close that degrau on a cargo branch,
# dispatch again. When step 2 finally reports PASSED and step 3 is green, the theory has done its
# job — and the fix, already proven, is reapplied to the wagon (owner: *"validado isso, reaplica no
# vagão 20"*).
#
# DELETE THIS FILE when the wagon self-hosts. It has no reason to outlive that day.
name: theory · self-host (one runner, one question)

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'run `teko test .` after the fixpoint (off = fixpoint only, ~2 min faster)'
        required: false
        default: 'true'

jobs:
  self-host:
    name: theory / self-host
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report the host toolchain (diagnostic — never fails the job)
        shell: bash
        run: |
          cc --version | head -n1
          nproc
          free -m || true

      # NO SEED IS PROVISIONED AND NONE IS NEEDED. `build_with_seed_fallback.sh` enters through
      # rung -1, which compiles the committed `bootstrap/teko.c` with the runner's own cc and
      # builds the tip in ONE generation. No download, no ladder, no git history — the whole reason
      # the committed C exists.
      - name: gen1 — cc the committed C, then build the tip with it
        shell: bash
        run: |
          set -eu
          sh scripts/build_with_seed_fallback.sh out
          ls -la out/

      # THE QUESTION. Everything above is setup; this is the dispatch's actual payload. On failure
      # it prints the named N2 address of whatever the native backend cannot lower yet — which is
      # the ONE fact a dispatch exists to retrieve.
      - name: THE QUESTION — does the compiler rebuild itself, and does gen2 == gen3?
        shell: bash
        run: sh scripts/fixpoint_gate.sh out/teko . .fixpoint

      # Only reached when the fixpoint HELD. A suite run before that point would be testing a
      # compiler already known not to reproduce itself — the owner's own words: *"se nem consegue
      # gerar gen2, nem tem que perder tempo com testes"*.
      - name: The suite (only reachable once the fixpoint holds)
        if: ${{ github.event.inputs.run_tests != 'false' }}
        shell: bash
        env:
          REGRESSION_REQUIRE_TOOLS: "1"
        run: |
          set -eu
          ./out/teko test . --arith-cast-gate 2>&1 | tee teko-test.log

      - name: No skips — every declared row must have run
        if: ${{ always() && github.event.inputs.run_tests != 'false' && hashFiles('teko-test.log') != '' }}
        shell: bash
        run: sh scripts/no_skips_gate.sh teko-test.log
