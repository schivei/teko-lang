name: seed parity (canonical vs fork)

# ══════════════════════════════════════════════════════════════════════════════════════════════
# TWO SEEDS, TWO QUESTIONS, AND THEY ARE NOT THE SAME QUESTION.
#
# Owner ruling 2026-07-28: *"o fork produz, por isso quero o teste, e, sendo ou não, se ambos
# conseguem fazer build da main (já sincronizei)."*
#
#   1. ARE THE BYTES EQUAL?      -> REPORTED, never fatal.
#   2. CAN EACH ONE BUILD main AND PASS ITS OWN SUITE?  -> FATAL. The acceptance criterion
#      (owner, 2026-07-28: *"com os testes, só pra garantir e ser rápido"*). One runner, one job,
#      both seeds — fast because nothing is rebuilt that a release already published.
#
# WHAT THE TWO SIDES ACTUALLY ARE, at .31, verified against the published assets rather than assumed:
# BOTH are the `scripts/produce_assets.sh` asset root. The org's comes down its release chain; the
# fork's is the `nightly.yml` prerelease the owner renamed to the version tag by hand (release id
# 361274068, body still reading "Transitory build of 4e6c4e4b"). The fork's OTHER publisher —
# `seed-linux-fork.yml`, a bare `teko build . --no-verify --release` with no ladder and no fixpoint —
# is `workflow_dispatch`-only and last cut `.30`, so it is NOT what this lane is holding at this tag.
#
# That makes byte equality a SHARPER question than "do two recipes agree": same recipe, two repos,
# two runners, two runs. Bytes SHOULD match if the build is reproducible, and a difference points at
# something the build picked up from its machine — which is the property that would have caught the
# PE `TimeDateStamp` defect (the .31 Windows fixpoint died at byte 137) before it reached a release.
#
# It is REPORTED anyway, and deliberately so: this is the FIRST measurement. A gate that fails before
# anyone has seen one reading teaches nothing about the reading — it only teaches that we guessed.
# Promote it to fatal once the lane has shown what the steady state is. Note also that a hand-renamed
# release is not a producer we control, so the comparison is only as stable as the owner's next
# rename; if the fork ever goes back to `seed-linux-fork.yml`, the two sides become different recipes
# again and this whole paragraph must be re-read before anyone makes question 1 fatal.
#
# WHAT WOULD BE A LIE: failing on a byte difference and calling it "reproducibility broken", or
# passing on byte equality while neither seed can actually compile anything. Hence one reported and
# one enforced.
#
# THE BACKEND IS PINNED FOR THE BUILD, and this is the lesson the .31 wagon paid for: both seeds are
# TODAY's compiler, whose default backend is NATIVE, and the native backend cannot yet build the
# compiler. Without the pin this lane would report "seed cannot build main" for a reason that has
# nothing to do with the seed — exactly how rung -1 started failing the moment `bootstrap/teko.c`
# was replaced, and how a green macOS leg turned out to have bypassed the seed entirely.
#
# PUSH-TRIGGERED ON ITS OWN BRANCH, on purpose: it downloads published releases, so it measures what
# was SHIPPED, not what a PR happens to contain. Re-push to re-measure after a new release.
# ══════════════════════════════════════════════════════════════════════════════════════════════

on:
  push:
    branches: ["ci/seed-parity"]
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag to compare (default: the manifest's own version)"
        required: false
        default: ""

permissions:
  contents: read

env:
  CANONICAL_REPO: teko-org/teko-lang
  FORK_REPO: schivei/teko-lang
  LABEL: linux-x86_64-glibc
  # The only route that self-hosts today. See scripts/build_with_seed_fallback.sh's build_project().
  TEKO_SELFHOST_BACKEND: c

jobs:
  parity:
    name: seed parity / linux-x86_64-glibc
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main (the tree BOTH seeds must be able to build)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve the tag under test
        id: ver
        shell: bash
        run: |
          set -eu
          # derive_version.sh ALREADY prints the `v` prefix — its own header says so:
          # "this derived TAG is `v<version>[-<suffix>]`". Prepending another produced
          # `vv0.3.0.31-beta` and the download missed by one character.
          V="${{ github.event.inputs.tag }}"
          [ -n "$V" ] || V="$(sh scripts/derive_version.sh)"
          # A hand-typed input may or may not carry the `v`; normalize to exactly one.
          V="v${V#v}"
          echo "tag=$V" >> "$GITHUB_OUTPUT"
          echo "comparing release $V"

      # DOWNLOADED, NOT BUILT. The point is to measure the bytes that were PUBLISHED — a locally
      # rebuilt binary would be a sibling of the asset, not the asset, which is the same defect
      # `release.yml` exists to avoid ("recompiling publishes bytes no gate ever saw").
      - name: Fetch both published seeds
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.tag }}
        shell: bash
        run: |
          set -eu
          fetch_one() {  # fetch_one REPO DEST
            repo="$1"; dest="$2"
            mkdir -p "$dest"
            if ! gh release download "$V" --repo "$repo" --pattern "*${LABEL}*" --dir "$dest" 2>/dev/null; then
              echo "MISSING: $repo has no asset matching '*${LABEL}*' at $V" >&2
              return 1
            fi
            asset="$(find "$dest" -type f | head -n1)"
            case "$asset" in
              *.tar.gz|*.tgz) tar -C "$dest" -xzf "$asset" ;;
              *.zip)          unzip -q -o "$asset" -d "$dest" ;;
            esac
            bin="$(find "$dest" -type f -name teko | head -n1)"
            [ -n "$bin" ] || { echo "no 'teko' binary inside $repo's asset" >&2; return 1; }
            chmod +x "$bin"
            echo "$bin"
          }
          # A MISSING SEED MUST NOT BLIND THE LANE TO THE OTHER ONE. If one side simply has not
          # been cut yet, that is a publishing gap, not a compiler fact — but it must not stop us
          # from learning whether the side that DOES exist can still build the tree. So the fetch
          # is non-fatal per seed; the run still fails at the end (see the last step), because a
          # parity question cannot be answered with one seed.
          CANON_BIN="$(fetch_one "$CANONICAL_REPO" canon || true)"
          FORK_BIN="$(fetch_one "$FORK_REPO" fork || true)"
          echo "CANON_BIN=$CANON_BIN" >> "$GITHUB_ENV"
          echo "FORK_BIN=$FORK_BIN" >> "$GITHUB_ENV"
          if [ -n "$CANON_BIN" ]; then "$CANON_BIN" --version; fi
          if [ -n "$FORK_BIN" ];  then "$FORK_BIN"  --version; fi
          if [ -z "$FORK_BIN" ]; then
            echo "HOW TO CUT THE MISSING FORK SEED: dispatch 'Fork Seed (Linux x86-64)'" >&2
            echo "  (.github/workflows/seed-linux-fork.yml) on $FORK_REPO@main — it is" >&2
            echo "  workflow_dispatch-only and idempotent, then re-push this branch." >&2
          fi
          exit 0

      # QUESTION 1 — REPORTED. And it names the OFFSET when it differs, because "the files differ"
      # teaches nothing: it was the first differing offset that identified the PE TimeDateStamp.
      - name: Byte parity (REPORTED, never fatal)
        shell: bash
        run: |
          set -eu
          a="$CANON_BIN"; b="$FORK_BIN"
          for pair in "canonical:$a" "fork:$b"; do
            who="${pair%%:*}"; p="${pair#*:}"
            if [ -n "$p" ]; then
              printf '%-9s %s bytes  sha256 %s\n' "$who" "$(stat -c%s "$p")" "$(sha256sum "$p" | cut -d' ' -f1)"
            else
              printf '%-9s NOT PUBLISHED at this tag\n' "$who"
            fi
          done
          if [ -z "$a" ] || [ -z "$b" ]; then
            echo "PARITY: UNANSWERABLE — only one seed exists at this tag."
            exit 0
          fi
          if cmp -s "$a" "$b"; then
            echo "PARITY: byte-identical — two independent productions agree exactly."
          else
            echo "PARITY: DIFFER — reported, not fatal (the two publish through different recipes)."
            cmp "$a" "$b" || true
            echo "--- first differing region ---"
            off="$(cmp "$a" "$b" 2>/dev/null | sed -n 's/.*byte \([0-9]*\),.*/\1/p' | head -n1)"
            if [ -n "$off" ]; then
              start=$(( off > 32 ? off - 32 : 0 ))
              echo "canonical:"; xxd -s "$start" -l 96 "$a" || true
              echo "fork:";      xxd -s "$start" -l 96 "$b" || true
            fi
          fi

      # QUESTION 2 — FATAL. A seed that cannot compile the tree is not a seed, whatever its bytes.
      # Each build runs in its OWN output dir so neither can serve the other's artefacts.
      - name: Both seeds must build main
        shell: bash
        run: |
          set -eu
          bad=0
          for pair in "canonical:$CANON_BIN" "fork:$FORK_BIN"; do
            who="${pair%%:*}"; bin="${pair#*:}"
            # An UNCUT seed is still a failure of this lane — we cannot answer the question with
            # one seed — but it is named for what it is, so the log never reads as a compiler bug.
            if [ -z "$bin" ]; then
              echo "$who: NOT PUBLISHED at this tag — nothing to measure" >&2
              bad=1
              continue
            fi
            echo "::group::$who builds main"
            if TEKO_BACKEND="$TEKO_SELFHOST_BACKEND" "$bin" . -o "out-$who" --no-verify --release; then
              test -x "out-$who/teko" || { echo "$who: build reported success but produced no binary" >&2; bad=1; }
              echo "$who: built — $("out-$who/teko" --version)"
              # THE SUITE, ON THE NATIVE DEFAULT, and the asymmetry with the line above is deliberate.
              # The BUILD is a compiler self-build and needs the C pin; the SUITE is the thing the
              # native backend exists to be measured by. Pinning C here would make it pass down the
              # road we are retiring — `scripts/fixpoint_gate.sh` recorded exactly that when a wide
              # pin turned `diagnostics.tkr` green without fixing anything.
              if ! "out-$who/teko" test .; then
                echo "$who: built main but its own suite FAILED" >&2
                bad=1
              fi
            else
              echo "$who: FAILED to build main" >&2
              bad=1
            fi
            echo "::endgroup::"
          done
          [ "$bad" -eq 0 ] || { echo "at least one published seed is missing, cannot build main, or fails its own suite" >&2; exit 1; }
          echo "BOTH seeds build main AND pass their own suite."
