# .github/workflows/theory-generation-decay.yml — GENERATION DECAY, THE TREATMENT ARM
#
# THIS IS HALF OF A CONTROLLED EXPERIMENT. The other half lives on `theory/generation-decay`, cut
# from `main`. Owner framing, 2026-07-27: *"pq precisamos de um grupo de controle para entender o
# que há com o vagão 20"*.
#
#   CONTROL     branch theory/generation-decay   tree = main (0.3.0.30)   the seed builds it DIRECTLY
#   TREATMENT   this file, on the wagon          tree = wagon 20          the seed FAILS; a ladder runs
#
# Both arms chain N dry builds of THEIR OWN tree, so within each arm the work is constant and any
# drift between generations is the compiler getting slower. Comparing the two arms is what isolates
# the wagon:
#
#   main flat, wagon decays   →  the decay CAME IN WITH THE WAGON — a drained cargo did it, and the
#                                per-generation numbers say which phase to look at
#   both decay alike          →  it is the compiler or the toolchain (PIE, cc, ladder), NOT the
#                                wagon, and the wagon stops being a suspect
#   both flat                 →  there is no decay at all, and the wagon's cost is entirely the
#                                ladder it is forced to walk (392s of 780s on x86_64, measured)
#
# WHY THE STARTING COMPILER DIFFERS BETWEEN THE ARMS, and why that is the point rather than a flaw:
# on `main` the released seed builds the tree directly, so generation 1 comes from the seed. On the
# wagon the seed CANNOT (`src/checker/comptime_fold.tks:1569:45: operands must be the same type`),
# so this arm first walks the ladder to obtain a compiler that can, and chains from THERE. That
# difference is not noise to be removed — it is one of the things under study.
#
# The item counts are close enough for the absolute numbers to compare directly, not just the
# curves: main and the wagon are within ~1% of each other (≈5900 checker items).
#
# It gates nothing and publishes nothing. Delete it once the question is answered.
name: theory · generation decay (wagon arm)

on:
  workflow_dispatch:
    inputs:
      generations:
        description: 'how many generations to chain after the ladder'
        required: false
        default: '4'

jobs:
  decay:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, os: ubuntu-latest,    seed: linux-x86_64-glibc }
          - { arch: arm64,  os: ubuntu-24.04-arm, seed: linux-arm64-glibc }
    name: decay-wagon / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report the host toolchain (diagnostic — never fails the job)
        shell: bash
        run: |
          for t in cc gcc file xz unzip tar curl python3; do
            printf '%-8s ' "$t"
            command -v "$t" || echo '(absent)'
          done
          nproc
          free -m || true

      # THE LADDER IS THE PRICE OF ADMISSION HERE, not part of the measurement. It exists only to
      # obtain a compiler that can build this tree at all; its own phase timings are already
      # reported by the producing lane and are not what this experiment is about.
      # PROVISION FIRST, THEN WALK. `build_with_seed_fallback.sh` resolves the seed as a bare
      # `teko` ON THE PATH — it does not provision one. In the producing lane that step is done by
      # `produce_assets.sh` just before it calls the ladder, and calling the ladder directly
      # without repeating it is exactly the mistake this comment exists to stop: it fails with a
      # bare `teko: not found` from inside the rung build, which reads like a broken pin rather
      # than a missing seed. Measured on the first dispatch of this workflow.
      - name: Provision the released seed and put it on PATH
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SEED: ${{ matrix.seed }}
        run: |
          set -eu
          sh scripts/ci_provision_teko.sh "$SEED"
          [ -d .seed ] || { echo "provisioning reported success but left no .seed" >&2; exit 1; }
          echo "$PWD/.seed" >> "$GITHUB_PATH"

      - name: Walk the ladder to obtain generation 0 (the wagon's seed cannot build this tree)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          teko --version
          sh scripts/build_with_seed_fallback.sh gen0

      - name: Chain the generations from there and measure each one
        shell: bash
        env:
          GENERATIONS: ${{ github.event.inputs.generations || '4' }}
        run: |
          set -eu
          bin="$PWD/gen0/teko"
          [ -f "$bin" ] || bin="$PWD/gen0/teko.exe"
          TEKO_DECAY_SEED_BIN="$bin" sh scripts/theory_generation_decay.sh "$GENERATIONS"
