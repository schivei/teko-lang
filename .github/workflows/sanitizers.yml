name: Sanitizers & Stress

# Two-tier memory/UB gating (owner ruling 2026-07-14 — see docs/design/ci-gates.md).
#
#   LIGHT gate (protects the SEED, runs on EVERY lane PR): the native self-host under
#   TEKO_MEM_PARANOID — teko's OWN arena oracle (poison-on-free + never-reuse). No clang,
#   no ASan shadow memory, ~one native self-host of wall-clock. This is what a lane PR
#   must pass so the seed it feeds the next crumb is memory-clean.
#
#   HEAVY gate (audits MAIN): the full ASan+UBSan(+LSan-by-name) default-dispatch lane. It is the
#   ~24-min lane that surfaced the historical root UBs; it is NOT worth paying on every wagon PR
#   now that the C mirror is gone. It runs on the PR whose BASE is main — the wagon that LANDS a
#   stacked train, or a hotfix. No nightly, no schedule, no auto-issue.
#
# BUG FIXED HERE (2026-07-25): `mem-paranoid` and `asan-default` gated on
# `github.ref == 'refs/heads/main'`, describing a `push:` trigger this workflow does NOT have. On a
# `pull_request` event `github.ref` is `refs/pull/N/merge`, so the condition was ALWAYS false: both
# lanes had never run once, and the `Heavy sanitizer gate` that aggregates them was vacuously green
# (confirmed live on PR #91: both `skipped`, gate `success`). The axis is `github.base_ref`.
#
# LIGHT vs FULL (owner proposal 2026-07-24): every job in this workflow is heavy enough to belong to
# the full path — `tsan` carries a 90-min budget and `windows-selfhost` a 100-min one — so the whole
# workflow is full-only. What guards a wagon PR instead is `test / linux` + the native self-build
# gate; the memory/UB audit lands once, at the landing.
#
# CI runs on PULL REQUESTS. Branch protection gates merges on the aggregators below; the release
# trusts main and does not re-validate.
on:
  pull_request:
    branches: ['**']   # '**' cruza '/' — casa base com barra (remodel/...); '*' simples nao
    paths: ['**.tkp', '**.tks', '**.tkt', '**.tkr', '**.sh', '**.c', '**.h', '.github/workflows/*.yml']

# Restrict default token scope for all jobs in this workflow.
permissions:
  contents: read

jobs:
  # ── path filter ──────────────────────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
      # `full` is true only for a PR whose BASE is main (see the header). Exported here so every
      # job and both aggregators read ONE definition of the mode.
      full: ${{ steps.mode.outputs.full }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            run:
              - 'src/**'
              - 'tests/**'
              - 'scripts/ci_cc_wrap.sh'
              - 'scripts/ci_provision_teko.sh'
              - '.github/workflows/sanitizers.yml'
              - '.github/lsan-suppressions.txt'
      - name: Decide the mode (full <=> base_ref == main)
        id: mode
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$BASE_REF" = "main" ]; then full=true; else full=false; fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "mode: $([ "$full" = "true" ] && echo full || echo light) (base_ref='$BASE_REF')"

  # ── HEAVY gate: TEKO_MEM_PARANOID native self-host — MAIN ONLY ────────────────
  # TEKO_MEM_PARANOID is teko's OWN arena oracle (teko_rt.c #148 Level-2): a runtime getenv that
  # POISONS every freed arena block and NEVER reuses it, so any use-after-free / arena-reuse-after-
  # free in the compiler's OWN C aborts loud. Because never-reuse disables the arena free-list, the
  # full self-host under the oracle is HEAVY (~18-20 min on the backend-wave code: ~7 min build +
  # ~11 min oracle run) — too heavy to pay on every lane PR (owner ruling 2026-07-14: it "wrecks
  # the CI"). So it moves to the MAIN-only heavy tier alongside the ASan lane: it runs ONLY on push
  # to main (the merge), and is SKIPPED on ALL PRs — lane, remodel, AND the umbrella -> main PR. The
  # memory audit therefore lands right after the seed/release boundary (the merge to main), not on any PR.
  mem-paranoid:
    name: Memory paranoid (native self-host)
    needs: changes
    if: needs.changes.outputs.run == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provision teko from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci_provision_teko.sh linux-x86_64

      # scripts/build_with_seed_fallback.sh (owner ruling 2026-07-24): this lane only ever
      # runs on a push to main, so the fast path is the only path that should ever fire here —
      # the fallback exists for uniformity with the other lanes and as a fail-loud backstop,
      # never as an expected route (a seed that cannot build main is a real regression).
      - name: Build gen1 (seed compiles the PR sources)
        run: sh scripts/build_with_seed_fallback.sh bin

      # Run the gate on gen1 with the arena oracle armed. Any poison-touch / reuse aborts loud.
      - name: Run the gate on gen1 (TEKO_MEM_PARANOID)
        env:
          TEKO_MEM_PARANOID: '1'
        run: ./bin/teko . -o gen2-mp --no-verify --release

      # Widen the corpus of language constructs exercised under the oracle: native-build every
      # regressions fixture with gen1 while paranoid poisoning is armed.
      - name: Native-build regressions fixtures (TEKO_MEM_PARANOID)
        env:
          TEKO_MEM_PARANOID: '1'
        run: |
          out="$(mktemp -d)"
          for proj in examples/regressions/*/; do
            ls "$proj"*.tkp >/dev/null 2>&1 || continue
            if [ -f "${proj}EXPECT_COMPILE_FAIL" ]; then echo "== skip ${proj} (EXPECT_COMPILE_FAIL — negative fixture, nothing to build)"; continue; fi
            echo "== teko build $proj"
            ./bin/teko build "$proj" -o "$out/$(basename "$proj")" --no-verify --release
          done

  # ── HEAVY gate: ASan + UBSan + LSan (default computed-goto dispatch) — MAIN ONLY ─
  # Trigger is the MERGE to main, and only that: this job runs ONLY on push to main
  # (ref == refs/heads/main). It is SKIPPED on ALL PRs (lane, remodel, AND the umbrella -> main PR)
  # and on remodel pushes — the light mem-paranoid gate guards those. This is the ~24-min lane and it
  # is only paid right after the seed/release boundary (the push that lands the umbrella on main), per owner ruling.
  #
  # LSan is enabled on THIS lane only (issue #54): detect_leaks with a suppressions file
  # (.github/lsan-suppressions.txt) covering the documented M.5 process-lifetime allocations
  # (deliberately never freed by us; reclaimed by the OS at exit). Any OTHER leak fails the lane.
  asan-default:
    name: ASan+UBSan+LSan / default dispatch
    needs: changes
    if: needs.changes.outputs.run == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang

      - name: Provision teko from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci_provision_teko.sh linux-x86_64

      # The compiler is the downloaded release; sanitize its C by building gen1 (generated
      # C + runtime seam) under -fsanitize via a cc wrapper, then RUN gen1 — that is what
      # exercises the compiler's C under ASan/UBSan. scripts/build_with_seed_fallback.sh
      # (owner ruling 2026-07-24) is a fail-loud backstop here — this lane only runs on a
      # push to main, so the fallback should never actually engage.
      - name: Build gen1 under ASan + UBSan (cc wrapper)
        run: |
          sh scripts/ci_cc_wrap.sh "-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          sh scripts/build_with_seed_fallback.sh bin

      # This lane runs the NATIVE gate (`./bin/teko . -o gen2-asan`): the sanitized gen1 compiles the
      # whole project through the PRODUCTION native pipeline (front-end -> emitted C -> host cc ->
      # execute), so ASan/UBSan/LSan cover the emitted C + runtime seam on the path the release ships,
      # and it drops the VM functional-env balloon under ASan. This lane is a rolling UB-audit of the
      # native path: each pre-existing UB it surfaces is fixed at the ROOT before the flip stays green.
      # It has so far surfaced and driven root fixes for (1) the #291 trait dynamic-vtable function-
      # pointer-type mismatch (typed dispatch thunks); and, once dispatch no longer aborted, two more
      # PRE-EXISTING runtime UBs the VM gate never reached, BOTH fixed at the root before this re-flip:
      # (2a) `tk_mul_u16` signed-integer-overflow (uint16 operands promote to int; 65535*65535
      # overflows) — now multiplied in `unsigned`; and (2b) a SYSTEMIC arena under-alignment —
      # `tk_region_alloc` rounded to `_Alignof(max_align_t)` (8 on arm64) but `ExprKind`/`TExprKind`
      # carry an `__int128` needing 16, so every Expr/TExpr could land 8-byte-aligned on a
      # max_align_t<16 target — now the arena guarantees TK_ARENA_ALIGN (max of max_align_t's and
      # __int128's) for the payload base AND the bump/size rounding. The #168 build-gate memory win
      # (VM→native default for `teko . -o bin`) is independent of this lane. The #323 ASan caps stay:
      # they bound the lane's ASan footprint on the 7 GB runner.
      #
      # LSan (detect_leaks) is OFF here BY CONSTRUCTION. Unlike a per-#test-rewound run — which sees
      # only leaks BEYOND the rewound set — the native gate compiles + runs the whole corpus in ONE
      # process with NO rewind, so the arena's process-lifetime allocations (front-end discovery
      # strings via dsc_walk, per-test crypto buffers) are all held to exit by the S0 arena discipline
      # and reclaimed by the OS. LSan cannot distinguish that deliberate hold from a real leak on this
      # lane (it flagged ~132 KB of exactly those holds, NONE from the alignment change), so it is not
      # a meaningful oracle here. This lane's job is ASan + UBSan on the production native path, which
      # is what surfaced the UBs above.
      - name: Run the gate on gen1 (native, ASan + UBSan)
        env:
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=0:quarantine_size_mb=64:malloc_context_size=5
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ./bin/teko . -o gen2-asan --no-verify --release

      # The native gate above already ASan-covers the whole native BUILD pipeline (tk_emit_c /
      # cg_lift_program / tk_emit_tsym / run_cc) — that heavy allocation traffic through the arena is
      # exactly what surfaced the __int128 under-alignment and the trait-vtable UB. Additionally build
      # every regressions fixture natively with the SANITIZED compiler to widen the corpus of language
      # constructs exercised under ASan — that is how the lift-pass use-after-free in tk_emit_tsym
      # (freed items list read for the .tsym map; crashed glibc builds of any project with a
      # non-capturing lambda) is caught. Leak detection off: the front-end deliberately holds
      # compiler-lifetime allocations it never frees (core.h S0).
      - name: Native-build regressions fixtures (ASan + UBSan)
        env:
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          out="$(mktemp -d)"
          for proj in examples/regressions/*/; do
            ls "$proj"*.tkp >/dev/null 2>&1 || continue
            if [ -f "${proj}EXPECT_COMPILE_FAIL" ]; then echo "== skip ${proj} (EXPECT_COMPILE_FAIL — negative fixture, nothing to sanitize)"; continue; fi
            echo "== teko build $proj"
            ./bin/teko build "$proj" -o "$out/$(basename "$proj")" --no-verify --release
          done

  # ── TSan (Thread Sanitizer): BUILD + SMOKE ────────────────────────────────────
  # TSan runs build + smoke while the codebase is single-threaded (TSan finds no races
  # without threads; the mem-paranoid + main ASan lanes run the full suite). RESTORE the
  # full `teko test .` gate under TSan INCREMENTALLY as the concurrency surface lands —
  # async/await, routines, teko::threading::run, parallelism, channels, teko::sync
  # (S8/ASYNC, ROUND 5). Mandatory checklist item on every concurrency PR.
  #
  # Rationale (user-ratified, supersedes issue #127's full-suite-under-TSan approach):
  # the test path is 100% SINGLE-THREADED today — ZERO pthread/thread/atomic/spawn in
  # src/ (verified by grep). With no threads, TSan has no race to find: running the full
  # 614-test suite under `-fsanitize=thread` produces NO additional coverage over the
  # other lanes (which DO run the full suite and pass) and only exposes the suite to
  # environmental flake — the intermittent exit-143 (silent SIGTERM) that blocked
  # unrelated PRs (#125, #126) was a RESOURCE/SLOWNESS kill on the slowest lane, never a
  # data race or deadlock (the suite completes cleanly and deterministically both locally
  # and on healthy runners). This is NOT a quarantine and loses NO real coverage: right-
  # sizing the lane to BUILD + a race-clean SMOKE keeps exactly what TSan can still
  # meaningfully assert on a single-threaded codebase, while removing the redundant,
  # flake-prone full run.
  #
  # What still runs here:
  #   1. BUILD the compiler under `-fsanitize=thread` — this catches TSan-build breakage
  #      (instrumentation/flag incompatibilities) the moment it is introduced, so the day
  #      threading lands the TSan toolchain is already known-good.
  #   2. SMOKE: use the TSan-built `teko` to BUILD one small existing regression fixture
  #      (examples/regressions/cwd_build) and RUN the produced binary, asserting
  #      its deterministic exit code (6). This proves the runtime executes race-clean
  #      under TSan end-to-end (front-end -> C -> host cc -> execute) on a real program
  #      that does actual work (cross-file UTF-8 codepoint operations, the #64 CWD-relative
  #      invocation shape project-regressor).
  # The #128 reliability guards are kept on the smoke run: the `timeout` wrapper makes any
  # residual stall FAIL LOUD (exit 124) at a known bound instead of a silent SIGTERM (143),
  # and the bounded TSAN_OPTIONS keep TSan correct for FUTURE threading bugs while capping
  # its footprint. Job timeout 45 min: the seed-fallback STAGED bootstrap (probe walk +
  # gen1 + ladder rung + tip, each TSan-instrumented) demonstrably needs >15 min on a
  # stacked-train tip — the old 15-min backstop killed the build mid-ladder twice at
  # exactly ~15:00 (GitHub reports the step as "cancelled").
  tsan:
    name: TSan
    needs: changes
    if: needs.changes.outputs.run == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang

      - name: Provision teko from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci_provision_teko.sh linux-x86_64

      # scripts/build_with_seed_fallback.sh (owner ruling 2026-07-24): bootstraps through
      # gen1(main) when the raw seed cannot compile the tip directly.
      - name: Build gen1 under TSan (cc wrapper)
        run: |
          sh scripts/ci_cc_wrap.sh "-fsanitize=thread -fno-omit-frame-pointer -g"
          sh scripts/build_with_seed_fallback.sh bin

      # SMOKE (not the full suite — see the BUILD + SMOKE rationale above; RESTORE the
      # full `teko test .` gate under TSan as the concurrency surface lands). Build ONE
      # tiny race-clean fixture with the TSan-built compiler and RUN it, asserting the
      # fixture's deterministic exit code (5). `timeout` (coreutils, always on
      # ubuntu-latest) makes any stall fail loud (exit 124) at a known bound instead of a
      # silent runner SIGTERM (143); bounded TSAN_OPTIONS cap the footprint on a
      # memory-tight runner while staying correct for FUTURE threading bugs.
      - name: Smoke (TSan build+run of one regression fixture)
        env:
          # Single-threaded workload: keep TSan correct for FUTURE threading bugs, but
          # bound its footprint so a memory-tight runner flushes instead of OOM-killing.
          TSAN_OPTIONS: halt_on_error=1:history_size=2:memory_limit_mb=6000:flush_memory_ms=2000
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          proj="examples/regressions/cwd_build"   # tiny; deterministically exits 6
          echo "== teko build $proj (TSan)"
          timeout --kill-after=30s 600s ./bin/teko build "$proj" -o "$out" --no-verify --release | tee build.log
          bin="$(sed -n 's/.*: built //p' build.log | tail -n1)"
          if [ -z "$bin" ] || [ ! -x "$bin" ]; then
            echo "ERROR: could not locate the built binary from the TSan build output." >&2
            exit 1
          fi
          echo "== run $bin (TSan) — expecting deterministic exit code 6"
          set +e
          timeout --kill-after=30s 600s "$bin"
          code=$?
          set -e
          if [ "$code" -ne 6 ]; then
            echo "ERROR: TSan smoke run exited $code, expected 6 (race/abort/timeout/divergence)." >&2
            exit 1
          fi
          echo "TSan smoke passed: build + run race-clean, exit code 6 as expected."

  # ── Windows self-host smoke ───────────────────────────────────────────────────
  # The ONLY per-PR lane that self-builds gen-1 on Windows (build-test only runs the
  # seed's VM gate; diff-vm-native is linux+macos; release rebuilds Windows only at
  # release time). It proves gen-1 SELF-BUILDS on Windows and the produced binary RUNS;
  # test EXECUTION is off here for now (owner ruling 2026-07-14 — the build is too slow to
  # also run the suite under the cap) and lives on the Linux/macOS lanes until the compiler-
  # speed work lands. RE-ADD the Windows test run (and a real stress N×) as the build time
  # drops / S8 concurrency primitives land (same trigger as the TSan full-suite re-expansion).
  windows-selfhost:
    name: Windows self-host smoke (gen-1)
    needs: changes
    if: needs.changes.outputs.run == 'true' && needs.changes.outputs.full == 'true'
    runs-on: windows-latest
    # The gen1 BUILD alone is ~11 min on the Windows runner (the slow-compiler perf problem the perf
    # phase is fixing). The full `teko test .` self-host on top of that blew both the 20- and (mid-
    # suite) 30-min caps, so per owner ruling 2026-07-14 the Windows lane DROPS test execution for now
    # and only proves gen1 self-builds + the binary runs (version smoke). Tests come back to Windows
    # once the compiler-speed work (-O2 seed + churn/arena) brings the build time down. With just the
    # build + smoke, 20 min is ample. Kept on the lane light tier (not main-only) BECAUSE it guards the
    # Windows-specific codegen (emit_native_win / PE-COFF) this wave develops.
    timeout-minutes: 100
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provision teko from the latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci_provision_teko.sh windows-x86_64

      # scripts/build_with_seed_fallback.sh (owner ruling 2026-07-24): bootstraps through
      # gen1(main) when the raw seed cannot compile the tip directly. Runs under Git Bash on
      # this Windows runner, same as every other step on this lane.
      - name: Build gen1 (seed compiles the PR sources)
        shell: bash
        run: sh scripts/build_with_seed_fallback.sh bin

      # Tests are NOT run on Windows for now (owner ruling 2026-07-14): the full `teko test .`
      # self-host on top of the ~11-min gen1 build blew the cap. Until the compiler-speed work
      # brings the build time down, this lane only proves gen1 SELF-BUILDS on Windows (the step
      # above) and that the produced binary RUNS (the version smoke below). The authoritative
      # test suite runs on the Linux/macOS lanes.
      - name: Smoke — gen1 binary runs
        shell: pwsh
        run: |
          .\bin\teko.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # ── gate: aggregates tsan + windows-selfhost, and ASSERTS THE MODE ─────────────
  # Stable required-check name for the branch ruleset. BOTH lanes it aggregates are full-only (90-
  # and 100-min budgets), so on the light path this gate's contract is "both SKIPPED" — and it says
  # so out loud instead of passing by default. J3: a gate that reads `skipped` as approval turns one
  # broken `if:` into a silent hole; here a full-mode skip is an ERROR, and a light-mode success is
  # a warning (a wrong condition, but nothing hidden).
  gate:
    name: Sanitizer gate
    runs-on: ubuntu-latest
    needs: [changes, tsan, windows-selfhost]
    if: always()
    permissions: {}

    steps:
      - name: Evaluate results
        env:
          CHANGES: ${{ needs.changes.outputs.run }}
          FULL: ${{ needs.changes.outputs.full }}
          TSAN: ${{ needs.tsan.result }}
          WINDOWS_SELFHOST: ${{ needs.windows-selfhost.result }}
        run: |
          set -u
          if [ "$FULL" = "true" ]; then MODE=full; else MODE=light; fi
          echo "mode=$MODE"
          echo "changes.run      = $CHANGES"
          echo "tsan             = $TSAN   (full only)"
          echo "windows-selfhost = $WINDOWS_SELFHOST   (full only)"

          if [ "$CHANGES" != "true" ]; then
            echo "No relevant files changed — gate passes."
            exit 0
          fi

          FAILED=0
          require_full_only() {
            if [ "$MODE" = "full" ]; then
              [ "$2" = "success" ] && return 0
              echo "ERROR: $1 = $2 (full mode requires success)"
              FAILED=1
              return 0
            fi
            [ "$2" = "skipped" ] && return 0
            echo "::warning::$1 = $2 on the light path — expected skipped; check its \`if:\` condition."
          }
          require_full_only tsan             "$TSAN"
          require_full_only windows-selfhost "$WINDOWS_SELFHOST"

          if [ "$FAILED" = "1" ]; then
            echo "Sanitizer gate FAILED (mode=$MODE)."
            exit 1
          fi
          echo "Sanitizer gate passed (mode=$MODE)."
          exit 0

  # ── gate: HEAVY aggregator — the memory/UB audit at the landing ────────────────
  # Aggregates asan-default (ASan+UBSan+LSan) AND mem-paranoid (TEKO_MEM_PARANOID never-reuse
  # self-host). Both were DEAD until 2026-07-25 — they gated on `github.ref == 'refs/heads/main'`
  # in a workflow with only a `pull_request` trigger, so the condition never matched and this
  # aggregator was vacuously green. They now run on the PR whose BASE is main, and this gate
  # DEMANDS the result the mode implies: `success` from both in full mode, `skipped` from both on
  # the light path. A skip in full mode is an ERROR — that is exactly the failure that hid here
  # for months.
  heavy-gate:
    name: Heavy sanitizer gate (main)
    runs-on: ubuntu-latest
    needs: [changes, asan-default, mem-paranoid]
    if: always()
    permissions: {}

    steps:
      - name: Evaluate results
        env:
          CHANGES: ${{ needs.changes.outputs.run }}
          FULL: ${{ needs.changes.outputs.full }}
          ASAN_DEFAULT: ${{ needs.asan-default.result }}
          MEM_PARANOID: ${{ needs.mem-paranoid.result }}
        run: |
          set -u
          if [ "$FULL" = "true" ]; then MODE=full; else MODE=light; fi
          echo "mode=$MODE"
          echo "changes.run  = $CHANGES"
          echo "asan-default = $ASAN_DEFAULT   (full only)"
          echo "mem-paranoid = $MEM_PARANOID   (full only)"

          if [ "$CHANGES" != "true" ]; then
            echo "No relevant files changed — heavy gate passes."
            exit 0
          fi

          FAILED=0
          require_full_only() {
            if [ "$MODE" = "full" ]; then
              [ "$2" = "success" ] && return 0
              echo "ERROR: $1 = $2 (full mode requires success — a skip here is the bug this gate used to hide)"
              FAILED=1
              return 0
            fi
            [ "$2" = "skipped" ] && return 0
            echo "::warning::$1 = $2 on the light path — expected skipped; check its \`if:\` condition."
          }
          require_full_only asan-default "$ASAN_DEFAULT"
          require_full_only mem-paranoid "$MEM_PARANOID"

          if [ "$FAILED" = "1" ]; then
            echo "Heavy sanitizer gate FAILED (mode=$MODE)."
            exit 1
          fi
          echo "Heavy sanitizer gate passed (mode=$MODE)."
          exit 0
