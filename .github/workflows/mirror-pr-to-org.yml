# .github/workflows/mirror-pr-to-org.yml
# Org-PR creator/updater for the promotion `schivei:main -> teko-org:main` (main-first era).
#
# AUTOMATED path (owner design 2026-07-23): the bump PR (branch `bump/v*`) carries the
# `teko.tkp` version bump PLUS `docs/bump_v<version>.md` — first line = the org PR TITLE,
# rest = the org PR BODY (meeting the PR-corpus requirements). When that PR squash-merges,
# the push to main (paths: teko.tkp + docs/bump_v*.md) fires this workflow, which reads the
# bump file for the CURRENT teko.tkp version and opens/updates the org PR.
#
# MANUAL path (workflow_dispatch) remains: empty inputs -> read the bump file exactly like
# the push path; filled inputs -> override title/body.
#
# LOCK: never runs on the org (repository guard) — after equalization this file exists on
# the org's main and the equalization push WOULD match the paths there; the guard kills it.
# REQUIRES the repo secret `ORG_PR_TOKEN` (pull-requests:write on teko-org/teko-lang).
name: Mirror PR to org

on:
  push:
    branches: [main]
    paths: ['teko.tkp', 'docs/bump_v*.md']
  workflow_dispatch:
    inputs:
      title:
        description: "Título do PR na org (vazio = 1ª linha de docs/bump_v<versão>.md)"
        required: false
        type: string
        default: ""
      body:
        description: "Descritivo markdown (vazio = resto do bump md)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: mirror-org-main
  cancel-in-progress: false

jobs:
  mirror:
    # Org-lock absoluto: nunca executa em teko-org (o push de equalização lá casaria os paths).
    if: github.repository == 'schivei/teko-lang'
    runs-on: ubuntu-latest
    env:
      ORG: teko-org/teko-lang
      BR: main
      IN_TITLE: ${{ inputs.title }}
      IN_BODY: ${{ inputs.body }}
    steps:
      - name: Guard — org secret present
        env:
          ORG_TOKEN: ${{ secrets.ORG_PR_TOKEN }}
        run: |
          set -eu
          if [ -z "${ORG_TOKEN:-}" ]; then
            echo "::error::ORG_PR_TOKEN secret is required (pull-requests:write on $ORG)."
            exit 1
          fi

      - name: Checkout (read teko.tkp + the bump doc)
        uses: actions/checkout@v4

      - name: Resolve title/body (inputs override; else docs/bump_v<version>.md)
        run: |
          set -eu
          TITLE_FILE="$RUNNER_TEMP/title.txt"
          BODY_FILE="$RUNNER_TEMP/body-src.md"
          if [ -n "${IN_TITLE:-}" ]; then
            printf '%s' "$IN_TITLE" > "$TITLE_FILE"
            printf '%s' "${IN_BODY:-}" > "$BODY_FILE"
            echo "Fonte: inputs do dispatch."
          else
            V="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' teko.tkp | head -1)"
            F="docs/bump_v${V}.md"
            if [ ! -f "$F" ]; then
              echo "::error::bump doc '$F' não encontrado — o PR de bump deve conter teko.tkp (version=$V) E $F (1ª linha = título do PR da org; resto = descritivo)."
              exit 1
            fi
            head -1 "$F" | sed 's/^#\{1,\} *//' > "$TITLE_FILE"
            # O bloco <!-- train-manifest --> é escrituração INTERNA do trem (branches +
            # SHAs de embarque, consumidos pelo job drain-cleanup, que lê o ARQUIVO). Ele
            # não pode entrar no corpo do PR da org: é comentário HTML, não renderiza, mas
            # fica no fonte de um PR público. Strip aqui, na fronteira de saída.
            tail -n +2 "$F" | sed '/<!--[[:space:]]*train-manifest/,/-->/d' > "$BODY_FILE"
            echo "Fonte: $F (version $V)."
          fi
          if [ ! -s "$TITLE_FILE" ]; then
            echo "::error::título vazio (1ª linha do bump doc ou input 'title')."
            exit 1
          fi

      - name: Open (or update) the cross-fork org PR (fork:main -> org:main)
        env:
          GH_TOKEN: ${{ secrets.ORG_PR_TOKEN }}
        run: |
          set -eu
          FORK_OWNER="${GITHUB_REPOSITORY%%/*}"
          TITLE="$(cat "$RUNNER_TEMP/title.txt")"
          BODY_FILE="$RUNNER_TEMP/org-pr-body.md"
          {
            cat "$RUNNER_TEMP/body-src.md"
            printf '\n\n---\n'
            printf 'Mirrored from %s (%s:%s -> %s) — %s.\n' \
              "$GITHUB_REPOSITORY" "$FORK_OWNER" "$BR" "$BR" "${GITHUB_EVENT_NAME}"
          } > "$BODY_FILE"
          EXIST="$(gh pr list --repo "$ORG" --state open --base "$BR" \
                     --json number,headRefName,headRepositoryOwner \
                     --jq "[.[] | select(.headRefName==\"$BR\" and .headRepositoryOwner.login==\"$FORK_OWNER\")][0].number" \
                     2>/dev/null || true)"
          if [ -n "${EXIST:-}" ] && [ "$EXIST" != "null" ]; then
            gh pr edit "$EXIST" --repo "$ORG" --title "$TITLE" --body-file "$BODY_FILE"
            echo "Updated org PR #$EXIST ($FORK_OWNER:$BR -> $BR)"
          else
            gh pr create --repo "$ORG" \
              --head "${FORK_OWNER}:${BR}" --base "$BR" \
              --title "$TITLE" --body-file "$BODY_FILE" --draft
            echo "Opened org draft PR ($FORK_OWNER:$BR -> $BR)"
          fi

  # ── limpeza pós-dreno (owner 2026-07-25) ──────────────────────────────────────
  # O mesmo push que dispara o mirror é o instante em que o TREM ATERRISSOU: a
  # contra-máquina (o vagão do bump, no topo da pilha) foi squash-mergeada na main
  # carregando todos os vagões abaixo dela. Este job faz a faxina: fecha os PRs dos
  # vagões e apaga as branches.
  #
  # POR QUE UM MANIFESTO, E NÃO UM GLOB: apagar por padrão de nome (`feat/0.3.1-*`)
  # varreria qualquer branch nova que alguém tenha criado no meio da onda. O arquivo
  # de bump carrega a lista explícita — é o romaneio de embarque do trem.
  #
  # POR QUE O SHA É A GUARDA: com SQUASH-merge os commits dos vagões NUNCA ficam
  # alcançáveis a partir da main (o squash cria um commit novo), então "esta branch
  # foi mergeada?" não é respondível por ancestralidade. O manifesto grava o head SHA
  # de cada vagão no momento em que o bump foi montado; se o head ATUAL divergir,
  # alguém pushou depois — a branch NÃO é apagada e a divergência é reportada (M.3).
  # Nenhum trabalho não-embarcado é destruído por automação.
  #
  # CONTINUE-ON-ERROR (owner 2026-07-25): é a primeira execução real desta mecânica;
  # uma falha aqui não pode derrubar o mirror nem bloquear a onda. O relatório vai
  # para o STEP SUMMARY, que fica visível mesmo com o passo marcado como falho — a
  # faxina manual continua disponível, e a .32 refina.
  drain-cleanup:
    if: github.repository == 'schivei/teko-lang' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # apagar as refs das branches dos vagões
      pull-requests: write   # comentar e fechar os PRs dos vagões
    steps:
      - name: Checkout (ler o manifesto no bump doc)
        uses: actions/checkout@v4

      - name: Fechar PRs do trem e apagar branches (best-effort)
        id: cleanup
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          V="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' teko.tkp | head -1)"
          F="docs/bump_v${V}.md"
          SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/stdout}"
          echo "## Limpeza pós-dreno — trem v${V}" >> "$SUMMARY"

          if [ ! -f "$F" ]; then
            echo "::error::bump doc '$F' não encontrado — sem manifesto, nada a limpar."
            echo "- ❌ bump doc \`$F\` não encontrado." >> "$SUMMARY"
            exit 1
          fi

          MAN="$RUNNER_TEMP/train-manifest.txt"
          sed -n '/<!--[[:space:]]*train-manifest/,/-->/p' "$F" \
            | grep -E '^[[:space:]]*[0-9]+[[:space:]]+[^[:space:]]+[[:space:]]+[0-9a-f]{7,40}[[:space:]]*$' \
            > "$MAN" || true

          if [ ! -s "$MAN" ]; then
            echo "::notice::nenhum bloco train-manifest em '$F' — nada a limpar."
            echo "- ℹ️ nenhum bloco \`train-manifest\` em \`$F\`; nada a fazer." >> "$SUMMARY"
            exit 0
          fi

          echo "" >> "$SUMMARY"
          echo "| vagão | branch | resultado |" >> "$SUMMARY"
          echo "|---|---|---|" >> "$SUMMARY"

          DIVERGED=0
          while read -r PR BRANCH SHA; do
            [ -n "${PR:-}" ] || continue

            CUR="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq '.object.sha' 2>/dev/null || true)"
            if [ -z "$CUR" ]; then
              echo "| #$PR | \`$BRANCH\` | já removida — nada a fazer |" >> "$SUMMARY"
              continue
            fi

            case "$CUR" in
              "$SHA"*) ;;
              *)
                DIVERGED=$((DIVERGED + 1))
                echo "::warning::branch '$BRANCH' divergiu do manifesto (embarcado ${SHA}, atual ${CUR}) — NÃO apagada."
                echo "| #$PR | \`$BRANCH\` | ⚠️ **divergiu** (embarcado \`$SHA\`, atual \`$CUR\`) — preservada |" >> "$SUMMARY"
                continue
                ;;
            esac

            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" \
              --body "Aterrissou na \`main\` via a contra-máquina do trem v${V} (commit \`${GITHUB_SHA}\`). O trem inteiro entrou numa integração única; este vagão não precisa de merge próprio. Branch removida pela limpeza automática." \
              >/dev/null 2>&1 || true
            gh pr close "$PR" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" >/dev/null 2>&1 || true
            echo "| #$PR | \`$BRANCH\` | ✅ fechado + branch apagada |" >> "$SUMMARY"
          done < "$MAN"

          echo "" >> "$SUMMARY"
          if [ "$DIVERGED" -gt 0 ]; then
            echo "**$DIVERGED branch(es) divergiram do manifesto e foram PRESERVADAS** — alguém pushou depois do bump ser montado. Faxina manual necessária nessas." >> "$SUMMARY"
            exit 1
          fi
          echo "Limpeza completa — nenhuma divergência." >> "$SUMMARY"
