name: Nightly Build

# ══════════════════════════════════════════════════════════════════════════════════════════════
# THE BUILD THAT THE RELEASE PROMOTES.
#
# ── THE RULING IT IMPLEMENTS (owner, quoted verbatim) ─────────────────────────────────────────
# "ao publicar o artefato, publica como '*-nightly', o * troca-se para o número do build que gerou
# o artefato e não da versão, ai precisa ensinar o release a promover o build (gerar a tag de
# versão e republicar os binários com os nomes certos), podendo até apagar esse build na sequência
# (já que não possui tag e é transitório)."
#
# `release.yml` was taught to promote in the previous wagon and has been failing loud at "resolve
# the nightly" ever since, because nothing published one. THIS is what publishes one.
#
# ── ONE PRODUCTION PATH, NOT TWO ──────────────────────────────────────────────────────────────
# Every step that mints an asset lives in scripts/, and pr.yml's `artifact` root runs the SAME
# scripts with the SAME leg table:
#   scripts/ci_producer_matrix.sh  the leg table (which producer, which runner, which assets)
#   scripts/produce_assets.sh      seed → ladder → dry build → native Linux assets → stage/
#   scripts/native_linux_asset.sh  one target-native container build per Linux label
#   scripts/nightly_tag.sh         the exact tag name, shared with release.yml's lookup
# Nothing about production is written twice. That is deliberate and it is the lesson of the
# consolidation wagon: a drift between what CI proved and what the release shipped is the defect
# class this whole redesign exists to close.
#
# ── WHAT GATES THESE BYTES: nightly === gen1 ─────────────────────────────────────────────────
# Owner, 2026-07-26: "Se comparar o nightly ao build `nightly === gen1` não precisa gerar
# artefato, simples, e já é teste de geração."
#
# This workflow does NOT re-run the test suite, and it does not need to. It ASSERTS THE EQUALITY
# instead, and the assertion is both cheaper and stronger than a re-run:
#   * CHEAPER — comparing digests costs seconds; re-running the suite costs the suite.
#   * STRONGER — a re-run would re-prove what the pull request already proved. The equality proves
#     something NOTHING in this repository proves today: that a fixed tree builds to fixed bytes
#     ACROSS runs and ACROSS machines. The self-host fixpoint proves gen2 == gen3 *within* one
#     execution; this is the between-executions property, and it is exactly what makes "promote
#     instead of recompile" safe rather than an act of faith.
#
# The `reproducibility` job below carries it. It measures all three antecedents — tree, seed,
# toolchain — so an honest difference is attributed by name and only an unexplained one goes red.
# Nothing publishes until it passes.
#
# ── SCOPE GUARD ───────────────────────────────────────────────────────────────────────────────
# Only the two repositories that are actually part of this train publish. Same shape as
# seed-linux-fork.yml's guard, and for the same reason: a random fork of this repo must never
# start minting releases into its own namespace just because it inherited a workflow file.
# ══════════════════════════════════════════════════════════════════════════════════════════════
on:
  push:
    # BOTH TAGGING CHANNELS, because both of them mint version tags that this build must be
    # promotable into: `main` is the stable line, and `remodel/**` is the wave umbrella's
    # INTERMEDIATE BETA SEED line (see tag-on-version-bump.yml's header — every sub-PR merged
    # into an umbrella bumps the build field and mints a `-beta` tag). A nightly that covered only
    # main would leave every umbrella tag with nothing to promote.
    branches:
      - main
      - 'remodel/**'
    # Same allowlist the PR workflow triggers on. A push that changes only prose does not need a
    # new set of binaries — the previous nightly still describes the same compiler.
    paths: ['**.tkp', '**.tks', '**.tkt', '**.tkr', '**.sh', '**.c', '**.h', '.github/workflows/*.yml', 'bootstrap/**']
  workflow_dispatch:

# Creating the prerelease (and its tag) needs contents: write.
permissions:
  contents: read

# Keyed on the COMMIT, and deliberately NOT cancel-in-progress. Cancelling an in-flight nightly
# when a newer commit lands would leave the older commit without a build — and if a version tag is
# ever pushed at that commit, the release would find nothing to promote. Serialising re-runs of the
# same sha is all that is wanted here.
concurrency:
  group: nightly-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # ── plan: the leg table and the tag, decided once ─────────────────────────────────────────
  # ALWAYS FULL. A nightly that minted fewer than seven assets would leave the release able to
  # promote only part of a set, which is worse than not publishing at all: the release would look
  # successful and ship an incomplete platform matrix.
  plan:
    # ORG ONLY, MIRRORING release.yml (owner ruling 2026-07-30: *"release é da org, ponto. Só fazer o
    # mesmo para o fork"*). This used to allow BOTH repos, and the mismatch is what produced the
    # garbage the owner reported: the fork BUILT a full nightly on every push to main/remodel, then
    # its `publish` job died with `HTTP 403: Resource not accessible by integration` because the
    # release-publishing credentials live on the org — so the fork burned six legs of CI per push and
    # published nothing, and a real promotion had to be done by hand.
    #
    # release.yml has carried the org-only guard since 2026-07-18 ("a fork has no nightly and no
    # business publishing"). The nightly simply never got the same line, and a build whose only
    # consumer refuses to run on this repo is waste by construction. Nothing is lost by stopping it
    # here: the PR workflow already proves all six assets build, WITH gates, on this fork.
    if: github.repository == 'teko-org/teko-lang'
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.decide.outputs.matrix }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide (producer matrix + the exact nightly tag)
        id: decide
        shell: bash
        run: |
          set -eu
          M="$(sh scripts/ci_producer_matrix.sh full)"
          echo "matrix=$M" >> "$GITHUB_OUTPUT"
          echo "producer matrix: $M"

          # THE TAG. Derived by the same script release.yml calls to look it up — see
          # scripts/nightly_tag.sh for why a shared derivation is not optional here.
          T="$(sh scripts/nightly_tag.sh "$GITHUB_SHA")"
          echo "tag=$T" >> "$GITHUB_OUTPUT"
          echo "nightly tag: $T (commit $GITHUB_SHA)"

  # ── build: the producers, then packaging ───────────────────────────────────────────────────
  # The producing half is byte-for-byte pr.yml's `artifact` root. The packaging half is what
  # differs, and it is only a difference in what is DONE with the result: pr.yml uploads the bare
  # staged binaries for its test legs to download, this uploads release archives.
  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: nightly / ${{ matrix.producer }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Named BEFORE the first step that can fail on a missing tool, so a red run says WHICH
      # toolchain was present instead of leaving the reader to infer it from a cc error deep
      # inside a build log.
      - name: Report the host toolchain (diagnostic — never fails the job)
        shell: bash
        run: |
          for t in cc clang gcc file xz unzip tar curl python3 7z musl-gcc; do
            printf '%-8s ' "$t"
            command -v "$t" || echo '(absent)'
          done

      # SAME STEP, SAME REASONING, AS pr.yml's `artifact` root (restriction: release and PR must
      # move together, or they silently diverge on what "the musl asset" means). See
      # scripts/native_linux_asset.sh's header for why this is a workflow step and not script
      # logic, and why a red step here is the intended fail-loud, not a bug.
      - name: Install musl-tools (the musl asset's native, non-container toolchain)
        if: endsWith(matrix.producer, '-musl')
        shell: bash
        run: |
          set -eu
          sudo apt-get update -y
          sudo apt-get install -y musl-tools
          musl-gcc --version

      # THE SHARED PRODUCTION PATH — identical call to the one pr.yml's `artifact` root makes.
      - name: Produce this leg's assets (seed → ladder → dry build → native assets → stage)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ matrix.kind }}
          SEED: ${{ matrix.seed }}
          PRODUCES: ${{ matrix.produces }}
        run: sh scripts/produce_assets.sh "$KIND" "$SEED" $PRODUCES

      # ── packaging ────────────────────────────────────────────────────────────────────────────
      # scripts/package_release.sh is the SAME packer the releases have always used, so the
      # archive layout, the binary name inside it and the per-platform container (.tar.gz vs .zip)
      # are unchanged by this workflow existing. It wants a directory holding the binary AND the
      # `teko.c` it was compiled from, which is exactly what the production step leaves behind.
      #
      # EMIT_SRC_BUNDLE fires for EXACTLY ONE label. The portable bootstrap snapshot is the same
      # on every platform — the emitted teko.c is byte-identical across architectures, which
      # pr.yml's `cross-arch-determinism` lane asserts on every full run — so it is published once.
      - name: Package the assets this producer minted
        shell: bash
        env:
          PRODUCES: ${{ matrix.produces }}
        run: |
          set -eu
          rm -rf pkg dist
          mkdir -p dist
          for label in $PRODUCES; do
            d="pkg/$label"
            mkdir -p "$d"
            cp stage/"$label"/teko "$d/teko" 2>/dev/null || cp stage/"$label"/teko.exe "$d/teko.exe"
            cp out/teko.c "$d/teko.c"
            case "$label" in
              windows-*) ostype=windows ;;
              *)         ostype=posix ;;
            esac
            bundle=0
            [ "$label" = "linux-x86_64-glibc" ] && bundle=1
            EMIT_SRC_BUNDLE="$bundle" sh scripts/package_release.sh "$label" "$d" src dist "$ostype"
          done
          echo "=== dist/ ==="
          ls -la dist/

      - name: Upload this producer's archives
        uses: actions/upload-artifact@v4
        with:
          name: nightly-dist-${{ matrix.producer }}
          path: dist/
          if-no-files-found: error
          retention-days: 3

      # The RAW binaries + their PROVENANCE, for the reproducibility gate below. Kept separate from
      # the archives on purpose: `publish` must upload exactly the release assets and nothing else,
      # and the gate wants bytes it can digest directly rather than bytes it has to untar first.
      - name: Upload this producer's raw assets + provenance (for the reproducibility gate)
        uses: actions/upload-artifact@v4
        with:
          name: nightly-stage-${{ matrix.producer }}
          path: stage/
          if-no-files-found: error
          retention-days: 3

  # ══ reproducibility — THE NIGHTLY'S OWN GATE ════════════════════════════════════════════════
  # ── THE RULING (owner, 2026-07-26) ────────────────────────────────────────────────────────────
  # "Se comparar o nightly ao build `nightly === gen1` não precisa gerar artefato, simples, e já é
  # teste de geração."
  #
  # THE NIGHTLY IS gen1. It is not a second thing built beside the one CI validated — it is the
  # same build, of the same tree, on a second machine at a second moment. Saying so is cheap
  # (compare digests) and it REPLACES re-running the suite, which is expensive and would only
  # re-prove what the PR already proved.
  #
  # ── WHAT IT PROVES THAT NOTHING ELSE DOES ─────────────────────────────────────────────────────
  # The self-host fixpoint proves gen2 == gen3 WITHIN one execution. This proves reproducibility
  # BETWEEN executions and BETWEEN machines: same tree, two runners, two moments, the same bytes.
  # That property is precisely what makes "promote instead of recompile" safe rather than an act of
  # faith — and today nothing in this repository checks it.
  #
  # ── THE LAW, STATED AS AN IMPLICATION AND NOT AS A SLOGAN ─────────────────────────────────────
  #
  #     same tree  +  same seed  +  same toolchain   ⇒   same bytes
  #
  # All three antecedents are MEASURED here, never assumed, because each of them really can differ
  # for an honest reason and a gate that could not tell those apart would either cry wolf or hide a
  # defect:
  #
  #   TREE       squash-merge preserves the tree, so the merged commit's tree should equal the PR
  #              head's. It does NOT when the base moved and the PR was not brought up to date —
  #              the PR's CI checks out `refs/pull/N/merge`, i.e. head merged into base, which is a
  #              third tree. Compared via the git trees, and a mismatch is REPORTED, never red.
  #   SEED       gen0 is `seed(tree)` and gen1 is `gen0(tree)`, so the assets descend from the seed
  #              two links up. ci_provision_teko.sh takes the NEWEST released seed, which
  #              is a function of WHEN the lane ran. On a train that cuts a release per bump, a
  #              seed change between a PR's run and its merge is ORDINARY — and it is the single
  #              most likely honest explanation for two builds of one tree disagreeing.
  #   TOOLCHAIN  the Linux assets are built in pinned container images, but the tags are mutable
  #              and can be re-pointed under a build; the macOS/Windows assets are
  #              built by the runner's own clang, pinned by nothing and rotated with the image.
  #
  # WHEN ALL THREE MATCH AND THE BYTES DIFFER, THAT IS THE DEFECT — non-determinism in the build of
  # a fixed tree — and this job goes RED. That is the only condition under which it fails.
  #
  # ── AND THE DIAGNOSIS IS ALREADY BISECTED ─────────────────────────────────────────────────────
  # Both sides carry `teko_c_sha256` in their provenance. teko.c is what gen0 emitted while
  # producing gen1; each asset is that C compiled. So a disagreement is localised without further
  # work: teko.c differing means the FRONT half moved (seed, degrau or ladder rung); teko.c
  # matching while the bytes differ means the BACK half moved (the C toolchain).
  #
  # ── WHAT IT CANNOT COMPARE, ENUMERATED RATHER THAN SHRUGGED AT ────────────────────────────────
  # A "could not compare" outcome is not allowed to be a shrug — that is the vacuous green this
  # train has spent two wagons closing. Every non-comparison is attributed to ONE named, separately
  # verified cause and printed as a warning:
  #   * the push does not resolve to a merged PR (a direct push) — exit 3 from the resolver;
  #   * the PR's run predates the artifacts' retention and they are gone — the download fails;
  #   * the PR ran the LIGHT tier and simply never produced that label — the label is absent from
  #     an otherwise present download.
  # The last one is worth reading twice: on the light tier only two of seven assets exist to compare,
  # so this gate's reach is exactly as wide as the light/full criterion makes it.
  reproducibility:
    needs: [plan, build]
    name: reproducibility (nightly === gen1 of the gated PR)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read          # required to download another workflow run's artifacts
      pull-requests: read    # required to resolve the merge commit back to its PR
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: This run's own assets
        uses: actions/download-artifact@v4
        with:
          pattern: nightly-stage-*
          merge-multiple: true
          path: now

      # WHICH RUN GATED THIS COMMIT — resolved, never guessed. scripts/originating_pr_run.sh is the
      # SAME resolver tag-on-version-bump.yml's release gate uses, so the two workflows can never
      # disagree about which run stands behind a commit.
      - name: Resolve the pull request run that gated this commit
        id: origin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          rc=0
          OUT="$(sh scripts/originating_pr_run.sh "$GITHUB_SHA" "Pull Request CI")" || rc=$?
          printf '%s\n' "$OUT"
          printf '%s\n' "$OUT" >> "$GITHUB_OUTPUT"
          if [ "$rc" = "3" ]; then
            echo "reason=no-originating-pr" >> "$GITHUB_OUTPUT"
          elif [ "$rc" != "0" ]; then
            echo "::error::the originating-PR lookup failed (exit $rc) — cannot verify anything" >&2
            exit 1
          fi

      # `continue-on-error`: an EXPIRED artifact is a legitimate outcome that must be reported, not
      # a failure. The step's result is read below and attributed by name.
      - name: The gated run's published assets
        id: prdl
        if: steps.origin.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: teko-assets-*
          merge-multiple: true
          path: pr
          run-id: ${{ steps.origin.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Assert nightly === gen1
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.origin.outputs.pr }}
          PR_HEAD: ${{ steps.origin.outputs.head_sha }}
          RUN_ID: ${{ steps.origin.outputs.run_id }}
          RUN_CONCLUSION: ${{ steps.origin.outputs.run_conclusion }}
          DL_RESULT: ${{ steps.prdl.outcome }}
        run: |
          set -u
          echo "commit under test : $GITHUB_SHA"
          echo "originating PR    : ${PR_NUMBER:-<none>} (head ${PR_HEAD:-<none>})"
          echo "gating run        : ${RUN_ID:-<none>} (${RUN_CONCLUSION:-<none>})"
          echo "artifact download : ${DL_RESULT:-<not attempted>}"
          echo

          if [ -z "${PR_NUMBER:-}" ]; then
            echo "::warning::this commit does not resolve to a merged pull request, so there is no"
            echo "gated build to compare against. Nothing asserted."
            exit 0
          fi
          if [ -z "${RUN_ID:-}" ]; then
            echo "::warning::no 'Pull Request CI' run exists at the PR head — nothing to compare."
            exit 0
          fi
          if [ "${DL_RESULT:-}" != "success" ]; then
            echo "::warning::the gated run's artifacts could not be downloaded (outcome"
            echo "'${DL_RESULT:-none}'). The usual cause is RETENTION: they are kept 7 days, and"
            echo "this PR's last green run is older than that. Nothing asserted."
            exit 0
          fi

          # ── ANTECEDENT 1: THE TREE ─────────────────────────────────────────────────────────────
          # A mismatch here is not a defect and never reds this job: the PR's CI built
          # `refs/pull/N/merge` (head merged into base), so when the base moved without the branch
          # being brought up to date, three different trees are legitimately in play.
          TREE_NOW="$(git rev-parse "HEAD^{tree}")"
          TREE_PR="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${PR_HEAD}" --jq '.commit.tree.sha' 2>/dev/null || echo unknown)"
          echo "tree (this commit) = $TREE_NOW"
          echo "tree (PR head)     = $TREE_PR"
          SAME_TREE=1
          if [ "$TREE_PR" = "unknown" ] || [ "$TREE_NOW" != "$TREE_PR" ]; then
            SAME_TREE=0
            echo "::warning::the trees differ — the PR's CI built the merge of its head into its"
            echo "base, which is a different tree whenever the base moved. Byte equality is not"
            echo "claimed for a different tree."
          fi
          echo

          COMPARED=0; EQUAL=0; ATTRIBUTED=0; DEFECTS=0
          # prov FILE KEY — read one key out of a PROVENANCE.txt, or `absent`.
          prov() { [ -f "$1" ] && sed -n "s/^$2=//p" "$1" | head -n1 || printf '%s' absent; }

          for d in now/*/; do
            label="$(basename "$d")"
            now_bin="$d/teko"; [ -f "$now_bin" ] || now_bin="$d/teko.exe"
            pr_bin="pr/$label/teko"; [ -f "$pr_bin" ] || pr_bin="pr/$label/teko.exe"
            if [ ! -f "$pr_bin" ]; then
              echo "  --   $label : the gated run never published it (the PR ran the light tier)"
              continue
            fi
            COMPARED=$((COMPARED + 1))
            now_p="$d/PROVENANCE.txt"; pr_p="pr/$label/PROVENANCE.txt"
            n_sha="$(sha256sum "$now_bin" | awk '{print $1}')"
            p_sha="$(sha256sum "$pr_bin"  | awk '{print $1}')"
            if [ "$n_sha" = "$p_sha" ]; then
              EQUAL=$((EQUAL + 1))
              echo "  OK   $label : identical ($n_sha)"
              continue
            fi

            n_seed="$(prov "$now_p" seed_version)";  p_seed="$(prov "$pr_p" seed_version)"
            n_cc="$(prov "$now_p" toolchain_cc)";    p_cc="$(prov "$pr_p" toolchain_cc)"
            n_img="$(prov "$now_p" toolchain_image)"; p_img="$(prov "$pr_p" toolchain_image)"
            n_c="$(prov "$now_p" teko_c_sha256)";    p_c="$(prov "$pr_p" teko_c_sha256)"

            echo "  ??   $label : DIFFERS"
            echo "         nightly sha256 = $n_sha"
            echo "         gated   sha256 = $p_sha"
            echo "         teko.c   : $n_c  vs  $p_c   ($([ "$n_c" = "$p_c" ] && echo 'same => the difference is BELOW teko.c, in the C compile' || echo 'differs => the difference is ABOVE teko.c, in what the seed emitted'))"
            echo "         seed     : $n_seed  vs  $p_seed"
            echo "         cc       : $n_cc  vs  $p_cc"
            echo "         image    : $n_img  vs  $p_img"

            if [ "$SAME_TREE" != "1" ]; then
              ATTRIBUTED=$((ATTRIBUTED + 1))
              echo "         => attributed to the TREE differing. Not a defect."
            elif [ "$n_seed" != "$p_seed" ]; then
              ATTRIBUTED=$((ATTRIBUTED + 1))
              echo "         => attributed to the SEED differing (a release landed between the two"
              echo "            runs; gen1 is seed(tree), so a different seed emits different C)."
              echo "            Not a defect."
            elif [ "$n_cc" != "$p_cc" ] || [ "$n_img" != "$p_img" ]; then
              ATTRIBUTED=$((ATTRIBUTED + 1))
              echo "         => attributed to the TOOLCHAIN differing (a runner image rotated, or a"
              echo "            mutable container tag moved). Not a defect."
            else
              DEFECTS=$((DEFECTS + 1))
              echo "         => NO ANTECEDENT DIFFERS. Same tree, same seed, same toolchain, and yet"
              echo "            different bytes: the build of a fixed tree is NOT reproducible."
              echo "            This is the defect this gate exists to find, and it is exactly what"
              echo "            makes promoting a build instead of rebuilding it unsafe."
            fi
          done

          echo
          echo "compared=$COMPARED  identical=$EQUAL  attributed=$ATTRIBUTED  defects=$DEFECTS"
          if [ "$DEFECTS" -gt 0 ]; then
            echo "::error::nightly !== gen1 for $DEFECTS asset(s) with every antecedent held equal."
            exit 1
          fi
          if [ "$COMPARED" = "0" ]; then
            echo "::warning::nothing was comparable — see the per-label reasons above."
            exit 0
          fi
          echo "nightly === gen1 holds for every comparable asset."

  # ── publish: one prerelease, one exact tag ─────────────────────────────────────────────────
  publish:
    needs: [plan, build, reproducibility]
    name: publish the nightly prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Every producer's archives, merged. Filenames are unique per label, so `merge-multiple`
      # cannot collide.
      - name: Download every producer's archives
        uses: actions/download-artifact@v4
        with:
          pattern: nightly-dist-*
          merge-multiple: true
          path: dist

      # THE COMPLETENESS GATE. A nightly missing an asset is worse than no nightly: the release
      # would promote it, look successful, and ship an incomplete platform matrix. The nine labels
      # plus the portable bootstrap snapshot are named literally here — an independent statement of
      # the requirement, not a count of whatever happened to arrive.
      - name: Assert the nightly is complete, then combine the checksums
        shell: bash
        run: |
          set -eu
          echo "=== as downloaded ==="
          ls -la dist/

          MISSING=""
          for f in teko-linux-x86_64-glibc.tar.gz \
                   teko-linux-x86_64-musl.tar.gz \
                   teko-linux-arm64-glibc.tar.gz \
                   teko-linux-arm64-musl.tar.gz \
                   teko-macos-arm64.tar.gz \
                   teko-windows-x86_64.zip \
                   teko-bootstrap-src.tar.gz; do
            if [ ! -f "dist/$f" ]; then
              MISSING="$MISSING $f"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::the nightly is incomplete — missing:$MISSING" >&2
            echo "Publishing a partial set would let release.yml promote it and ship a platform" >&2
            echo "matrix with holes, with nothing red anywhere to say so." >&2
            exit 1
          fi
          echo "all seven assets + the portable bootstrap snapshot are present"

          # Merge the per-platform checksum files into ONE canonical SHA256SUMS.txt, then discard
          # the per-platform ones — the release regenerates its own over the promoted bytes, and a
          # release carrying eight redundant sums files would just be noise.
          ( cd dist && cat SHA256SUMS-*.txt | sort -u > SHA256SUMS.txt && rm -f SHA256SUMS-*.txt )
          echo "=== SHA256SUMS.txt ==="
          cat dist/SHA256SUMS.txt

      # ── the prerelease ───────────────────────────────────────────────────────────────────────
      # `--target $GITHUB_SHA` pins the tag to the commit these bytes were built from, which is
      # what makes the tag name (which embeds that commit's sha8) TRUE and not merely conventional.
      #
      # IDEMPOTENT: re-running this workflow on the same commit clobbers the assets of the same
      # release rather than failing on an existing tag. That keeps the invariant the promotion
      # depends on — AT MOST ONE nightly per (build number, commit) — which is what makes
      # release.yml's delete step unable to remove the wrong one.
      - name: Publish the nightly prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -eu
          echo "publishing nightly '$TAG' at commit $GITHUB_SHA"
          NOTES="$(printf '%s\n' \
            "Transitory build of \`$GITHUB_SHA\`." \
            "" \
            "This is NOT a release. It is the artifact set a version tag promotes:" \
            "\`release.yml\` looks this tag up by exact name, republishes these exact bytes under" \
            "the version tag, and then deletes this prerelease — it is transitory by construction" \
            "(owner ruling 2026-07-26)." \
            "" \
            "Every Linux artifact is built with the TARGET's own native toolchain; no" \
            "cross-compiler is involved. Do not depend on this tag: it disappears when it is" \
            "promoted.")"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "'$TAG' already exists (a re-run on the same commit) — clobbering its assets."
            gh release upload "$TAG" dist/teko-*.tar.gz dist/teko-*.zip dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "$NOTES"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Nightly $TAG" \
              --notes "$NOTES" \
              --prerelease \
              dist/teko-*.tar.gz dist/teko-*.zip dist/SHA256SUMS.txt
          fi
          echo "published: $(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
