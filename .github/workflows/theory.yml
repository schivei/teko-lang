name: Theory CI

# ══════════════════════════════════════════════════════════════════════════════════════════════
# THEORY CI — two legs, SAME target (Linux x86-64 glibc), one NATIVE and one C.
#
# Each leg runs exactly what pr.yml's linux-x86_64-glibc pipeline runs today — produce_assets.sh
# (seed → ladder/degrau → dry build → native asset → stage) then fixpoint_gate.sh — but on THIS
# theory/** branch's modified source, and with the fixpoint/test backend PINNED per leg instead of
# looked up from the planner. The point is to see, on ONE branch, the native and the C self-host
# results side by side, so which improvement (or which INTERACTION between improvements) breaks the
# native path is isolated by construction rather than guessed at inside the 1181-commit fix/union.
#
# `fail-fast: false` is load-bearing: a red native leg must NOT cancel the green C leg — seeing both
# outcomes together is the entire experiment.
#
# Owner design 2026-08-03: "um CI que roda em push com duas pernas com mesmo alvo (Linux x86-64
# glibc), mas cada uma com um target, um native e outro C, rodando exatamente o que o pr.yml roda
# hoje mas com essas mudanças."
# ══════════════════════════════════════════════════════════════════════════════════════════════

on:
  push:
    branches:
      - 'theory/**'

concurrency:
  group: theory-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  leg:
    name: ${{ matrix.backend }} / linux-x86_64-glibc
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        backend: [native, c]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the object-format parsers the gates read with
        run: |
          sudo apt-get update -y
          sudo apt-get install -y llvm lld

      - name: Report the host toolchain (diagnostic — never fails the job)
        shell: bash
        run: |
          for t in cc clang gcc file python3; do
            printf '%-8s ' "$t"; command -v "$t" || echo '(absent)'
          done
          for t in cc clang gcc; do
            if command -v "$t" >/dev/null 2>&1; then
              printf '%-8s target: ' "$t"; "$t" -dumpmachine 2>/dev/null || echo '(no -dumpmachine)'
            fi
          done

      - name: Produce this leg's asset (seed → ladder → dry build → native asset → stage)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/produce_assets.sh linux linux-x86_64-glibc linux-x86_64-glibc

      # THE RUPTURE POINT. The fixpoint (gen1 rebuilds itself, gen2 == gen3) is the one signal this
      # harness exists for: it is where the native path breaks (a guard refusal or a crash) while the
      # C path holds — or, on a branch that closed the gap, where native finally holds too. Nothing
      # heavier runs here (owner 2026-08-03: "não precisa, em theory, executar o mem paranoid,
      # queremos apenas encontrar pontos de ruptura"); the CI-hygiene fixtures pr.yml runs after the
      # fixpoint are not rupture detectors and are deliberately absent.
      # ONE-OFF H2 narrowing (2026-08-04, wild-write): gen2 native now COMPILES (gate met) but
      # crashes M.1 in the CHECKER phase while building gen3 — before any lowering, so the fat-store
      # guards cannot be on its path (H1 refuted for the residual). Arm the runtime's own H2 aids on
      # the native leg ONLY: TEKO_NATIVE_POISON_FREE reports a corrupted PARKED block + offset at
      # take, TEKO_NATIVE_PUSH_REDZONE catches a push-cache/stale-slot append overrun at its source.
      # The C leg stays clean (both '0') so its byte-identity fixpoint + teko.c harvest are unaffected.
      - name: Fixpoint — gen2 == gen3 over the same source (backend = ${{ matrix.backend }})
        shell: bash
        env:
          TEKO_FIXPOINT_BACKEND: ${{ matrix.backend }}
          TEKO_NATIVE_POISON_FREE: ${{ matrix.backend == 'native' && '1' || '0' }}
          TEKO_NATIVE_PUSH_REDZONE: ${{ matrix.backend == 'native' && '1' || '0' }}
        run: sh scripts/fixpoint_gate.sh out/teko . .fixpoint

      # HARVEST THE FRESH SEED. When the fixpoint HELD, the gate staged gen3.c — this run's
      # candidate for bootstrap/teko.c. The C leg is the reliable producer of a valid teko.c at
      # any commit; uploading it makes this run a seed source for the reseed-and-continue bisection
      # (owner 2026-08-03: "colhe a que a lane C reportou verde e semeia, até que ambas fiquem
      # verdes"). Only runs on a fixpoint that passed — a crash leaves nothing worth harvesting.
      - name: Harvest this leg's emitted teko.c (only over a fixpoint that held)
        if: ${{ success() }}
        shell: bash
        run: |
          set -eu
          mkdir -p harvest
          [ -f .fixpoint/gen3.c ] && cp .fixpoint/gen3.c harvest/teko.c || true
          [ -f out/teko.c ] && cp out/teko.c harvest/out-teko.c || true
          ls -la harvest/ || true

      - name: Upload the harvested teko.c (the reseed candidate)
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: harvest-teko-c-${{ matrix.backend }}
          path: harvest
          if-no-files-found: warn
          retention-days: 7
