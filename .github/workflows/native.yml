name: Native Build & Test

# CI runs on PULL REQUESTS (the per-PR gate) plus PUSHES to remodel/** integration branches.
# Branch protection requires the PR checks green before a PR can merge, so every commit that
# reaches main was already 100% green — re-running the full suite on the post-merge push would
# only duplicate that work and burn pipeline minutes. The release trusts this and builds from a
# main tag WITHOUT re-validating (see release.yml). chore/reboot stays listed so PRs targeting the
# integration branch still get checks (#54). The nightly VM-regression SCHEDULE trigger is retired
# with the VM CI lane itself (issue #524) — native is now the sole engine, gated on every PR.
on:
  pull_request:
    branches: ['**']   # '**' cruza '/' — casa base com barra (remodel/...); '*' simples nao
    # `bootstrap/**` is listed because the committed host seeds (TRANSITIONAL — .31 only) are
    # `.xz` blobs plus a checksum manifest: none of the extension globs above reach them, so a PR
    # that touched ONLY a seed would have skipped the very lanes that provision from it.
    paths: ['**.tkp', '**.tks', '**.tkt', '**.tkr', '**.sh', '**.c', '**.h', '.github/workflows/*.yml', 'bootstrap/**']

# Restrict default token scope for all jobs in this workflow.
permissions:
  contents: read

jobs:
  # ── path filter ──────────────────────────────────────────────────────────────
  # PR-only: the paths-filter needs a pull_request context, so this job — and every
  # job that `needs: changes` — only runs on pull_request events.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
      # LIGHT vs FULL (owner proposal 2026-07-24): `full` is true only for a PR whose BASE is main
      # — the wagon that LANDS a stacked train, or a hotfix. Every intermediate wagon PR (base = the
      # previous wagon's branch) runs the light path. See docs/design/ci-gates.md.
      full: ${{ steps.decide.outputs.full }}
      matrix_build: ${{ steps.decide.outputs.matrix_build }}
      matrix_gen1: ${{ steps.decide.outputs.matrix_gen1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          list-files: shell
          filters: |
            run:
              - 'src/**'
              - 'tests/**'
              - 'examples/**'
              - 'scripts/**'
              - 'bootstrap/**'
              - '.github/workflows/native.yml'

      # Docs-only guard (owner ruling 2026-07-11): the allowlist globs (src/**, tests/**, …)
      # also match Markdown that lives INSIDE those trees (e.g. src/checker/capability_audit.md),
      # so a pure-documentation edit would otherwise trigger the whole heavy gate. Skip only when
      # EVERY matched file is *.md — any single non-Markdown match still forces the full run, so
      # this can never hide a real source change from the gate (fail-safe: it can under-skip, never
      # over-skip). A trigger-level `paths-ignore` is deliberately NOT used here: the `gate` job is
      # a REQUIRED status check, and skipping the whole workflow would leave it never reported →
      # the PR would hang "waiting for CI gate". The always-running gate + this filter is the fix.
      #
      # The MODE + the two dynamic matrices are emitted FIRST, unconditionally: the docs-only
      # branch below exits early, and a consumer job's `strategy.matrix: ${{ fromJSON(...) }}`
      # must never be handed an empty string. `github.base_ref` is the axis (NOT `github.ref`,
      # which on a pull_request is `refs/pull/N/merge` and never matches a branch name — that
      # exact mistake is the J2 bug this same change fixes in sanitizers.yml).
      - name: Decide (mode + matrices, then skip when the change is Markdown-only)
        id: decide
        shell: bash
        env:
          MATCHED: ${{ steps.filter.outputs.run }}
          FILES: ${{ steps.filter.outputs.run_files }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$BASE_REF" = "main" ]; then full=true; else full=false; fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "mode: $([ "$full" = "true" ] && echo full || echo light) (base_ref='$BASE_REF')"

          # WINDOWS RIDES THE LIGHT PATH (integrator ruling 2026-07-25), and it is the one
          # deviation from "light = one ubuntu job per track". The reason is empirical, not
          # taste: the last two wagons of this train failed on Windows and ONLY on Windows —
          # wagon 15 on `Windows self-host smoke`, wagon 16 on `test / windows` (`assert_native`,
          # a weak-symbol seam that PE/COFF does not resolve at all; the check is named
          # `test / windows-x86_64` since tests.yml became a host matrix). Zero
          # linux-only and zero macos-only failures in the same span. A light tier that omits
          # the platform where the defects actually live buys runner minutes with blindness,
          # and defers every Windows break to the landing wagon. macOS stays full-only: it has
          # not caught a wagon-unique failure.
          #
          # windows-arm64 is BACK on the full path (owner ruling 2026-07-26 — see the build-test
          # matrix note below). It is full-only, never light: it is the slowest runner in the set
          # and its delta over windows-x86_64 is the ARCH, not the platform whose defects the
          # light tier is buying.
          LINUX='{"os":"ubuntu-latest","label":"linux-x86_64","full_gate":true}'
          WINDOWS='{"os":"windows-latest","label":"windows-x86_64"}'
          WINDOWS_ARM='{"os":"windows-11-arm","label":"windows-arm64"}'
          GEN1_LINUX='{"os":"ubuntu-latest","label":"linux-x86_64"}'
          if [ "$full" = "true" ]; then
            echo "matrix_build={\"include\":[$LINUX,{\"os\":\"ubuntu-24.04-arm\",\"label\":\"linux-arm64\"},{\"os\":\"macos-latest\",\"label\":\"macos-arm64\"},$WINDOWS,$WINDOWS_ARM]}" >> "$GITHUB_OUTPUT"
            echo "matrix_gen1={\"include\":[$GEN1_LINUX,{\"os\":\"macos-latest\",\"label\":\"macos-arm64\"}]}" >> "$GITHUB_OUTPUT"
          else
            echo "matrix_build={\"include\":[$LINUX,$WINDOWS]}" >> "$GITHUB_OUTPUT"
            echo "matrix_gen1={\"include\":[$GEN1_LINUX]}" >> "$GITHUB_OUTPUT"
          fi

          if [ "$MATCHED" != "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No allowlisted path changed — nothing to gate."
            exit 0
          fi
          run=false
          for f in $FILES; do
            case "$f" in
              *.md) ;;                 # Markdown — does not, by itself, force a run
              *)    run=true ;;        # any non-Markdown match forces the full gate
            esac
          done
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" = "true" ]; then
            echo "Non-Markdown changes present — running the gate."
          else
            echo "Markdown-only change under the allowlisted paths — skipping the heavy gate."
          fi

  # ── matrix: linux-x86_64 + windows-x86_64 (light); + linux-arm64, macos-arm64,
  #           windows-arm64 (full) ────────────────────────────────────────────────
  # NOTE: Windows uses Clang (not MSVC) because the project requires __int128 and
  # other GCC/Clang extensions that MSVC does not support.
  #
  # The matrix is DYNAMIC (`needs.changes.outputs.matrix_build`): the light path builds
  # linux-x86_64 + windows-x86_64 — the signal that actually catches a compiler break, plus the
  # one platform empirically responsible for this train's wagon-unique failures — and the full
  # path (base_ref == main) adds linux-arm64 + macos-arm64 + windows-arm64.
  #
  # windows-arm64 IS BACK IN THIS MATRIX (owner ruling 2026-07-26): "sobre windows-arm64 (e outros
  # hosts), tem que fazer o build inicial e tem que colocar lane de teste se não houverem." That
  # REVERSES the 2026-07-06 exclusion, which rested on cost — this job was the CI critical path on
  # that runner at ~973s (docs/design/compile-time-architecture.md §1.1, run 28763999356). Two
  # things dissolved that premise:
  #   * that 973s was TWO full gates back-to-back — 359s "Test gate (VM)" + 591s "Native test gate
  #     (opt-in)" (§1.2). The VM engine is retired (issue #524) and this job now runs ONE gate.
  #   * it is full-only, so only the LANDING wagon pays it, not every wagon of a stacked train.
  # #304 (the pendency to restore this entry) is therefore CLOSED BY THIS CHANGE, not deferred.
  #
  # The prior half-measure stays and is still worth its cost: `seed-debut` below builds AND runs a
  # teko compiler on windows-11-arm from the COMMITTED seed, which this job does not (it
  # provisions from the published release). The two lanes exercise different rungs of the same
  # host, so neither subsumes the other.
  #
  # Companion lane: `test / windows-arm64` in tests.yml — the ruling asked for the initial build
  # AND a test lane, and a build gate is not `teko test .`.
  build-test:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix_build) }}

    name: build-test / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Named BEFORE anything can fail on a missing tool, so a red run on a host whose image we
      # have never exercised (windows-11-arm, restored 2026-07-26) says WHICH toolchain was
      # actually present instead of leaving the reader to infer it from a cc error deep inside a
      # build log. Same shape as `seed-debut`'s diagnostic. `unzip`/`tar` are listed because
      # ci_provision_teko.sh needs one of them to open the release asset, and `xz`/`python3`/`7z`
      # because they are the decompressor chain the committed-seed fallback walks.
      - name: Report the host toolchain (diagnostic — never fails the job)
        shell: bash
        run: |
          for t in cc clang gcc xz unzip tar curl python3 7z; do
            printf '%-8s ' "$t"
            command -v "$t" || echo '(absent)'
          done

      # The compiler is no longer built from the C bootstrap — it is the previously
      # RELEASED teko binary (Teko-only ruling). CI provisions it by downloading the
      # latest release's per-platform asset, then runs the PR corpus through it.
      - name: Provision teko from the latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ matrix.label }}
        run: ./scripts/ci_provision_teko.sh "$LABEL"

      # The self-build gate is NATIVE (#168 memory-debt fix): `teko . -o bin` compiles the #test
      # corpus to a binary, runs it in a CHILD process (a failed assert → non-zero exit bars this
      # step), and enforces ALL THREE coverage floors (function/line/branch, #265 Track A) from
      # the native run's merged marks. Because tests run out-of-process, the compiler's peak stays
      # codegen-only (~940 MB). This is ONE gate per platform; native is the sole engine (VM
      # retired, issue #524). Uses scripts/build_with_seed_fallback.sh (owner ruling 2026-07-24):
      # the seed only has to build `main`, not this PR — a staged bootstrap through gen1(main)
      # kicks in only when the raw seed cannot compile the tip directly.
      - name: Test gate (native on the primary; compile-only elsewhere — perf)
        shell: bash
        run: sh scripts/build_with_seed_fallback.sh bin

      # fmt gate REMOVED (owner ruling 2026-07-08): `teko fmt` is a DEV tool for canonical
      # formatting, NOT a gate to bar code. The current fmt collapses hand-alignment, so it
      # fights the W15 vertical-alignment target (deferred to #372) and blocked the 0.3 wave on
      # pure formatting. Formatting stays covered by running `teko fmt` + the per-wave W15
      # retrofit. Re-add a `fmt --check` gate only once #372 makes fmt align properly.

  # ── gen1 checks: CLI surface + the R1 host-target default (0.3.1 regressor-principal) ──
  # Builds gen1 (the PR's compiler under test) from the downloaded release seed, then runs
  # CLI-surface smokes + the R1 host-target-default check. Every regression assertion this
  # job used to carry (the CWD-build check, EXPECT_COMPILE_FAIL/EXPECT_EXIT const checks,
  # the E2E cross-module check, the own==C differential, and the wasm differential) now
  # lives in `regressor.tkr` + the project-regressors under `examples/regressions/`, run
  # NATIVELY by `teko test .` in tests.yml (the sole regression executor, D6) — this job
  # no longer duplicates them.
  #
  # The matrix is DYNAMIC (`needs.changes.outputs.matrix_gen1`): ubuntu-latest on the light path,
  # plus macos-latest on the full path. The former per-entry `install_deps` shell string is GONE —
  # a multi-line shell script cannot travel inside JSON inside YAML without escaping that is a
  # standing invitation to error, and a dependency install belongs to the OS, not to a matrix cell.
  # It is now one step keyed on `runner.os`.
  gen1-checks:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix_gen1) }}

    # Budget kept at 45 min (issue #524 crumb 2). With the heavy `teko test .` self-test now
    # moved OUT to tests.yml (owner design 2026-07-15), this job only builds gen1 once and runs
    # the lighter CLI-surface smokes + own==C differential, so it comfortably fits the cap — the
    # generous budget is retained as headroom for the single "Build gen1" native pass on the
    # slower shared ubuntu-latest runner.
    name: gen1 checks / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The own==C differential compiles the GENERATED C (+ the runtime seam
      # teko_rt.c) with the host cc — so cc is still needed; the COMPILER itself is
      # the downloaded release, not a from-source build. macOS ships clang with the
      # Xcode CLT already, so only the Linux runner needs an install.
      - name: Install cc (Linux only — macOS ships clang)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang

      - name: Provision teko from the latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ matrix.label }}
        run: ./scripts/ci_provision_teko.sh "$LABEL"

      # NOTE: no CLI-flags/version check on the SEED — the seed is the PREVIOUS release,
      # so its --version is intentionally one build behind the PR's teko.tkp. The version
      # string is validated on gen1 below (built from the PR sources → matches teko.tkp).
      #
      # The seed builds the PR's compiler sources → bin/teko (= gen1, the compiler
      # UNDER TEST). Everything below validates gen1, NOT the raw seed — so a codegen
      # fix in this PR is actually exercised (a raw-seed diff would test the old release).
      # scripts/build_with_seed_fallback.sh (owner ruling 2026-07-24): the seed only has to
      # build `main`; a staged bootstrap through gen1(main) kicks in only when the raw seed
      # cannot compile the tip directly, so a genuine capability jump never blocks the wave.
      - name: Build gen1 (released seed compiles the PR corpus → bin/teko)
        shell: bash
        run: sh scripts/build_with_seed_fallback.sh bin

      # NOTE (owner design 2026-07-15): the "gen1 self-test" step (`./bin/teko test .`) was
      # MOVED OUT of this job into the isolated .github/workflows/tests.yml, which runs the
      # suite once per OS (1 linux, 1 macOS, 1 windows) in PARALLEL with these diagnostics —
      # "assim não precisa rodar testes nestes outros diagnósticos para nenhum SO ou Arch."
      # This job now builds gen1 and validates the CLI surface + the R1 host-target default ONLY;
      # test EXECUTION lives entirely in tests.yml.

      - name: CLI flags on gen1 (identical version string)
        shell: bash
        run: ./scripts/cli_flags_test.sh ./bin/teko

      - name: fmt CLI (--check + stdin mode) on gen1 (issue #229)
        shell: bash
        run: ./scripts/fmt_cli_test.sh ./bin/teko

      - name: tk_region_drop_subtree unit test (issue #337 — the adopt bulk-drop primitive)
        shell: bash
        run: ./scripts/region_drop_subtree_test.sh

      # ── R1 host-target default (owner ruling 2026-07-24, teko-target-crosslink §0/§2.1) ──
      # regressor.tkr's F5 backend Examples (tests.yml) always pin TEKO_TARGET explicitly, so
      # they never exercise native_target()'s host-derived default. This step deliberately
      # leaves TEKO_TARGET
      # unset and asserts the own AOT backend still emits THIS host's own object format
      # (the reproduced bug: an unset TEKO_TARGET used to hardcode arm64 Mach-O on every
      # host, so a linux/windows `cc`/`ld` then rejected the wrong-format object outright).
      - name: R1 host-target default (TEKO_TARGET unset, on gen1)
        shell: bash
        env:
          TEKO: ./bin/teko
        run: ./scripts/target_host_default_test.sh

  # ── RISC-V own==C differential under QEMU (BLOCKING — gated in the CI gate job) ─
  # RESTORED (this lane went to zero when the 234 regression directories were folded into 10
  # `.tkr` files and the side-car scripts — including `scripts/diff_c_own.sh`, the ONLY thing the
  # old job drove — were culled). riscv64 EXECUTION is back, now through the single regression
  # executor instead of a side-car script: `regressor.tkr`'s F5 differential corpus is a
  # backend x target `Examples` cross, so every one of its 15 scenarios runs `c` AND `own` on the
  # host AND cross-compiled to `riscv64-linux`, both cross-linked by `riscv64-linux-gnu-gcc`
  # (`resolve_cc`'s TEKO_TARGET arm) and both RUN under `qemu-riscv64-static`
  # (`resolve_run_wrapper`), asserting own == C exit + stdout. `own_riscv_object_well_formed`
  # restores the old lane's other half: `scripts/check_elf.sh` over the own-emitted riscv `.o`
  # with the riscv binutils.
  #
  # FULL-ONLY: a cross+emulated lane is exactly the cost the light path exists to defer to the
  # wagon that lands.
  #
  # REGRESSION_REQUIRE_TOOLS=1 IS THE POINT: without it a lane whose provisioning broke would
  # honest-SKIP the riscv rows and report green — worse than having no lane at all, because it
  # LOOKS like coverage. With it, an absent cross-gcc / qemu is a hard failure.
  #
  # …and BECAUSE the flag is fail-closed for EVERY capability the corpus declares, this is also the
  # one lane that must provision ALL of them. `regressor.tkr` F7 carries a `Given target =
  # "wasm32-wasi"` scenario needing `wasmtime`, which NO lane had ever provisioned — so that
  # scenario has never actually run anywhere. It runs here, gated. That is why this lane installs
  # wasmtime as well as the riscv toolchain, and why the fail-closed flag lives HERE and not on
  # tests.yml: a lane that cannot run part of the corpus cannot honestly demand that none of it be
  # skipped.
  riscv64-qemu:
    needs: changes
    if: needs.changes.outputs.run == 'true' && needs.changes.outputs.full == 'true'
    name: build-test / linux-riscv64 (qemu own==C differential)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: false
    permissions:
      contents: read
    env:
      WASMTIME_VERSION: "v39.0.1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # gcc-riscv64-linux-gnu pulls binutils-riscv64-linux-gnu, which is what
      # scripts/check_elf.sh needs under ELF_TOOLCHAIN=riscv64-linux-gnu- for the own object's
      # well-formedness cross-check.
      - name: Install cross-compiler + QEMU + host clang
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gcc-riscv64-linux-gnu qemu-user-static clang

      # The official release tarball — the same shape release-cross-smoke already uses for zig.
      - name: Install wasmtime (the F7 wasm32-wasi scenario's executor)
        run: |
          set -eu
          curl -fsSL "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/wasmtime-${WASMTIME_VERSION}-x86_64-linux.tar.xz" | tar -xJ
          echo "$PWD/wasmtime-${WASMTIME_VERSION}-x86_64-linux" >> "$GITHUB_PATH"

      - name: Verify wasmtime is on PATH (fail loud before the fail-closed run)
        run: wasmtime --version

      # WHY AN x86_64 SEED ON A riscv64 LANE — and the reason is NOT the one this comment used
      # to give. It claimed "riscv has no release binary asset, so it can't download a seed like
      # the other lanes". That was FALSE: scripts/cross_compile_linux.sh:91-92 builds
      # linux-riscv64-glibc AND linux-riscv64-musl, and the release publishes both. A false
      # premise written into CI is what misleads the next reader (it misled one, 2026-07-25),
      # so here is the true reason: there is no riscv64 RUNNER. This lane is x86_64 hardware
      # emulating riscv64, and a seed is a compiler that must EXECUTE — running one under
      # qemu-user to bootstrap would be slower than building gen1 natively on the host it is
      # actually standing on. The decision is unchanged; only its justification is.
      #
      # So: seed the x86_64 released binary; it builds gen1 (the PR compiler under test) from
      # THIS branch's src/, so gen1 carries the own riscv64 AOT backend (emit_native_riscv) —
      # the C bootstrap / a cmake build from the frozen twins would NOT. The differential runs
      # gen1, never the raw seed.
      - name: Provision teko (x86_64 released seed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci_provision_teko.sh linux-x86_64

      # scripts/build_with_seed_fallback.sh (owner ruling 2026-07-24): bootstraps through
      # gen1(main) when the raw seed cannot compile the tip directly (the seed only has to
      # build `main`, never a capability jump this PR itself introduces).
      - name: Build gen1 (the PR compiler under test — carries emit_native_riscv)
        run: sh scripts/build_with_seed_fallback.sh bin

      - name: RISC-V own==C differential under QEMU (the single regression executor, on gen1)
        shell: bash
        env:
          REGRESSION_REQUIRE_TOOLS: "1"
        run: ./bin/teko test .

  # ── AR ELF/Mach-O/COFF real-toolchain validation (port from theory/kp16-ar-macho-coff) ──
  # KP16's own-native static-archive writer ships three container lanes: the GNU-format
  # ELF writer (`src/backend/objfile_ar.tks`), the BSD `__.SYMDEF SORTED` Mach-O writer
  # (`src/backend/objfile_ar_macho.tks`), and the MS two-linker-member COFF `.lib` writer
  # (`src/backend/objfile_ar_coff.tks`). This job proves + gates all three against a REAL
  # host toolchain (the Mach-O/COFF legs mirror the validation the
  # `theory/kp16-ar-macho-coff` branch ran, run d44f63c9, SUCCESS on both macOS and Windows,
  # before its hunks ported back here; the linux-x86_64/ELF leg was added drop-128
  # 2026-07-24, closing the gap the ELF lane's own byte-layout goldens
  # (`src/backend/objfile_ar_test.tkt`) don't reach — a real `ar`/`nm`/`ld`). Builds
  # examples/toolchain/ar_link_run via `TEKO_BACKEND=native` — `native_target()`'s
  # host default (R1, owner ruling 2026-07-24) selects the right container with no
  # `TEKO_TARGET` override — runs the host-tool well-formedness gate
  # (`scripts/check_ar_elf.sh` / `scripts/check_ar_macho.sh` / `scripts/check_ar_coff.sh`,
  # `AR_CHECK_REQUIRE_TOOLS=1` so an honest-skip here is a hard failure — the toolchain is
  # guaranteed present on these runners), then links + RUNS `scripts/ar_link_run_consumer.c`
  # against the archive — the PRIMARY consumibility criterion (`add(40, 2)` must exit 42).
  # FULL-ONLY: three OS runners for the archive-container lanes is full-path cost.
  ar-elf-macho-coff-validation:
    needs: changes
    if: needs.changes.outputs.run == 'true' && needs.changes.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            format: elf
          - os: macos-latest
            label: macos-arm64
            format: macho
          - os: windows-latest
            label: windows-x86_64
            format: coff
    name: ar validation / ${{ matrix.label }} (${{ matrix.format }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provision teko from the latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ matrix.label }}
        run: ./scripts/ci_provision_teko.sh "$LABEL"

      - name: Build gen1 (seed compiles the PR corpus, staged fallback if needed → bin/teko)
        shell: bash
        run: sh scripts/build_with_seed_fallback.sh bin

      - name: Build the static-lib fixture (own-native, host-default target)
        shell: bash
        env:
          TEKO_BACKEND: native
        run: |
          set -eu
          cd examples/toolchain/ar_link_run
          ../../../bin/teko build . -o bin --no-verify
          ls -la bin

      - name: Host-toolchain well-formedness gate (ar/nm/ld — ELF/GNU)
        if: matrix.format == 'elf'
        shell: bash
        env:
          AR_CHECK_REQUIRE_TOOLS: "1"
        run: ./scripts/check_ar_elf.sh examples/toolchain/ar_link_run/bin/libar_link_run.a ar_link_run__add

      - name: Host-toolchain well-formedness gate (ar/nm/ld64 — Mach-O)
        if: matrix.format == 'macho'
        shell: bash
        env:
          AR_CHECK_REQUIRE_TOOLS: "1"
        run: ./scripts/check_ar_macho.sh examples/toolchain/ar_link_run/bin/libar_link_run.a ar_link_run__add

      - name: Host-toolchain well-formedness gate (llvm-lib/lib.exe + dumpbin — COFF)
        if: matrix.format == 'coff'
        shell: bash
        env:
          AR_CHECK_REQUIRE_TOOLS: "1"
        run: ./scripts/check_ar_coff.sh examples/toolchain/ar_link_run/bin/ar_link_run.lib ar_link_run__add

      # PRIMARY consumibility criterion — a real host cc/ld links + RUNS the consumer
      # against the archive. add(40, 2) = 42.
      - name: Link + run the consumer against the ELF/GNU archive (expect exit 42)
        if: matrix.format == 'elf'
        shell: bash
        run: |
          set -eu
          cc -c scripts/ar_link_run_consumer.c -o /tmp/ar_link_run_consumer.o
          cc /tmp/ar_link_run_consumer.o examples/toolchain/ar_link_run/bin/libar_link_run.a -o /tmp/ar_link_run_consumer_bin
          set +e
          /tmp/ar_link_run_consumer_bin
          rc=$?
          set -e
          echo "consumer exit code: $rc"
          [ "$rc" -eq 42 ] || { echo "FAIL — expected exit 42, got $rc"; exit 1; }

      # PRIMARY consumibility criterion — a real host cc (clang/ld64) links + RUNS the
      # consumer against the archive. add(40, 2) = 42.
      - name: Link + run the consumer against the Mach-O archive (expect exit 42)
        if: matrix.format == 'macho'
        shell: bash
        run: |
          set -eu
          clang -c scripts/ar_link_run_consumer.c -o /tmp/ar_link_run_consumer.o
          clang /tmp/ar_link_run_consumer.o examples/toolchain/ar_link_run/bin/libar_link_run.a -o /tmp/ar_link_run_consumer_bin
          set +e
          /tmp/ar_link_run_consumer_bin
          rc=$?
          set -e
          echo "consumer exit code: $rc"
          [ "$rc" -eq 42 ] || { echo "FAIL — expected exit 42, got $rc"; exit 1; }

      # PRIMARY consumibility criterion — lld-link (the same tool + MSYS path-conversion
      # guard scripts/check_coff.sh already uses) links + RUNS the consumer natively.
      # add(40, 2) = 42.
      - name: Link + run the consumer against the COFF archive (expect exit 42)
        if: matrix.format == 'coff'
        shell: bash
        run: |
          set -eu
          clang -c scripts/ar_link_run_consumer.c -o ar_link_run_consumer.o
          obj_arg=ar_link_run_consumer.o
          lib_arg="examples/toolchain/ar_link_run/bin/ar_link_run.lib"
          out_arg=ar_link_run_consumer.exe
          if command -v cygpath >/dev/null 2>&1; then
            obj_arg="$(cygpath -w ar_link_run_consumer.o)"
            lib_arg="$(cygpath -w examples/toolchain/ar_link_run/bin/ar_link_run.lib)"
            out_arg="$(cygpath -w ar_link_run_consumer.exe)"
          fi
          MSYS_NO_PATHCONV=1 MSYS2_ARG_CONV_EXCL='*' lld-link /nologo "/out:$out_arg" /entry:main /subsystem:console "$obj_arg" "$lib_arg"
          set +e
          ./ar_link_run_consumer.exe
          rc=$?
          set -e
          echo "consumer exit code: $rc"
          [ "$rc" -eq 42 ] || { echo "FAIL — expected exit 42, got $rc"; exit 1; }

  # ── seeds: cut the five committed HOST seeds, from ONE runner ───────────────────
  # PRODUCTION side of bootstrap/seeds/ (TRANSITIONAL — .31 only, removed in the first .32
  # wagon). scripts/cross_compile_seeds.sh turns this tip's emitted teko.c into one seed per
  # HOST THAT RUNS THE COMPILER — the five GitHub-hosted runners — with `zig cc`, so no macOS
  # and no Windows runner participates in producing them.
  #
  # WHAT THIS JOB IS FOR, given the blobs are already committed: it re-cuts them from the CURRENT
  # tip and publishes the archives + SEEDS.sha256 as a run artifact. That is what makes the PR
  # review criterion checkable — "the sha256 matches what the green run produced", not "I read
  # the binary" — and it is what turns a later wagon breaking seed compilation into a RED lane
  # rather than a discovery at release time. The consuming half is `seed-debut` below, which
  # takes the COMMITTED blob (not this job's output) so the thing in the tree is the thing proven.
  #
  # FULL-ONLY, like release-cross-smoke and for the same reason: it costs one dry compiler build
  # plus five cross-links. A wagon whose base is a previous wagon does not re-cut seeds; the
  # wagon that lands (base = main) does.
  seeds:
    needs: changes
    if: needs.changes.outputs.run == 'true' && needs.changes.outputs.full == 'true'
    name: host seeds (zig cross-cut)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      ZIG_VERSION: "0.16.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install zig (official tarball — the same pin release.yml uses)
        run: |
          set -eu
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" | tar -xJ
          echo "$PWD/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Provision x86_64 seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci_provision_teko.sh linux-x86_64-glibc

      - name: Emit teko.c (dry build — no gate, no fixpoint)
        run: sh scripts/build_with_seed_fallback.sh out

      - name: Cut the five host seeds
        run: sh scripts/cross_compile_seeds.sh out/teko.c src seeds-out

      # The REVIEWABLE artifact. A reviewer compares SEEDS.sha256 here against
      # bootstrap/seeds/SEEDS.sha256 in the diff; the .xz files are attached so the claim can be
      # re-derived rather than taken on faith.
      - name: Upload the cut seeds + their checksum manifest
        uses: actions/upload-artifact@v4
        with:
          name: host-seeds
          path: |
            seeds-out/teko-*.xz
            seeds-out/SEEDS.sha256
          if-no-files-found: error

  # ── seed-debut: every host CONSUMES the committed seed ──────────────────────────
  # The consuming half of bootstrap/seeds/ (TRANSITIONAL — .31 only). One job per HOST, each
  # provisioning with TEKO_SEED_PREFER_COMMITTED=1 so the release probe is skipped entirely and
  # the committed blob — sha256-verified against SEEDS.sha256 BEFORE it is decompressed — is the
  # compiler under the build. A fallback that nothing ever takes is a fallback nobody has tested;
  # this lane takes it on every full run.
  #
  # WHY IT BUILDS RATHER THAN JUST SMOKING `--version`: a seed's whole job is to compile the tip.
  # `--version` proves the binary loads on the host, which is necessary and nowhere near
  # sufficient — a seed that loads and then cannot build is a seed that fails at the moment it is
  # needed, on the run that needed it.
  #
  # windows-11-arm DEBUTS HERE (owner authorization 2026-07-25). The fork publishes
  # teko-windows-arm64.zip and no lane had ever built or executed anything on that arch; the seed
  # for it is cross-cut by zig with no arm64 Windows runner involved, so this is the first and
  # only place the result is confronted with the real hardware. If that runner's image lacks
  # something the build needs, this lane is where it turns red — three wagons before the release,
  # which is the entire reason the lane debuts now instead of at the bump.
  #
  # FULL-ONLY: five host runners is landing-wagon cost.
  seed-debut:
    needs: changes
    if: needs.changes.outputs.run == 'true' && needs.changes.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: ubuntu-24.04-arm
            label: linux-arm64
          - os: macos-latest
            label: macos-arm64
          - os: windows-latest
            label: windows-x86_64
          - os: windows-11-arm
            label: windows-arm64
    name: seed debut / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Named BEFORE the build so a red run says which toolchain was actually present, instead of
      # leaving the reader to infer it from a cc error deep inside a build log.
      - name: Report the host toolchain (diagnostic — never fails the job)
        shell: bash
        run: |
          for t in cc clang gcc xz python3 7z; do
            printf '%-8s ' "$t"
            command -v "$t" || echo '(absent)'
          done

      - name: Install cc (Linux only — macOS and the Windows images ship clang)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang

      - name: Provision the COMMITTED seed (sha256-verified before decompression)
        shell: bash
        env:
          TEKO_SEED_PREFER_COMMITTED: "1"
          LABEL: ${{ matrix.label }}
        run: ./scripts/ci_provision_teko.sh "$LABEL"

      # The committed seed compiles THIS tip. No fallback ladder here on purpose: the ladder
      # exists to bridge a released seed to a newer tip, and this seed was cut FROM the tip — if
      # it cannot build it directly, the committed blob is wrong and that is exactly the finding.
      - name: Build the tip with the committed seed
        shell: bash
        run: teko . -o out --no-verify

  # ── release cross-compile smoke: the EXACT zig-cross the release runs, compile-only ──
  # release.yml is tag-triggered, so its Linux cross-compile went unvalidated in PR CI — a
  # zig-version/target break (e.g. 0.13.0's incomplete riscv64 glibc, missing stubs-lp64d.h)
  # only surfaced AFTER merge, on a real tag. This job runs the SAME
  # scripts/cross_compile_linux.sh in SMOKE mode on every PR: emit teko.c, cross-compile all six
  # Linux targets, assert each architecture, THEN RUN every one of them. A clean cross-compile is
  # not a clean cross-run — `zig cc` at an optimizing level once turned latent UB in teko.c into a
  # checker miscompile that a compile-only smoke could never see
  # (fix/readdir-order-determinism). A break here gates the merge, so a broken release can never
  # reach main.
  #
  # EXECUTION, not just compilation, for ALL SIX (2026-07-25): x86_64 natively, arm64 and riscv64
  # under `qemu-user-static`. The two musl artifacts are `-static` and run under qemu unaided; the
  # four glibc ones are DYNAMIC and need their target loader, so the cross libc sysroots are
  # installed and qemu is pointed at them with `-L`. Measured, not assumed: without `-L` a
  # dynamic aarch64/riscv64 artifact dies at `Could not open '/lib/ld-linux-*.so.*'`, which is why
  # the invocation is uniform and explicit rather than relying on binfmt.
  #
  # …and the same step carries a LAW: the six artifacts must emit BYTE-IDENTICAL C for the same
  # project. Determinism is already a law within one architecture (the gen2 == gen3 fixpoint);
  # this extends it ACROSS architectures, where a pointer-width or endianness leak into the
  # emitter would show up as a diverging sha256 and nowhere else.
  # FULL-ONLY: the release path is only about to be taken from the wagon that lands.
  release-cross-smoke:
    needs: changes
    if: needs.changes.outputs.run == 'true' && needs.changes.outputs.full == 'true'
    name: release cross-compile smoke (zig)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ZIG_VERSION: "0.16.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install zig (official tarball)
        run: |
          set -eu
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" | tar -xJ
          echo "$PWD/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      # qemu-user-static executes the non-native artifacts; the two libc6-*-cross packages carry
      # ONLY the target loader + shared libc the four glibc artifacts need at runtime (no
      # compiler — this lane cross-compiles with zig, not with a GNU cross-toolchain).
      - name: Install qemu-user-static + the arm64/riscv64 loaders
        run: |
          sudo apt-get update -y
          sudo apt-get install -y qemu-user-static libc6-arm64-cross libc6-riscv64-cross

      - name: Provision x86_64 seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci_provision_teko.sh linux-x86_64-glibc

      # scripts/build_with_seed_fallback.sh (owner ruling 2026-07-24): the seed only has to
      # build `main`; falls back to a staged bootstrap through gen1(main) only when the raw
      # seed cannot emit the tip's teko.c directly.
      - name: Emit teko.c (one gen, no gate)
        run: sh scripts/build_with_seed_fallback.sh out

      # NOTE: a `zig cc -fsyntax-only -Werror=sometimes-uninitialized` guard was tried here but
      # zig's clang is stricter than Apple clang and still flags residual value-match temps the
      # `= {0}` codegen fix (#283) doesn't fully cover — a `-Werror` guard is not satisfiable yet.
      # The real regression protection is the cross-RUN step below: a miscompiled artifact rejects
      # the corpus (non-zero exit) and gates the merge. Re-add the syntax guard once the residual
      # x86_64 UB (still open on #283) is fixed and the emitted C is `-Werror`-clean under zig.
      - name: Cross-compile all six Linux targets (compile-only, no qemu)
        run: sh scripts/cross_compile_linux.sh out/teko.c src /tmp/smoke smoke

      # Every published artifact RUNS, and the six agree on the C they emit. Two assertions in
      # one step because they share the same six invocations:
      #   1. EXECUTION — each artifact answers `--version`, then compiles a real (minimal)
      #      project end-to-end: lexer → checker → codegen → emit C → cc. The x86_64 pair runs
      #      natively; arm64/riscv64 run under qemu-user with `-L <sysroot>` so the dynamic glibc
      #      artifacts find their loader.
      #   2. CROSS-ARCH DETERMINISM — the emitted .c must be byte-identical across all six. A
      #      pointer-width, endianness or hash-order leak into the emitter is invisible to the
      #      within-architecture fixpoint and shows up here as a diverging sha256.
      - name: Run all six cross artifacts + assert identical emitted C
        run: |
          set -eu
          # run_art LABEL ARGS… — invoke gd-LABEL/teko, natively or under the right emulator.
          # The `-L` sysroot is required by the four glibc (dynamic) artifacts and harmless for
          # the two static musl ones, so the shape is uniform.
          run_art() {
            label="$1"; shift
            case "$label" in
              *-x86_64-*) "./gd-$label/teko" "$@" ;;
              *-arm64-*)  qemu-aarch64-static -L /usr/aarch64-linux-gnu "./gd-$label/teko" "$@" ;;
              *-riscv64-*) qemu-riscv64-static -L /usr/riscv64-linux-gnu "./gd-$label/teko" "$@" ;;
              *) echo "run_art: unknown label '$label'" >&2; return 1 ;;
            esac
          }
          REF_SHA=""
          for label in linux-x86_64-glibc linux-x86_64-musl \
                       linux-arm64-glibc linux-arm64-musl \
                       linux-riscv64-glibc linux-riscv64-musl; do
            echo "=== $label ==="
            run_art "$label" --version
            out="/tmp/xemit-$label"
            rm -rf "$out"
            run_art "$label" build examples/smoke/uniontest -o "$out" --no-verify
            sha="$(sha256sum "$out/uniontest.c" | awk '{print $1}')"
            echo "$label emitted uniontest.c sha256 $sha"
            if [ -z "$REF_SHA" ]; then
              REF_SHA="$sha"
            elif [ "$sha" != "$REF_SHA" ]; then
              echo "FAIL — $label emitted DIFFERENT C than the first artifact ($sha != $REF_SHA)" >&2
              echo "the emitted C must not depend on the architecture the compiler runs on" >&2
              exit 1
            fi
          done
          echo "all six artifacts ran and emitted byte-identical C ($REF_SHA)"

      # The x86_64-glibc artifact additionally compiles the WHOLE compiler corpus — the heavy
      # miscompile guard, kept native because it is the one that would have caught the `zig cc`
      # -O2 miscompile before it reached a release, and the one it is worth paying for.
      - name: Run the x86_64-glibc cross artifact over the corpus (miscompile guard)
        run: ./gd-linux-x86_64-glibc/teko . -o /tmp/xrun --no-verify --release

  # ── gate: aggregates every native job, and ASSERTS THE MODE ───────────────────
  # J3 (the guard against an empty green): a gate that treats `skipped` as approved turns the
  # light/full split into a blind spot — one broken `if:` would skip everything and still report
  # green. So this gate asserts, per job, WHICH result the mode demands:
  #   * light-path jobs (build-test, gen1-checks) must be `success`. `skipped` is an ERROR: it
  #     means a condition broke, never "nothing to do" (the docs-only case exits earlier, above).
  #   * full-only jobs must be `success` when full, and `skipped` when light. An unexpected
  #     `success` on the light path is reported (a condition is wrong) but does not block.
  # The mode itself is printed on every run, so a reader never has to infer it.
  gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [changes, build-test, gen1-checks, riscv64-qemu, ar-elf-macho-coff-validation, release-cross-smoke, seeds, seed-debut]
    if: always()
    permissions: {}

    steps:
      - name: Evaluate results
        env:
          CHANGES: ${{ needs.changes.outputs.run }}
          FULL: ${{ needs.changes.outputs.full }}
          BUILD_RESULT: ${{ needs.build-test.result }}
          GEN1_RESULT: ${{ needs.gen1-checks.result }}
          RISCV_RESULT: ${{ needs.riscv64-qemu.result }}
          AR_RESULT: ${{ needs.ar-elf-macho-coff-validation.result }}
          SMOKE_RESULT: ${{ needs.release-cross-smoke.result }}
          SEEDS_RESULT: ${{ needs.seeds.result }}
          DEBUT_RESULT: ${{ needs.seed-debut.result }}
        run: |
          set -u
          if [ "$FULL" = "true" ]; then MODE=full; else MODE=light; fi
          echo "mode=$MODE"
          echo "changes.run                  = $CHANGES"
          echo "build-test                   = $BUILD_RESULT   (light path)"
          echo "gen1-checks                  = $GEN1_RESULT   (light path)"
          echo "riscv64-qemu                 = $RISCV_RESULT   (full only)"
          echo "ar-elf-macho-coff-validation = $AR_RESULT   (full only)"
          echo "release-cross-smoke          = $SMOKE_RESULT   (full only)"
          echo "seeds                        = $SEEDS_RESULT   (full only)"
          echo "seed-debut                   = $DEBUT_RESULT   (full only)"

          # If the paths filter said nothing relevant changed, everything skipped → OK
          if [ "$CHANGES" != "true" ]; then
            echo "No relevant files changed — gate passes."
            exit 0
          fi

          FAILED=0

          # A light-path job must SUCCEED. `skipped` here is a broken condition, not an absence
          # of work: build-test is the self-build gate and gen1-checks is the CLI/R1 surface, and
          # both are unconditional on the light path.
          require_success() {
            [ "$2" = "success" ] && return 0
            echo "ERROR: $1 = $2 (the light path requires success; a skip means a broken condition)"
            FAILED=1
          }
          require_success build-test  "$BUILD_RESULT"
          require_success gen1-checks "$GEN1_RESULT"

          # A full-only job must SUCCEED in full mode and be SKIPPED in light mode. An unexpected
          # success on the light path costs runner time but hides nothing, so it warns.
          require_full_only() {
            if [ "$MODE" = "full" ]; then
              [ "$2" = "success" ] && return 0
              echo "ERROR: $1 = $2 (full mode requires success)"
              FAILED=1
              return 0
            fi
            [ "$2" = "skipped" ] && return 0
            echo "::warning::$1 = $2 on the light path — expected skipped; check its \`if:\` condition."
          }
          require_full_only riscv64-qemu                 "$RISCV_RESULT"
          require_full_only ar-elf-macho-coff-validation "$AR_RESULT"
          require_full_only release-cross-smoke          "$SMOKE_RESULT"
          require_full_only seeds                        "$SEEDS_RESULT"
          require_full_only seed-debut                   "$DEBUT_RESULT"

          if [ "$FAILED" = "1" ]; then
            echo "CI gate FAILED (mode=$MODE)."
            exit 1
          fi
          echo "CI gate passed (mode=$MODE)."
          exit 0
