name: Tests

# ISOLATED test-execution workflow (owner design 2026-07-15): the `teko test .` self-test suite
# runs HERE — one runner per HOST — in PARALLEL with the other tracks (native.yml,
# sanitizers.yml). Owner's words: "criar em cada ambiente (um por SO: 1 mac, 1 linux e 1 windows)
# testes em um yml separado, para fugir dos gargalos e que roda em paralelo com as outras
# trilhas, assim não precisa rodar testes nestes outros diagnósticos para nenhum SO ou Arch." The
# other workflows' diagnostic jobs therefore NO LONGER run `teko test .` for any OS/arch
# (native.yml's gen1-checks self-test step was removed when this workflow was added).
#
# "UM POR SO" BECAME "UM POR HOST" (owner ruling 2026-07-26): "sobre windows-arm64 (e outros
# hosts), tem que fazer o build inicial e tem que colocar lane de teste se não houverem." Two
# published artifacts had never been tested by anything: `teko-linux-arm64-{glibc,musl}.tar.gz`
# and `teko-windows-arm64.zip`. The host set here is now exactly native.yml's `build-test` set —
# the five GitHub-hosted runners that also back bootstrap/seeds/ and release.yml's build-native.
#
# ONE MATRIX, NOT FIVE HAND-WRITTEN JOBS. Three hand-written jobs was already the shape in which
# the fourth and fifth get forgotten, and the per-job `needs:` list of the aggregator below is
# exactly where that forgetting becomes invisible (a job outside the list runs, goes red, and
# does not block the merge — the "gate that does not gate", which this train has hit four times).
# A single matrix job has ONE name in `needs:`, and GitHub's aggregate result for a matrix job is
# `success` only when EVERY leg succeeded — a failed, cancelled or absent leg is not `success`,
# so the gate below rejects it without maintaining a list. Per-host differences (the Windows
# self-test invocation) are ONE step keyed on `runner.os`, following the precedent native.yml set
# when it deleted its per-cell `install_deps` shell string: a shell script does not travel inside
# JSON inside YAML without escaping that is a standing invitation to error.
#
# CI runs on PULL REQUESTS (the per-PR gate) plus PUSHES to main + remodel/** integration branches.
#
# LIGHT vs FULL (owner proposal 2026-07-24; hosts revised 2026-07-26):
#   light  = linux-x86_64 + windows-x86_64
#   full   = + linux-arm64, macos-arm64, windows-arm64   (base_ref == main)
# windows-x86_64 rides the light tier for the empirical reason spelled out in native.yml's matrix
# note (wagons 15 and 16 failed on Windows and only on Windows). The three arm hosts are full-only:
# each adds an ARCH delta on top of a platform that the light tier already covers, and
# windows-11-arm is additionally the slowest runner in the set. The axis is `github.base_ref`,
# never `github.ref` (on a pull_request that is `refs/pull/N/merge` and matches no branch name).
on:
  pull_request:
    branches: ['**']   # '**' cruza '/' — casa base com barra (remodel/...); '*' simples nao
    paths: ['**.tkp', '**.tks', '**.tkt', '**.tkr', '**.sh', '**.c', '**.h', '.github/workflows/*.yml']

# Restrict default token scope for all jobs in this workflow.
permissions:
  contents: read

jobs:
  # ── plan: the mode and the host matrix, emitted once ─────────────────────────
  # Mirrors native.yml's `changes` job, minus the paths filter (this workflow is already
  # path-filtered at the trigger). `labels` is emitted alongside `matrix` so the gate can check
  # WHICH hosts were planned, not merely that the matrix job went green — see the gate's note.
  plan:
    name: test plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      full: ${{ steps.decide.outputs.full }}
      matrix: ${{ steps.decide.outputs.matrix }}
      labels: ${{ steps.decide.outputs.labels }}
    steps:
      - name: Decide (mode + host matrix)
        id: decide
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -eu
          if [ "$BASE_REF" = "main" ]; then full=true; else full=false; fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "mode: $([ "$full" = "true" ] && echo full || echo light) (base_ref='$BASE_REF')"

          # `label` feeds BOTH the job name and scripts/ci_provision_teko.sh's asset label, so the
          # check that goes red names the same string the release publishes. `timeout` is per-host
          # because the hosts are not comparable: measured build-test wall-clock on the same
          # corpus was 309s linux-x86_64 / 215s windows-x86_64 / 184s macos-arm64 versus 973s on
          # windows-11-arm (docs/design/compile-time-architecture.md §1.1), and this job runs the
          # heavier `teko test .` on top of the build.
          L_X86='{"os":"ubuntu-latest","label":"linux-x86_64","timeout":95}'
          W_X86='{"os":"windows-latest","label":"windows-x86_64","timeout":125}'
          L_ARM='{"os":"ubuntu-24.04-arm","label":"linux-arm64","timeout":95}'
          M_ARM='{"os":"macos-latest","label":"macos-arm64","timeout":95}'
          W_ARM='{"os":"windows-11-arm","label":"windows-arm64","timeout":180}'
          if [ "$full" = "true" ]; then
            echo "matrix={\"include\":[$L_X86,$W_X86,$L_ARM,$M_ARM,$W_ARM]}" >> "$GITHUB_OUTPUT"
            echo "labels=linux-arm64 linux-x86_64 macos-arm64 windows-arm64 windows-x86_64" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"include\":[$L_X86,$W_X86]}" >> "$GITHUB_OUTPUT"
            echo "labels=linux-x86_64 windows-x86_64" >> "$GITHUB_OUTPUT"
          fi

  # ── test / <host> ────────────────────────────────────────────────────────────
  # Provision the released seed, build gen1 (the PR's compiler under test — the seed compiles
  # the PR corpus into bin/teko, falling back to a staged bootstrap through gen1(main) — see
  # scripts/build_with_seed_fallback.sh — when the raw seed cannot reach the tip), then run
  # gen1's own full test suite (`teko test .`). This is the SAME heavy native pass gen1-checks
  # used to run; it lives here so it parallels the diagnostics instead of blocking them.
  #
  # HISTORICAL CAVEAT ON WINDOWS: the gen1 BUILD alone is ~11 min on the shared runner, and the
  # previous attempt to also run the full `teko test .` on top of it blew both the 20- and 30-min
  # caps (owner ruling 2026-07-14 — sanitizers.yml's windows-selfhost only builds + `--version`
  # smokes). The caps here are deliberately generous so CI reveals the ACTUAL duration now that
  # tests run on their own isolated runner. windows-arm64 gets the largest cap of all for the
  # same reason and one more: nothing has ever run `teko test .` on that host, so its duration is
  # unknown rather than merely large. If a cap is exceeded, do NOT silently drop the host — the
  # owner wants one test runner per host; the relief belongs in the perf work (#168/#265).
  test:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: test / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Named BEFORE the first step that can fail on a missing tool, so a red run on a host whose
      # image no lane has exercised (windows-11-arm, ubuntu-24.04-arm here) says WHICH toolchain
      # was present instead of leaving the reader to infer it from a cc error deep inside a build
      # log. Same shape as native.yml's `seed-debut`. `unzip`/`tar` are listed because
      # ci_provision_teko.sh needs one of them to open the release asset, and `xz`/`python3`/`7z`
      # because they are the decompressor chain the committed-seed fallback walks.
      - name: Report the host toolchain (diagnostic — never fails the job)
        shell: bash
        run: |
          for t in cc clang gcc xz unzip tar curl python3 7z; do
            printf '%-8s ' "$t"
            command -v "$t" || echo '(absent)'
          done

      - name: Provision teko from the latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ matrix.label }}
        run: ./scripts/ci_provision_teko.sh "$LABEL"

      - name: Build gen1 (seed compiles the PR corpus, staged fallback if needed → bin/teko)
        shell: bash
        run: sh scripts/build_with_seed_fallback.sh bin

      # The one genuinely per-host step, and the reason it is TWO steps keyed on `runner.os`
      # rather than a matrix field: the Windows invocation is not a different path, it is a
      # different shell with an explicit `$LASTEXITCODE` propagation. Exactly one of these runs on
      # any given leg, so a leg can never report green without having executed the suite.
      - name: gen1 self-test — POSIX hosts (the PR's compiler runs its own gate)
        if: runner.os != 'Windows'
        shell: bash
        run: ./bin/teko test .

      - name: gen1 self-test — Windows hosts (the PR's compiler runs its own gate)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\bin\teko.exe test .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # ── test suite gate: the stable required check ───────────────────────────────
  # Stable required-check name for the branch ruleset — the per-host job names are NOT required
  # checks and are free to change with the matrix (that is the whole point of aggregating).
  #
  # `needs: [plan, test]` covers EVERY host with no list to maintain: for a matrix job GitHub
  # folds the legs into one result, which is `success` only when all legs succeeded. `failure`,
  # `cancelled` and `skipped` are all rejected below by the same `!= success` test — including
  # `cancelled`, which a "did anything fail?" gate would wave through.
  #
  # J3 (the guard against an empty green) has a SECOND half once the matrix is dynamic. A gate
  # that only asserts "the matrix job was green" is vacuously satisfiable by a `plan` job that
  # emits the wrong matrix: drop four hosts and one green linux leg reports success. So the gate
  # re-derives the mode from `github.base_ref` ITSELF — not from plan's output — and demands the
  # exact host set that mode requires. A planned-set mismatch is an ERROR, not a warning: it is
  # indistinguishable from silently un-testing a host. (native.yml's `CI gate` has this same hole
  # against `matrix_build`; closing it there is a separate change, noted here so it is not lost.)
  test-suite-gate:
    name: Test suite gate
    runs-on: ubuntu-latest
    needs: [plan, test]
    if: always()
    permissions: {}
    steps:
      - name: Evaluate results
        env:
          BASE_REF: ${{ github.base_ref }}
          PLAN_RESULT: ${{ needs.plan.result }}
          PLAN_FULL: ${{ needs.plan.outputs.full }}
          PLANNED: ${{ needs.plan.outputs.labels }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          set -u
          if [ "$BASE_REF" = "main" ]; then
            MODE=full
            WANT_FULL=true
            WANT_LABELS="linux-arm64 linux-x86_64 macos-arm64 windows-arm64 windows-x86_64"
          else
            MODE=light
            WANT_FULL=false
            WANT_LABELS="linux-x86_64 windows-x86_64"
          fi
          echo "mode=$MODE (base_ref='$BASE_REF')"
          echo "plan            = $PLAN_RESULT (full=$PLAN_FULL)"
          echo "planned hosts   = $PLANNED"
          echo "required hosts  = $WANT_LABELS"
          echo "test (matrix)   = $TEST_RESULT"

          FAILED=0

          # The planner itself is a light-path job: it has no `if:` and must always run.
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "ERROR: test plan = $PLAN_RESULT (it is unconditional; anything but success is a break)"
            FAILED=1
          fi

          # The mode the planner chose must be the mode the base_ref demands.
          if [ "$PLAN_FULL" != "$WANT_FULL" ]; then
            echo "ERROR: test plan says full='$PLAN_FULL' but base_ref='$BASE_REF' demands full='$WANT_FULL'"
            FAILED=1
          fi

          # …and the hosts it planned must be exactly the hosts the mode demands. Sorted-and-
          # compared as text so an omission, a duplicate and a typo all fail the same way.
          GOT="$(printf '%s\n' $PLANNED | sort | tr '\n' ' ')"
          WANT="$(printf '%s\n' $WANT_LABELS | sort | tr '\n' ' ')"
          if [ "$GOT" != "$WANT" ]; then
            echo "ERROR: planned host set does not match mode=$MODE"
            echo "  planned : $GOT"
            echo "  required: $WANT"
            FAILED=1
          fi

          # One assertion for every leg. A matrix job's aggregate result is `success` only when
          # every leg succeeded, so this rejects failure, cancellation and a skipped/empty matrix
          # alike — no per-host `needs:` list can fall out of date behind it.
          if [ "$TEST_RESULT" != "success" ]; then
            echo "ERROR: test (matrix over: $PLANNED) = $TEST_RESULT — every host must succeed"
            FAILED=1
          fi

          if [ "$FAILED" = "1" ]; then
            echo "Test suite gate FAILED (mode=$MODE)."
            exit 1
          fi
          echo "Test suite gate passed (mode=$MODE, hosts: $PLANNED)."
          exit 0
