name: Tests

# ISOLATED test-execution workflow (owner design 2026-07-15): the `teko test .` self-test suite
# runs HERE — one runner per OS (1 linux, 1 macOS, 1 windows), in PARALLEL with the other tracks
# (native.yml, sanitizers.yml). Owner's words: "criar em cada ambiente (um por SO: 1 mac, 1 linux
# e 1 windows) testes em um yml separado, para fugir dos gargalos e que roda em paralelo com as
# outras trilhas, assim não precisa rodar testes nestes outros diagnósticos para nenhum SO ou
# Arch." The other workflows' diagnostic jobs therefore NO LONGER run `teko test .` for any OS/arch
# (native.yml's gen1-checks self-test step was removed when this workflow was added).
#
# CI runs on PULL REQUESTS (the per-PR gate) plus PUSHES to main + remodel/** integration branches.
#
# LIGHT vs FULL (owner proposal 2026-07-24): `test / linux` runs on EVERY PR; `test / macos` and
# `test / windows` run only when the PR's BASE is main — the wagon that LANDS a stacked train, or a
# hotfix. The axis is `github.base_ref`, never `github.ref` (on a pull_request that is
# `refs/pull/N/merge` and matches no branch name). An intermediate wagon PR therefore pays one test
# runner instead of three, and the whole matrix is paid exactly once, at the landing.
on:
  pull_request:
    branches: ['**']   # '**' cruza '/' — casa base com barra (remodel/...); '*' simples nao
    paths: ['**.tkp', '**.tks', '**.tkt', '**.tkr', '**.sh', '**.c', '**.h', '.github/workflows/*.yml']

# Restrict default token scope for all jobs in this workflow.
permissions:
  contents: read

jobs:
  # ── test / linux ─────────────────────────────────────────────────────────────
  # Provision the released seed, build gen1 (the PR's compiler under test — the seed compiles
  # the PR corpus into bin/teko, falling back to a staged bootstrap through gen1(main) — see
  # scripts/build_with_seed_fallback.sh — when the raw seed cannot reach the tip), then run
  # gen1's own full test suite (`teko test .`). This is the SAME heavy native pass gen1-checks
  # used to run; it now lives here so it parallels the diagnostics instead of blocking them.
  # 45-min budget matches the former gen1-checks cap.
  test-linux:
    name: test / linux
    runs-on: ubuntu-latest
    timeout-minutes: 95
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provision teko from the latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci_provision_teko.sh linux-x86_64

      - name: Build gen1 (seed compiles the PR corpus, staged fallback if needed → bin/teko)
        shell: bash
        run: sh scripts/build_with_seed_fallback.sh bin

      - name: gen1 self-test (the PR's compiler runs its own gate)
        shell: bash
        run: ./bin/teko test .

  # ── test / macos ─────────────────────────────────────────────────────────────
  # FULL-ONLY: base_ref == main.
  test-macos:
    name: test / macos
    if: github.base_ref == 'main'
    runs-on: macos-latest
    timeout-minutes: 95
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provision teko from the latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci_provision_teko.sh macos-arm64

      - name: Build gen1 (seed compiles the PR corpus, staged fallback if needed → bin/teko)
        shell: bash
        run: sh scripts/build_with_seed_fallback.sh bin

      - name: gen1 self-test (the PR's compiler runs its own gate)
        shell: bash
        run: ./bin/teko test .

  # ── test / windows ───────────────────────────────────────────────────────────
  # The owner's "1 per OS" design explicitly includes Windows. HISTORICAL CAVEAT: the Windows
  # gen1 BUILD alone is ~11 min on the shared runner, and the previous attempt to also run the
  # full `teko test .` on top of it blew both the 20- and 30-min caps (owner ruling 2026-07-14 —
  # sanitizers.yml's windows-selfhost only builds + `--version` smokes). This job is WIRED per the
  # new design with a generous cap so CI can reveal the ACTUAL duration now that tests run on their
  # own isolated runner (no other diagnostic work competing on this box). If it still exceeds the
  # cap it may need the same build-time relief the perf phase is bringing to the other lanes — do
  # NOT silently drop it; the owner wants one test runner per OS.
  # FULL-ONLY: base_ref == main.
  test-windows:
    name: test / windows
    if: github.base_ref == 'main'
    runs-on: windows-latest
    timeout-minutes: 125
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provision teko from the latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci_provision_teko.sh windows-x86_64

      - name: Build gen1 (seed compiles the PR corpus, staged fallback if needed → bin/teko)
        shell: bash
        run: sh scripts/build_with_seed_fallback.sh bin

      - name: gen1 self-test (the PR's compiler runs its own gate)
        shell: pwsh
        run: |
          .\bin\teko.exe test .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # ── test suite gate: aggregates the per-OS test runners, and ASSERTS THE MODE ──
  # Stable required-check name for the branch ruleset. J3 (the guard against an empty green): a
  # gate that counts `skipped` as approval would let one broken `if:` skip every runner and still
  # report green. So the demanded result is asserted per job and per mode:
  #   * `test / linux` is the light path — it must be `success`; `skipped` is an ERROR.
  #   * `test / macos` and `test / windows` are full-only — `success` when full, `skipped` when
  #     light (an unexpected success on light warns: the condition is wrong, but nothing is hidden).
  # Mirrors the aggregator pattern in native.yml (`CI gate`) and sanitizers.yml (`Sanitizer gate`).
  test-suite-gate:
    name: Test suite gate
    runs-on: ubuntu-latest
    needs: [test-linux, test-macos, test-windows]
    if: always()
    permissions: {}
    steps:
      - name: Evaluate results
        env:
          BASE_REF: ${{ github.base_ref }}
          LINUX: ${{ needs.test-linux.result }}
          MACOS: ${{ needs.test-macos.result }}
          WINDOWS: ${{ needs.test-windows.result }}
        run: |
          set -u
          if [ "$BASE_REF" = "main" ]; then MODE=full; else MODE=light; fi
          echo "mode=$MODE (base_ref='$BASE_REF')"
          echo "test / linux   = $LINUX   (light path)"
          echo "test / macos   = $MACOS   (full only)"
          echo "test / windows = $WINDOWS   (full only)"

          FAILED=0
          if [ "$LINUX" != "success" ]; then
            echo "ERROR: test / linux = $LINUX (the light path requires success; a skip means a broken condition)"
            FAILED=1
          fi

          require_full_only() {
            if [ "$MODE" = "full" ]; then
              [ "$2" = "success" ] && return 0
              echo "ERROR: $1 = $2 (full mode requires success)"
              FAILED=1
              return 0
            fi
            [ "$2" = "skipped" ] && return 0
            echo "::warning::$1 = $2 on the light path — expected skipped; check its \`if:\` condition."
          }
          require_full_only "test / macos"   "$MACOS"
          require_full_only "test / windows" "$WINDOWS"

          if [ "$FAILED" = "1" ]; then
            echo "Test suite gate FAILED (mode=$MODE)."
            exit 1
          fi
          echo "Test suite gate passed (mode=$MODE)."
          exit 0
