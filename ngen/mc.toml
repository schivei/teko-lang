# mc.toml -- the whole directory built by `mc build`, no make and no
# hand-written ld line (docs/build.md):
#
#   mc build ngen              # from the repository root
#   mc build                   # from inside ngen/
#
# Two steps come out of it: the taught compiler (`build/mc-teko`, the `mc`
# core plus teko.mc, docs/design/port-teko-mc.md) and then tests/hello.tk
# compiled BY that binary into a native executable. Nothing in the `mc`
# repository's `src/` changes, and nothing in THIS repository's `src/`
# changes either -- `src/` is frozen (D211/D212 in this repo's
# DECISION_LOG.md); every new construct lives here, in `ngen/`.
#
# `os = "linux"` / `arch = "x86_64"` matches the CI runner (ubuntu-latest)
# and this repository's dev host; there is no `[sysroot]` because `[linker]`
# is the system's own `cc`, which already knows where its crt objects and
# libc are -- one line instead of pinning a musl sysroot for a program that,
# so far, links no libc symbol beyond `write`/`exit` (ngen/lib/rt.mc).

[project]
name  = "teko"
entry = "tests/hello.tk"
out   = "build/teko-hello"
kind  = "exe"

[target]
os   = "linux"
arch = "x86_64"

[compiler]
modules = ["teko.mc"]
out     = "build/mc-teko"

[linker]
cmd  = "cc"
args = ["-o", "{out}", "{obj}"]

# the static estimate is a function of source bytes and a taught compiler
# this small does not land anywhere near it; 1.0 is examples/lang's own
# starting point (see that project's mc.toml for the full rationale) and
# `mc limits ngen` is what tells whether it still holds once this project
# grows past the vertical slice.
[limits]
tolerance = 1.0

[include]
paths = ["lib"]
