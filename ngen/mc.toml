# mc.toml -- the whole directory built by `mc build`, no make and no
# hand-written ld line (docs/build.md):
#
#   mc build ngen              # from the repository root
#   mc build                   # from inside ngen/
#
# Two steps come out of it: the taught compiler (`build/teko`, D64.1's
# five parts -- `core_teko.mc` names four of them, `[compiler].core` the
# fifth -- plus `teko.mc`, docs/design/port-teko-mc.md) and then
# tests/hello.tk compiled BY that binary into a native executable.
# Nothing in the `mc` repository's `src/` changes, and nothing in THIS
# repository's `src/` changes either -- `src/` is frozen (D211/D212 in
# this repo's DECISION_LOG.md); every new construct lives here, in `ngen/`.

# `os = "linux"` / `arch = "x86_64"` matches the CI runner (ubuntu-latest)
# and this repository's dev host; there is no `[sysroot]` because `[linker]`
# is the system's own `cc`, which already knows where its crt objects and
# libc are -- one line instead of pinning a musl sysroot for a program that,
# so far, links no libc symbol beyond `write`/`exit` (ngen/lib/rt.mc).

[project]
name  = "teko"
entry = "tests/hello.tk"
out   = "build/teko-hello"
kind  = "exe"

[target]
os   = "linux"
arch = "x86_64"

[compiler]
core    = "<mc/core_min>"
modules = ["core_teko.mc", "teko.mc", "user.mc"]
out     = "build/teko"

[linker]
cmd  = "cc"
args = ["-o", "{out}", "{obj}"]

# the static estimate is a function of source bytes and a taught compiler
# this small does not land anywhere near it; 1.0 is examples/lang's own
# starting point (see that project's mc.toml for the full rationale) and
# `mc limits ngen` is what tells whether it still holds once this project
# grows past the vertical slice.
[limits]
tolerance = 1.0

[include]
paths = ["lib"]

# S3 (D64.7, docs/reference/packages.md §3): the `teko` package, "both", the
# runtime carried WITH the module -- lib/rt.mc is what a PROGRAM includes,
# teko.mc is what a COMPILER includes. This table is inert to `mc build`
# (only `[project]`/`[target]`/`[compiler]`/`[linker]`/`[include]`/`[limits]`
# drive a build); it is what `mc pkg hash` reads.
[package]
name   = "teko"
lib    = "lib/rt.mc"
module = "teko.mc"
files  = [
    "lib/rt.mc",
    "teko.mc",
    "teko_access.mc",
    "teko_array.mc",
    "teko_class.mc",
    "teko_const.mc",
    "teko_default.mc",
    "teko_deleg.mc",
    "teko_di.mc",
    "teko_expr.mc",
    "teko_float.mc",
    "teko_fwd.mc",
    "teko_generic.mc",
    "teko_heaparr.mc",
    "teko_iface.mc",
    "teko_loop.mc",
    "teko_ns.mc",
    "teko_ops.mc",
    "teko_over.mc",
    "teko_params.mc",
    "teko_prefix.mc",
    "teko_prop.mc",
    "teko_rc.mc",
    "teko_ref.mc",
    "teko_stmt.mc",
    "teko_struct.mc",
    "teko_switch.mc",
    "teko_ternary.mc",
    "teko_this.mc",
    "teko_trait.mc",
    "teko_type.mc",
    "teko_typeof.mc",
]
check  = ["teko.mc", "lib/rt.mc"]
